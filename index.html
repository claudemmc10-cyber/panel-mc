    </div>
    <span class="est">Estado de la estructura
      <span class="pill ${e.estado.toLowerCase()}">${esc(e.estado)}</span></span>
  </div>

  <div class="grid-pub anim">
    <section class="flow ${tono}">
      ${panelHead('Resultado del período publicitario', cerrada ? `Hasta el ${fch(a.fechaCierre)}`
        : 'De principio a fin de la publicidad')}
      <div class="flow-steps">
        <div class="rf-paso inv"><span class="rf-ico">${ICO.mega}</span>
          <span class="lbl">Invertido</span>
          <div class="f num ${cerrada ? '' : 'z'}">${eur0(a.inversion)}</div>
          <div class="cap">en publicidad</div></div>
        <div class="rf-flecha">${FLECHA}</div>
        <div class="rf-paso fac"><span class="rf-ico">${ICO.rev}</span>
          <span class="lbl">Generado</span>
          <div class="f num ${cerrada ? '' : 'z'}">${eur0(a.facturacion)}</div>
          <div class="cap">de facturación atribuida</div></div>
        <div class="rf-flecha">${FLECHA}</div>
        <div class="rf-paso roas ${tono}"><span class="rf-ico">${ICO.target}</span>
          <span class="lbl">ROAS</span>
          <div class="f num ${tono || 'z'}">${roasF(a.roas)}</div>
          <div class="cap">retorno de la inversión publicitaria</div></div>
      </div>
      <p class="rf-pie">${cerrada
        ? (ok(a.roas) ? `Cada euro invertido en publicidad generó <b>${eur(a.roas)}</b> de facturación.`
                      : 'Sin inversión registrada no se puede calcular el retorno.')
        : 'Los resultados aparecerán cuando se cierre el período publicitario.'}</p>
    </section>

    <div class="panel detalle">
      ${panelHead('Cifras del cierre', '')}
      ${fila(cerrada ? 'spend' : '', ICO.mega, 'Inversión publicitaria', eur0(a.inversion), cerrada ? '' : 'z',
        cerrada ? `Total del período publicitario${exacto(a.inversion)}` : 'Se introduce al cerrar la publicidad')}
      ${fila(cerrada ? 'rev' : '', ICO.rev, 'Facturación generada', eur0(a.facturacion), cerrada ? '' : 'z',
        cerrada ? `Atribuida a la publicidad${exacto(a.facturacion)}` : 'Se introduce al cerrar la publicidad')}
      ${fila(`roasbg ${tono}`, ICO.target, 'ROAS total', roasF(a.roas), tono || 'z',
        ok(a.roas) ? `<b>${eur(a.roas)}</b> por cada euro invertido`
          : cerrada ? 'Sin inversión no se puede calcular' : 'Facturación ÷ inversión')}
      <p class="panel-cap">Estas cifras son un <b>análisis de rendimiento publicitario</b>. No se suman
        como gasto ni como ingreso: profit, ROI, facturación y objetivos de la estructura no cambian
        al cerrar la publicidad.</p>
    </div>
  </div>

  <div class="kpis kpis-3 compacto anim">
    ${kpiCard({ico: ICO.bag, lbl: cerrada ? 'Pedidos al cierre' : 'Pedidos actuales',
      v: ent(pedidos), vcls: ok(pedidos) && pedidos > 0 ? 'alt' : 'z',
      foot: cerrada ? 'Foto guardada al cerrar la publicidad' : 'Quedarán fijados al cerrar la publicidad'})}
    ${kpiCard({ico: ICO.coin, lbl: 'Coste por pedido', v: eur(a.costePedido), vcls: z(a.costePedido),
      foot: cerrada && !ok(a.costePedido) ? 'Sin pedidos no se puede calcular' : 'Inversión ÷ pedidos'})}
    ${kpiCard({ico: ICO.ticket, lbl: 'Ticket medio', v: eur(a.ticketMedio), vcls: z(a.ticketMedio),
      foot: cerrada && !ok(a.ticketMedio) ? 'Sin pedidos no se puede calcular' : 'Facturación ÷ pedidos'})}
  </div>`;
}

function navHTML(actual){
  const est = D.estructuras.map(e => {
    const cl = e.estado === 'Activa' ? 'act' : (e.estado === 'Pausada' ? 'pau' : 'cer');
    const num = (e.id.match(/^\d+/) || [''])[0];
    return `<button class="rail-item est ${actual===e.id?'on':''}" data-go="${esc(e.id)}" title="${esc(e.id)}">
      <span class="rail-badge">${esc(num || e.id.slice(0, 3))}<i class="dot ${cl}"></i></span>
      <span class="rail-cap">${esc(e.id.replace(/^\d+-?/, '') || e.id)}</span></button>`;
  }).join('');
  return `
    <div class="rail-mark"><img class="crown" src="${MARCA.corona}" alt="ECOMKings"></div>
    <nav class="rail-nav">
      <button class="rail-item ${actual==='overview'?'on':''}" data-go="overview" title="Overview">
        <span class="rail-ic">${ICO.home}</span><span class="rail-cap">Overview</span></button>
      <div class="rail-sep"><span>Estructuras</span></div>
      ${est || `<div class="rail-empty">Ninguna todavía</div>`}
    </nav>
    <div class="rail-foot" title="Solo lectura · Datos del Excel maestro">${ICO.lock}</div>`;
}

function barHTML(actual){
  const e = actual === 'overview' ? null : D.estructuras.find(x => x.id === actual);
  return `
    <div class="crumbs">
      ${e ? `<span class="crumb">Estructuras</span>
             <span class="crumb-sep">${ICO.chev}</span>
             <span class="crumb on">${esc(e.id)}</span>`
          : `<span class="crumb on">Overview</span>`}
    </div>
    <div class="bar-status">
      <span class="chip">${ICO.lock}<span>Solo lectura · Datos del Excel maestro</span></span>
      <span class="chip">${ICO.clock}<span class="num">${esc(D.generado.replace('T',' '))}</span></span>
    </div>`;
}

/* barra superior de móvil (en escritorio está oculta): marca + navegación en cápsulas */
function topHTML(actual){
  const tabs = [`<button class="tab ${actual==='overview'?'on':''}" data-go="overview">${ICO.home}<span>Overview</span></button>`]
    .concat(D.estructuras.map(e => {
      const cl = e.estado === 'Activa' ? 'act' : (e.estado === 'Pausada' ? 'pau' : 'cer');
      return `<button class="tab est ${actual===e.id?'on':''}" data-go="${esc(e.id)}"><i class="dot ${cl}"></i><span>${esc(e.id)}</span></button>`;
    }));
  return `<div class="row"><div class="brand"><img class="crown" src="${MARCA.corona}" alt="ECOMKings"></div>
      <span class="top-ro">${ICO.lock}<span>Solo lectura</span></span></div>
    <nav class="tabs">${tabs.join('')}</nav>`;
}

/* ══════════════════════════════════════════════ OVERVIEW
   hero de objetivo → fila de 4 KPI → 2/3 estructura actual + 1/3 gasto →
   tabla de estructuras a todo el ancho */
function overview(){
  const t = D.totales;
  const act = D.estructuras.find(e => e.id === D.activaId);
  const avisos = D.avisos.map(a => `<div class="alert ${a.tipo}">${esc(a.texto)}</div>`).join('');

  /* En móvil la tabla no cabe: se pintan las dos y el CSS enseña la que toca.
     Nada de overflow-x. */
  const tarjetas = D.estructuras.map(e => `
    <button class="estcard" data-go="${esc(e.id)}">
      <div class="estcard-top">
        <span class="t-badge">${ICO.layers}</span>
        <b>${esc(e.id)}</b>
        <span class="pill ${e.estado.toLowerCase()}">${esc(e.estado)}</span>
      </div>
      <div class="estcard-hero">
        <span class="lbl">Profit</span>
        <b class="num ${e.beneficioNeto>=0?'pos':'neg'}">${eurS(e.beneficioNeto)}</b>
      </div>
      <div class="estcard-grid">
        <div><span class="lbl">Invertido</span><b class="num">${eur(e.costeTotal)}</b></div>
        <div><span class="lbl">Facturado neto</span><b class="num">${eur(e.facturacionNeta)}</b></div>
        <div><span class="lbl">ROI</span><b class="num ${e.beneficioNeto>=0?'pos':'neg'}">${pct(e.roi)}</b></div>
      </div>
      <div class="estcard-pie"><span>Margen ${pct(e.margen)}</span><span class="abrir">Abrir ${ICO.arrow}</span></div>
    </button>`).join('');

  const filas = D.estructuras.length ? D.estructuras.map(e => `
    <tr data-go="${esc(e.id)}">
      <td><div class="t-id"><span class="t-badge">${ICO.layers}</span><b>${esc(e.id)}</b></div></td>
      <td><span class="pill ${e.estado.toLowerCase()}">${esc(e.estado)}</span></td>
      <td class="n num">${eur(e.costeTotal)}</td>
      <td class="n num">${eur(e.facturacionNeta)}</td>
      <td class="n num ${e.beneficioNeto>=0?'pos':'neg'}">${eurS(e.beneficioNeto)}</td>
      <td class="n num">${pct(e.margen)}</td>
      <td class="n num">${pct(e.roi)}</td>
      <td class="t-go">${ICO.chev}</td>
    </tr>`).join('') : '';

  const neg = t.beneficioNeto < 0;
  return `
  ${avisos}
  <div class="pagehead anim">
    <span class="over">Todas las estructuras juntas · ${ent(t.nEstructuras)} estructura(s),
      ${ent(t.nActivas)} activa(s) · datos a ${fch(D.hoy)}</span>
    <h1>Resultado acumulado</h1>
  </div>

  ${metaHTML('Camino al millón de facturación', t.facturacionNeta, OBJ_GLOBAL,
             'Facturación acumulada')}

  <div class="kpis kpis-4 anim">
    ${kpiCard({cls: `principal ${neg ? 'neg' : ''}`, ico: ICO.profit, lbl: 'Profit acumulado',
      v: eurS(t.beneficioNeto), vcls: neg ? 'neg' : 'pos',
      foot: 'Facturación neta menos todos los gastos'})}
    ${kpiCard({ico: ICO.rev, lbl: 'Facturación neta', v: eur0(t.facturacionNeta),
      foot: `Bruta ${eur0(t.facturacionBruta)}`})}
    ${kpiCard({ico: ICO.inv, lbl: 'Total invertido', v: eur0(t.gastoTotal),
      foot: `${eur0(t.gastosDirectos)} estructuras · ${eur0(t.gastosGenerales)} generales`})}
    ${kpiCard({ico: ICO.roi, lbl: 'ROI global', v: pct(t.roi), vcls: neg ? 'neg' : 'pos',
      foot: `Margen neto ${pct(t.margen)}`})}
  </div>

  <div class="grid-ov anim">
    ${act ? bloqueActiva(act) : ''}
    <section class="ov-gasto">
      ${desgloseHTML(D.desgloseGlobal, t.gastoTotal,
        'Cada euro gastado, por partida. Los gastos generales aparecen con su propio '
        + 'nombre y etiqueta, de forma que la suma cuadra con el total invertido.',
        panelHead('En qué se ha gastado', 'Todas las estructuras juntas'))}
    </section>
  </div>

  <section class="panel tabla-panel anim">
    ${panelHead('Todas las estructuras', 'Pulsa para abrir')}
    ${filas ? `
      <div class="solo-ancho"><table>
        <thead><tr><th>Estructura</th><th>Estado</th><th class="n">Invertido</th>
          <th class="n">Facturado neto</th><th class="n">Profit</th><th class="n">Margen</th>
          <th class="n">ROI</th><th></th></tr></thead><tbody>${filas}</tbody></table></div>
      <div class="estlist solo-estrecho">${tarjetas}</div>`
      : vacio('Todavía no hay estructuras')}
  </section>`;
}

function bloqueActiva(e){
  const neg = e.beneficioNeto < 0;
  const m = (lbl, v, cls = '') => `<div class="m"><span class="lbl">${lbl}</span><b class="num ${cls}">${v}</b></div>`;
  return `
  <section class="panel spot">
    ${panelHead('Estructura actual', '',
      `<button class="linkbtn" data-go="${esc(e.id)}">Ver la estructura completa ${ICO.arrow}</button>`)}
    <div class="spot-id">
      <span class="spot-badge">${ICO.layers}</span>
      <div class="spot-name">
        <h3>${esc(e.id)} <span class="pill ${e.estado.toLowerCase()}">${esc(e.estado)}</span></h3>
        <div class="meta">
          <span>Inicio <b>${fch(e.inicio)}</b></span>
          <span>Fin <b>${e.fin?fch(e.fin):RAYA}</b></span>
          <span><b>${ent(e.dias)}</b> día(s) activa</span>
          <span><b>${ent(e.nMovimientos)}</b> movimiento(s)</span>
        </div>
      </div>
    </div>
    <div class="spot-grid">
      ${m('Invertido', eur0(e.costeTotal))}
      ${m('Fact. bruta', eur0(e.facturacionBruta))}
      ${m('Fact. neta', eur0(e.facturacionNeta))}
      ${m('Profit neto', eurS(e.beneficioNeto), neg ? 'neg' : 'pos')}
      ${m('Margen', pct(e.margen))}
      ${m('ROI', pct(e.roi), neg ? 'neg' : 'pos')}
    </div>
    <div class="spot-parts">
      ${m('Publicidad', eur0(e.publicidad))}
      ${m('Otros gastos', eur0(e.otrosGastos))}
      ${m('Generales del periodo', eur0(e.gastosGeneralesAsignados))}
    </div>
  </section>`;
}

/* ══════════════════════════════════════════════ PÁGINA DE ESTRUCTURA */
/* Misma plantilla para 001, 002, 003... nada esta escrito a medida. */
function paginaEst(id){
  const e = D.estructuras.find(x => x.id === id);
  if (!e) return `<div class="pagehead"><h1>No encontrada</h1></div>`;

  /* cabecera de proyecto: identidad + pestañas + metadatos en un solo bloque */
  return `
  <div class="esthead anim">
    <div class="esthead-id">
      <span class="est-badge">${ICO.layers}</span>
      <div>
        <span class="over">Estructura</span>
        <h1>${esc(e.id)} <span class="pill ${e.estado.toLowerCase()}">${esc(e.estado)}</span></h1>
      </div>
    </div>
    <div class="subtabs">
      <button class="subtab fin ${pestana==='finanzas'?'on':''}" data-tab="finanzas">
        ${ICO.chart}<span class="lg">Resumen financiero</span><span class="sm">Resumen</span></button>
      <button class="subtab ped ${pestana==='pedidos'?'on':''}" data-tab="pedidos">
        ${ICO.bag}<span class="lg">Pedidos y suscripciones</span><span class="sm">Pedidos</span>${
          e.pedidos.total ? `<span class="n num">${ent(e.pedidos.total)}</span>` : ''}</button>
      <button class="subtab pub ${pestana==='publicidad'?'on':''}" data-tab="publicidad">
        ${ICO.mega}<span class="lg">Publicidad / ROAS</span><span class="sm">Publicidad</span></button>
    </div>
    <div class="esthead-meta">
      <span>${ICO.cal}Inicio <b>${fch(e.inicio)}</b></span>
      <span>Fin <b>${e.fin?fch(e.fin):RAYA}</b></span>
      <span><b>${ent(e.dias)}</b> día(s)</span>
      <span><b>${ent(e.nMovimientos)}</b> gasto(s)</span>
      <span><b>${ent(e.nIngresos)}</b> registro(s) de facturación</span>
    </div>
  </div>

  ${pestana === 'pedidos' ? tabPedidos(e, D.hoy)
    : pestana === 'publicidad' ? tabPublicidad(e) : tabFinanzas(e)}`;
}

/* ---------------------------------------------- pestaña: resumen financiero
   objetivo (5/12) junto a KPIs 2×2 (7/12); debajo desglose 60 % + origen 40 % */
function tabFinanzas(e){
  const neg = e.beneficioNeto < 0;
  return `
  <div class="grid-fin anim">
    ${metaHTML('Camino a 50.000 € de facturación', e.facturacionNeta, OBJ_ESTRUCTURA,
               'Facturación de la estructura')}
    <div class="kpis kpis-2x2">
      ${kpiCard({cls: `principal ${neg ? 'neg' : ''}`, ico: ICO.profit, lbl: 'Profit neto',
        v: eurS(e.beneficioNeto), vcls: neg ? 'neg' : 'pos',
        foot: `Beneficio directo ${eurS(e.beneficioDirecto)} (sin gastos generales)`})}
      ${kpiCard({ico: ICO.rev, lbl: 'Facturación neta', v: eur0(e.facturacionNeta),
        foot: `Bruta ${eur0(e.facturacionBruta)}`})}
      ${kpiCard({ico: ICO.inv, lbl: 'Total invertido', v: eur0(e.costeTotal),
        foot: `${eur0(e.gastosDirectos)} directos · ${eur0(e.gastosGeneralesAsignados)} generales`})}
      ${kpiCard({ico: ICO.roi, lbl: 'ROI', v: pct(e.roi), vcls: neg ? 'neg' : 'pos',
        foot: `Margen ${pct(e.margen)}`})}
    </div>
  </div>

  <div class="grid-6040 anim">
    <section>
      ${desgloseHTML(e.desglose, e.costeTotal,
        'Gastos directos de la estructura más los gastos generales imputados a su período. '
        + 'La suma cuadra exactamente con el total invertido de arriba.',
        panelHead('Desglose de la inversión', e.publicidad>0 && e.costeTotal>0
          ? `Publicidad: ${pct(e.publicidad/e.costeTotal*100)} del total invertido`
          : 'Dónde ha ido cada euro'))}
    </section>
    <section>
      ${origenHTML(e, e.costeTotal, panelHead('Origen del dinero', 'Quién puso cada euro'))}
    </section>
  </div>`;
}

function pintar(mantener){
  const y = window.scrollY;
  document.getElementById('side').innerHTML = navHTML(actual);
  document.getElementById('topbar').innerHTML = topHTML(actual);
  document.getElementById('appbar').innerHTML = barHTML(actual);
  document.getElementById('view').innerHTML =
    actual === 'overview' ? overview() : paginaEst(actual);
  ajustarEtiquetas();
  scrollTo({top: mantener ? y : 0, behavior:'instant'});
}

/* ══════════════════════════════════════════════ ROUTER
   El hash lleva la estructura y, opcionalmente, la pestaña:
     #001-Estructura-MC            -> resumen financiero
     #001-Estructura-MC/pedidos    -> pedidos y suscripciones
   Asi el enlace se puede compartir y sobrevive a una recarga. */
let actual = 'overview';
let pestana = 'finanzas';

const PESTANAS = ['finanzas', 'pedidos', 'publicidad'];
function hashActual(){
  return actual === 'overview' ? ''
    : encodeURIComponent(actual) + (pestana !== 'finanzas' ? '/' + pestana : '');
}
function leerHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return {id:'overview', tab:'finanzas'};
  const i = h.lastIndexOf('/');
  const cola = i > 0 ? h.slice(i + 1) : '';
  const tab = cola !== 'finanzas' && PESTANAS.includes(cola) ? cola : 'finanzas';
  return {id: tab !== 'finanzas' ? h.slice(0, i) : h, tab};
}
document.addEventListener('click', ev => {
  const a = ev.target.closest('[data-act]');
  if (a){
    if (a.dataset.act === 'renov-mas')  renovAmpliado = true;
    if (a.dataset.act === 'renov-menos') renovAmpliado = false;
    pintar(true);
    return;
  }
  const t = ev.target.closest('[data-tab]');
  if (t){
    if (t.dataset.tab === pestana) return;
    pestana = t.dataset.tab;
    renovAmpliado = false;
    location.hash = hashActual();
    pintar();
    return;
  }
  const b = ev.target.closest('[data-go]');
  if (!b) return;
  /* al cambiar de estructura se vuelve siempre al resumen financiero:
     asi el comportamiento es el mismo pase lo que pase */
  actual = b.dataset.go;
  pestana = 'finanzas';
  renovAmpliado = false;
  location.hash = hashActual();
  pintar();
});
let temporizadorAncho = null, anchoPrevio = window.innerWidth;
addEventListener('resize', () => {
  if (window.innerWidth === anchoPrevio) return;   // el teclado móvil no cuenta
  anchoPrevio = window.innerWidth;
  clearTimeout(temporizadorAncho);
  temporizadorAncho = setTimeout(() => pintar(true), 160);
});
addEventListener('hashchange', () => {
  const {id, tab} = leerHash();
  if (id !== actual || tab !== pestana){
    actual = id; pestana = tab; renovAmpliado = false; pintar();
  }
});
function arrancar(datos){
  D = datos;
  const {id, tab} = leerHash();
  if (id !== 'overview' && D.estructuras.some(e => e.id === id)){
    actual = id; pestana = tab;
  }
  pintar();
}

</script>
