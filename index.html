<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0D13">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<title>M&amp;C Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

<style>
/* ═══════════════════════════════════════════════════ TOKENS */
:root{
  --bg:#0A0D13;  --panel:#121722;  --panel-2:#161C29;  --sunk:#0E131C;
  --line:#232B3B; --line-soft:#1A2130;
  --ink:#EAEFF8;  --ink-2:#93A1B9;  --ink-3:#5E6B84;

  /* series validadas para fondo oscuro */
  --rev:#2E9BD6;  --spend:#C57F14;  --prof:#17A87C;  --alt:#8B6BE8;
  /* variantes claras, solo para texto */
  --rev-t:#5CBFF0; --spend-t:#E4A73F; --prof-t:#3FD9A4; --loss-t:#FF7075;
  --loss:#C8484D;
  --m:#4C8FE8;    --c:#17A99A;      --k:#8B6BE8;
  /* suscripciones: la cuarta serie. --alt-t es solo texto (6,6:1 sobre panel) */
  --alt-t:#A78BFA; --alt-d:#6A4FC4;
  /* rampa dorada del objetivo: una sola tinta, clara -> oscura.
     -gold-d y -gold son marca; -gold-t es solo texto (10,7:1 sobre panel) */
  --gold-d:#A8801C; --gold:#D2A62E; --gold-t:#E8C55A;
  --gold-track:rgba(210,166,46,.11);   /* paso claro de la MISMA rampa */

  --r:14px; --r-sm:10px;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-feature-settings:"ss01";
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.02em;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* ═══════════════════════════════════════════════════ SHELL */
.app{display:flex;min-height:100vh}
aside{
  width:246px;flex:0 0 246px;border-right:1px solid var(--line-soft);
  background:linear-gradient(180deg,#0C1119,#0A0D13);
  padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 22px}
.brand .mark{
  width:34px;height:34px;border-radius:9px;flex:0 0 34px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--prof),#0E7A5B);color:#04140E;
  font-weight:700;font-size:13px;letter-spacing:-.04em;
  box-shadow:0 0 0 1px rgba(255,255,255,.07), 0 6px 18px -8px var(--prof);
}
.brand b{font-size:15px;font-weight:600;display:block;letter-spacing:-.02em}
.brand span{font-size:11px;color:var(--ink-3);display:block;margin-top:1px}
.navgroup{margin-bottom:20px}
.navgroup > .eyebrow{padding:0 9px 8px}
.navlink{
  display:flex;align-items:center;gap:10px;padding:8.5px 10px;border-radius:9px;
  color:var(--ink-2);font-size:13.5px;font-weight:500;transition:background .14s,color .14s;
  width:100%;text-align:left;
}
.navlink:hover{background:var(--panel);color:var(--ink)}
.navlink.on{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.navlink .dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px;background:var(--ink-3)}
.navlink.on .dot,.navlink .dot.act{background:var(--prof);box-shadow:0 0 0 3px rgba(23,168,124,.16)}
.navlink .dot.cer{background:var(--ink-3)}
.navlink .dot.pau{background:var(--spend)}
.sidefoot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line-soft);
  font-size:11px;color:var(--ink-3);line-height:1.6}

main{flex:1;min-width:0;padding:34px 40px 90px;max-width:1320px}

/* barra móvil */
.topbar{display:none}

/* ═══════════════════════════════════════════════════ CABECERA */
.pagehead{margin-bottom:26px}
.pagehead h1{font-size:27px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.pagehead .sub{color:var(--ink-3);font-size:13.5px;margin-top:7px}
.pill{
  display:inline-flex;align-items:center;gap:6px;font-family:"JetBrains Mono",monospace;
  font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 10px;border-radius:100px;border:1px solid;
}
.pill.activa{color:var(--prof-t);border-color:rgba(23,168,124,.4);background:rgba(23,168,124,.1)}
.pill.cerrada{color:var(--ink-2);border-color:var(--line);background:var(--panel)}
.pill.pausada{color:var(--spend-t);border-color:rgba(197,127,20,.4);background:rgba(197,127,20,.1)}

/* ═══════════════════════════════════════════════════ KPI */
.kpis{display:grid;gap:14px;margin-bottom:14px}
.kpis.hero{grid-template-columns:1.55fr 1fr 1fr 1fr}
.kpis.four{grid-template-columns:repeat(4,1fr)}
.card{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:19px 21px;box-shadow:var(--sh);position:relative;overflow:hidden;
  transition:border-color .16s, transform .16s;
}
.card:hover{border-color:var(--line)}
.kpi .lbl{display:block;margin-bottom:11px}
.kpi .v{display:block;font-size:31px;font-weight:600;letter-spacing:-.035em;line-height:1.05}
.kpi .foot{display:block;margin-top:9px;font-size:12.5px;color:var(--ink-3)}
.kpi.big .v{font-size:clamp(38px,4.6vw,58px)}
.kpi.big{background:
  radial-gradient(120% 130% at 0% 0%, rgba(23,168,124,.13), transparent 58%),
  var(--panel);}
.kpi.big.neg{background:
  radial-gradient(120% 130% at 0% 0%, rgba(200,72,77,.13), transparent 58%),
  var(--panel);}
.v.pos{color:var(--prof-t)} .v.neg{color:var(--loss-t)}
.v.rev{color:var(--rev-t)} .v.spend{color:var(--spend-t)}
.trendbar{position:absolute;left:0;top:0;bottom:0;width:3px}
.trendbar.pos{background:var(--prof)} .trendbar.neg{background:var(--loss)}
.trendbar.rev{background:var(--rev)} .trendbar.spend{background:var(--spend)}
.trendbar.neutral{background:var(--line)}

/* ═══════════════════════════════════════════════════ SECCIONES */
section{margin-top:34px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  margin-bottom:14px;flex-wrap:wrap}
.sechead h2{font-size:16.5px}
.sechead .note{font-size:12.5px;color:var(--ink-3)}

/* estructura activa destacada */
.spot{
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:linear-gradient(135deg,rgba(23,168,124,.07),transparent 46%),var(--panel);
  box-shadow:var(--sh);
}
.spot.neg{background:linear-gradient(135deg,rgba(200,72,77,.07),transparent 46%),var(--panel)}
.spot .top{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:19px 22px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.spot .top h3{font-size:19px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.spot .meta{display:flex;gap:20px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.spot .meta b{color:var(--ink-2);font-weight:500}
.spot .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line-soft)}
.spot .grid > div{background:var(--panel);padding:16px 20px}
.spot .grid .lbl{display:block;margin-bottom:7px}
.spot .grid .v{font-size:20px;font-weight:600;letter-spacing:-.025em}
.spot .cta{padding:13px 22px;border-top:1px solid var(--line-soft);
  display:flex;justify-content:flex-end}
.linkbtn{font-size:13px;font-weight:500;color:var(--ink-2);display:inline-flex;
  align-items:center;gap:7px;padding:6px 12px;border-radius:8px;
  border:1px solid var(--line);transition:.15s}
.linkbtn:hover{color:var(--ink);border-color:var(--ink-3);background:var(--panel-2)}

/* ═══════════════════════════════════════════════════ TABLA */
.tablewrap{border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;
  background:var(--panel);box-shadow:var(--sh)}
.scroller{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:660px}
thead th{
  font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);text-align:left;padding:13px 16px;
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk);
}
th.n,td.n{text-align:right}
tbody td{padding:14px 16px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .13s}
tbody tr:hover td{background:var(--panel-2)}
td.name{font-weight:600;letter-spacing:-.01em}
.empty{padding:44px 22px;text-align:center;color:var(--ink-3);font-size:13.5px}
.empty .big{display:block;font-size:15px;color:var(--ink-2);margin-bottom:6px;font-weight:500}

/* ═══════════════════════════════════════════════════ AVISOS */
.alert{display:flex;gap:12px;padding:13px 16px;border-radius:var(--r-sm);font-size:13px;
  margin-bottom:12px;border:1px solid}
.alert.info{background:rgba(46,155,214,.08);border-color:rgba(46,155,214,.3);color:var(--ink-2)}
.alert.error{background:rgba(200,72,77,.1);border-color:rgba(200,72,77,.4);color:#FFB9BB}

/* ═══════════════════════════════════════════════════ ANIMACIÓN */
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.anim{animation:rise .42s cubic-bezier(.22,1,.36,1) both}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ═══════════════════════════════════════════════════ OBJETIVO (meter) */
.goal{
  margin-top:0;margin-bottom:26px;border-radius:var(--r);position:relative;overflow:hidden;
  border:1px solid rgba(210,166,46,.26);
  background:
    radial-gradient(90% 150% at 100% 0%, rgba(210,166,46,.10), transparent 60%),
    linear-gradient(160deg,#151417,#101319 46%),var(--panel);
  padding:22px 26px 20px;box-shadow:var(--sh);
}
.goal::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(232,197,90,.5),transparent)}
.goal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;
  flex-wrap:wrap;margin-bottom:18px}
.goal-head h2{font-size:14px;letter-spacing:.1em;text-transform:uppercase;
  font-family:"JetBrains Mono",monospace;font-weight:600;color:var(--gold-t)}
.goal-title{display:flex;align-items:center;gap:11px;min-width:0}
.goal-title .dia{width:9px;height:9px;flex:0 0 9px;transform:rotate(45deg);border-radius:2px;
  background:linear-gradient(140deg,var(--gold-t),var(--gold-d));
  box-shadow:0 0 0 3px rgba(210,166,46,.14)}
.goal-target{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:500;
  letter-spacing:.06em;color:var(--ink-2);border:1px solid rgba(210,166,46,.3);
  background:rgba(210,166,46,.07);padding:5px 12px;border-radius:100px;white-space:nowrap}
.goal-figs{display:grid;grid-template-columns:repeat(3,auto);gap:14px 46px;
  justify-content:start;margin-bottom:19px}
.goal-figs > div{display:flex;flex-direction:column;justify-content:flex-end}
.goal-figs .lbl{display:block;margin-bottom:6px}
/* cifras proporcionales: son numeros grandes sueltos, no una columna */
.goal-figs .f{font-size:30px;font-weight:600;letter-spacing:-.035em;line-height:1.05}
.goal-figs .f.gold{color:var(--gold-t)}
.goal-figs .f.rev{color:var(--rev-t)} .goal-figs .f.neg{color:var(--loss-t)}
.goal-track{height:16px;border-radius:9px;background:var(--gold-track);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(210,166,46,.16)}
.goal-fill{display:block;height:100%;border-radius:0 9px 9px 0;
  background:linear-gradient(90deg,var(--gold-d),var(--gold));
  box-shadow:0 0 18px -4px rgba(210,166,46,.65);
  transition:width .7s cubic-bezier(.22,1,.36,1)}
.goal-foot{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  margin-top:10px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
.goal-foot .mono{font-size:10.5px}
.goal-foot .msg{color:var(--ink-2);text-align:center;flex:1 1 auto}

/* ═══════════════════════════════════════════════════ BLOQUE ANCHO */
.panelbig{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);
  box-shadow:var(--sh);overflow:hidden}
.panelbig .cap{font-size:12.5px;color:var(--ink-3);padding:19px 28px 0;max-width:78ch}

/* desglose de la inversion */
.brk{padding:20px 28px 10px}
.brk-row{display:grid;grid-template-columns:minmax(155px,1.15fr) 3fr minmax(104px,auto) minmax(62px,auto);
  gap:22px;align-items:center;padding:15px 0}
.brk-row + .brk-row{border-top:1px solid var(--line-soft)}
.brk-name{font-size:15px;font-weight:500;color:var(--ink);display:flex;align-items:center;
  gap:9px;min-width:0}
.brk-name span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-family:"JetBrains Mono",monospace;font-size:9px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:3px 7px;border-radius:5px;flex:0 0 auto;
  color:var(--ink-3);border:1px solid var(--line);background:var(--sunk)}
.tag.gen{color:var(--rev-t);border-color:rgba(46,155,214,.32);background:rgba(46,155,214,.09)}
.tag.res{color:var(--loss-t);border-color:rgba(200,72,77,.4);background:rgba(200,72,77,.1)}
.brk-track{height:16px;border-radius:7px;background:var(--sunk);overflow:hidden}
.brk-fill{display:block;height:100%;border-radius:0 7px 7px 0;min-width:4px;
  transition:width .55s cubic-bezier(.22,1,.36,1)}
.brk-amt{font-family:"JetBrains Mono",monospace;font-size:16px;font-weight:600;
  text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.brk-pct{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink-2);
  text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.brk-total{display:grid;
  grid-template-columns:minmax(155px,1.15fr) 3fr minmax(104px,auto) minmax(62px,auto);
  gap:22px;align-items:center;padding:19px 28px;background:var(--sunk);
  border-top:1px solid var(--line)}
.brk-total .k{font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.brk-total .v{grid-column:3;font-family:"JetBrains Mono",monospace;font-size:20px;
  font-weight:600;text-align:right;color:var(--spend-t);font-variant-numeric:tabular-nums;
  white-space:nowrap}
.brk-total .q{grid-column:4;text-align:right;font-size:11px;color:var(--prof-t);white-space:nowrap}

/* origen del dinero */
.orig{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft);
  border-bottom:1px solid var(--line-soft)}
.orig-tile{background:var(--panel);padding:24px 28px 26px}
.orig-tile .lbl{display:block;margin-bottom:9px}
.orig-tile .f{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.05;
  margin-bottom:13px}
.orig-tile .f.z{color:var(--ink-3)}
.orig-bar{height:14px;border-radius:6px;background:var(--sunk);overflow:hidden}
.orig-bar span{display:block;height:100%;border-radius:0 6px 6px 0;
  transition:width .55s cubic-bezier(.22,1,.36,1)}
.orig-share{margin-top:12px;font-family:"JetBrains Mono",monospace;font-size:12.5px;
  font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.orig-sub{margin-top:5px;font-size:12px;color:var(--ink-3);line-height:1.45}
.orig-sub b{color:var(--ink-2);font-weight:600}
.recon{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft)}
.recon > div{background:var(--sunk);padding:16px 28px}
.recon .lbl{display:block;margin-bottom:6px}
.recon b{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:600;
  font-variant-numeric:tabular-nums}
.recon .ok b{color:var(--prof-t)}
.recon .warn b{color:var(--loss-t)}


/* ═══════════════════════════════════════════ PESTAÑAS DE LA ESTRUCTURA */
.subtabs{display:flex;gap:5px;margin:0 0 26px;padding:5px;border-radius:13px;
  background:var(--sunk);border:1px solid var(--line-soft);width:fit-content;
  max-width:100%;overflow-x:auto;scrollbar-width:none;box-shadow:var(--sh)}
.subtabs::-webkit-scrollbar{display:none}
.subtab{flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;padding:9px 16px;
  border-radius:9px;font-size:13.5px;font-weight:500;color:var(--ink-3);white-space:nowrap;
  transition:color .15s,background .15s,box-shadow .15s}
.subtab:hover{color:var(--ink-2)}
.subtab.on{color:var(--ink);background:var(--panel-2);
  box-shadow:inset 0 0 0 1px var(--line), 0 5px 16px -10px rgba(0,0,0,.95)}
.subtab .dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px;background:var(--ink-3);
  transition:background .15s,box-shadow .15s}
.subtab.fin.on .dot{background:var(--prof);box-shadow:0 0 0 3px rgba(23,168,124,.16)}
.subtab.ped.on .dot{background:var(--alt);box-shadow:0 0 0 3px rgba(139,107,232,.2)}
.subtab .n{font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:600;
  padding:1.5px 7px;border-radius:100px;color:var(--ink-3);border:1px solid var(--line);
  font-variant-numeric:tabular-nums}
.subtab.on .n{color:var(--alt-t);border-color:rgba(167,139,250,.36);
  background:rgba(167,139,250,.09)}
.subtab .sm{display:none}

/* ═══════════════════════════════════════════ PEDIDOS Y SUSCRIPCIONES
   Cuarta serie de la paleta (morado) = suscripciones. No compite con
   facturacion (azul), inversion (ambar) ni beneficio (verde). */
.kpis.tres{grid-template-columns:repeat(3,1fr)}
.trendbar.alt{background:var(--alt)}
.v.alt{color:var(--alt-t)}
.kpi.altbg{background:
  radial-gradient(120% 130% at 0% 0%, rgba(139,107,232,.15), transparent 58%),
  var(--panel);}
.kpi.grande .v{font-size:clamp(34px,3.7vw,47px)}
.kpi.grande .v.fecha{font-size:clamp(27px,2.8vw,36px)}
.kpi .foot b{color:var(--ink-2);font-weight:600}

/* ---- gráfica de pedidos por día · línea con puntos
   El SVG se estira con preserveAspectRatio="none" (coordenadas en %), asi que
   es responsive sin medir nada en JS; vector-effect mantiene el grosor real
   del trazo pese al estirado. Los puntos son HTML colocados en porcentajes. */
.lcwrap{padding:24px 28px 18px}
.lc{padding-left:40px;position:relative}
.lc-plot{position:relative;height:326px}
.lc-line{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line-soft);
  pointer-events:none}
.lc-line.base{border-top-color:var(--line)}
.lc-line b{position:absolute;right:calc(100% + 11px);top:-7.5px;font-weight:400;
  font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.lc-area{position:absolute;left:13px;right:13px;top:0;bottom:0}
.lc-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;
  animation:trazo .5s cubic-bezier(.22,1,.36,1) both}
@keyframes trazo{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.lc-hit{position:absolute;top:0;bottom:0;transform:translateX(-50%)}
.lc-hit::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:transparent;transition:background .13s}
.lc-hit:hover::before{background:rgba(167,139,250,.32)}
.lc-dot{position:absolute;left:50%;width:11px;height:11px;border-radius:50%;
  transform:translate(-50%,50%);background:var(--panel);border:2.5px solid var(--alt-t);
  box-shadow:0 0 0 4px rgba(139,107,232,.10);pointer-events:none;
  animation:aparecer .45s ease-out both;
  transition:width .13s,height .13s,background .13s,box-shadow .13s,border-color .13s}
.lc-hit:hover .lc-dot{width:15px;height:15px;background:var(--alt-t);
  box-shadow:0 0 0 6px rgba(139,107,232,.2)}
.lc-area.denso .lc-dot{width:6px;height:6px;border-width:2px;box-shadow:none}
.lc-area.denso .lc-hit:hover .lc-dot{width:13px;height:13px;border-width:2.5px;
  background:var(--alt-t);box-shadow:0 0 0 5px rgba(139,107,232,.2)}
.lc-tip{position:absolute;left:50%;transform:translateX(-50%);z-index:5;
  background:#1B2231;border:1px solid var(--line);border-radius:9px;padding:8px 12px;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.9);white-space:nowrap;
  display:none;pointer-events:none}
.lc-hit:hover .lc-tip{display:block;animation:aparecer .14s ease-out both}
.lc-hit.xi .lc-tip{left:0;transform:none}
.lc-hit.xf .lc-tip{left:auto;right:0;transform:none}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
.lc-tip .d{display:block;font-size:11px;color:var(--ink-3);margin-bottom:3px}
.lc-tip .v{font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:600;
  color:var(--alt-t);font-variant-numeric:tabular-nums}
.lc-tip .v.z{color:var(--ink-2)}
.lc-x{position:relative;height:22px;margin:9px 13px 0}
.lc-x span{position:absolute;transform:translateX(-50%);white-space:nowrap;
  font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-3)}
.lc-x span.off{display:none}
.lc-x span.xi{transform:none}
.lc-x span.xf{transform:translateX(-100%)}

/* ---- próximas renovaciones, a ancho completo */
.rn-head{display:grid;grid-template-columns:minmax(160px,auto) 1fr minmax(104px,auto);
  gap:26px;padding:15px 28px 14px;border-bottom:1px solid var(--line);background:var(--sunk)}
.rn-head span:last-child{text-align:right}
.rn{padding:6px 28px 4px}
.rn-row{display:grid;grid-template-columns:minmax(160px,auto) 1fr minmax(104px,auto);
  gap:26px;align-items:center;padding:15px 0}
.rn-row + .rn-row{border-top:1px solid var(--line-soft)}
.rn-f b{display:block;font-family:"JetBrains Mono",monospace;font-size:15.5px;
  font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.rn-f span{display:block;margin-top:3px;font-size:11.5px;color:var(--ink-3)}
.rn-row.pronto .rn-f span{color:var(--alt-t)}
.rn-t{height:16px;border-radius:7px;background:var(--sunk);overflow:hidden}
.rn-t span{display:block;height:100%;border-radius:0 7px 7px 0;min-width:4px;
  background:linear-gradient(90deg,var(--alt-d),var(--alt));
  transition:width .55s cubic-bezier(.22,1,.36,1)}
.rn-n{text-align:right;font-family:"JetBrains Mono",monospace;font-size:20px;
  font-weight:600;color:var(--alt-t);font-variant-numeric:tabular-nums;white-space:nowrap}

.rn-total{display:grid;grid-template-columns:minmax(160px,auto) 1fr minmax(104px,auto);
  gap:26px;align-items:center;padding:18px 28px;background:var(--sunk);
  border-top:1px solid var(--line)}
.rn-total .k{font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.rn-total .v{grid-column:3;text-align:right;font-family:"JetBrains Mono",monospace;
  font-size:20px;font-weight:600;color:var(--alt-t);font-variant-numeric:tabular-nums}
.rn-total .q{grid-column:2;font-size:11.5px;color:var(--ink-3)}
.rn-more{margin:16px 28px 20px;width:calc(100% - 56px);justify-content:center}
.rn-foot{padding:0 28px 20px;font-size:11.5px;color:var(--ink-3);line-height:1.5}
.rn-foot b{color:var(--ink-2);font-weight:600}

/* ═══════════════════════════════════════════════════ RESPONSIVE */
@media (max-width:1180px){
  .kpis.hero{grid-template-columns:1fr 1fr}
  .spot .grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:900px){
  main{padding:26px 24px 80px}
  .goal-figs{gap:14px 30px}
  .goal-figs .f{font-size:26px}
  .orig{grid-template-columns:1fr}
  .recon{grid-template-columns:1fr 1fr}
  .kpis.tres{grid-template-columns:1fr 1fr}
  /* la tercera tarjeta ocupa la fila entera, como el KPI grande del resumen */
  .kpis.tres > :last-child{grid-column:1/-1}
  .lcwrap{padding:20px 22px 16px}
  .lc-plot{height:290px}
  .rn,.rn-total,.rn-foot,.rn-head{padding-left:22px;padding-right:22px}
  .rn-more{margin-left:22px;margin-right:22px;width:calc(100% - 44px)}
}
@media (max-width:760px){
  aside{display:none}
  .app{display:block}
  main{padding:0 16px 80px;max-width:none}
  .topbar{
    display:block;position:sticky;top:0;z-index:40;background:rgba(10,13,19,.92);

  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:7px 13px;border-radius:100px;font-size:12.5px;font-weight:500;
    color:var(--ink-2);border:1px solid var(--line-soft);background:var(--panel);
    white-space:nowrap}
  .tab.on{color:var(--ink);border-color:var(--line);background:var(--panel-2)}
  .pagehead h1{font-size:22px}
  .kpis.hero,.kpis.four{grid-template-columns:1fr 1fr}
  .kpis.hero > .kpi.big{grid-column:1/-1}
  .spot .grid{grid-template-columns:1fr 1fr}
  .card{padding:16px 17px}
  .kpi .v{font-size:25px}
  .spot .grid .v{font-size:17px}

  /* objetivo: las tres cifras en columna, sin encoger la barra */
  .goal{padding:19px 17px 17px;margin-bottom:20px}
  .goal-head{margin-bottom:15px}
  .goal-head h2{font-size:12px}
  .goal-figs{grid-template-columns:1fr 1fr;gap:13px 18px;margin-bottom:16px}

  .goal-figs .f{font-size:23px}
  .goal-figs > div:first-child .f{font-size:28px}
  .goal-track{height:14px}
  /* en movil los extremos sobran: el objetivo ya esta en la pildora de arriba */
  .goal-foot{font-size:11.5px;justify-content:flex-start}
  .goal-foot .mono{display:none}
  .goal-foot .msg{text-align:left}

  /* desglose: nombre arriba, barra y cifras debajo */
  .brk{padding:14px 17px 6px}
  .brk-row{grid-template-columns:1fr auto;gap:9px 12px;padding:15px 0}
  .brk-name{grid-column:1;grid-row:1;font-size:13.5px}
  .brk-pct{grid-column:2;grid-row:1;font-size:12px}
  .brk-track{grid-column:1;grid-row:2;height:13px}
  .brk-amt{grid-column:2;grid-row:2;font-size:14px}
  .brk-total{grid-template-columns:1fr auto;gap:6px 12px;padding:14px 17px}
  .brk-total .k{grid-column:1;grid-row:1}
  .brk-total .v{grid-column:2;grid-row:1;font-size:16.5px}
  .brk-total .q{grid-column:1/-1;grid-row:2;text-align:left}

  .orig-tile{padding:19px 17px 21px}
  .orig-tile .f{font-size:26px}
  .recon > div{padding:13px 17px}
  .panelbig .cap{padding:14px 17px 0}

  /* pedidos: una columna, gráfica a ancho completo y sin scroll de página */
  .subtabs{width:100%;margin-bottom:20px}
  .subtab{flex:1 1 0;justify-content:center;padding:9px 10px;font-size:13px;gap:8px}
  .subtab .lg{display:none}
  .subtab .sm{display:inline}
  .kpis.tres{grid-template-columns:1fr}
  .kpi.grande .v{font-size:34px}
  .kpi.grande .v.fecha{font-size:29px}
  .lcwrap{padding:16px 14px 12px}
  .lc{padding-left:27px}
  .lc-plot{height:236px}
  .lc-area{left:11px;right:11px}
  .lc-x{margin-left:11px;margin-right:11px}
  .lc-line b{font-size:9.5px}
  .lc-x span{font-size:9.5px}
  .lc-dot{width:10px;height:10px;border-width:2px}
  .rn-head{grid-template-columns:1fr auto;gap:14px;padding:13px 17px 12px}
  .rn-head span:nth-child(2){display:none}
  .rn{padding:4px 17px 0}
  .rn-row{grid-template-columns:1fr auto;gap:8px 14px;padding:14px 0}
  .rn-f{grid-column:1;grid-row:1}
  .rn-n{grid-column:2;grid-row:1;font-size:18px}
  .rn-t{grid-column:1/-1;grid-row:2;height:12px}
  .rn-total{grid-template-columns:1fr auto;gap:5px 14px;padding:15px 17px}
  .rn-total .k{grid-column:1;grid-row:1}
  .rn-total .v{grid-column:2;grid-row:1;font-size:17px}
  .rn-total .q{grid-column:1/-1;grid-row:2}
  .rn-more{margin:14px 17px 17px;width:calc(100% - 34px)}
  .rn-foot{padding:0 17px 17px}
}
@media (max-width:400px){
  .kpis.hero,.kpis.four{grid-template-columns:1fr}
  .goal-figs > div:first-child .f{font-size:26px}
}

  const form = document.getElementById('gform');
  const inp = document.getElementById('gpass');
  const btn = document.getElementById('gbtn');
  const err = document.getElementById('gerr');
  const rec = document.getElementById('grec');
  const CLAVE = 'mc-dash-pass';

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function abrir(pass){
    if (!(window.crypto && crypto.subtle))
      throw new Error('Este navegador no permite descifrar aquí (hace falta HTTPS).');
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
                                             'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(PAQ.salt), iterations:PAQ.iter, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const claro = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAQ.iv)}, k, b64(PAQ.ct));
    return JSON.parse(new TextDecoder().decode(claro));
  }

  async function entrar(pass, recordar){
    btn.disabled = true; btn.textContent = 'Descifrando…'; err.textContent = '';
    try {
      const datos = await abrir(pass);
      if (recordar) try { localStorage.setItem(CLAVE, pass); } catch(e){}
      g.style.transition = 'opacity .3s'; g.style.opacity = 0;
      setTimeout(() => g.remove(), 320);
      arrancar(datos);
    } catch(e){
      try { localStorage.removeItem(CLAVE); } catch(_){}
      err.textContent = e.message && e.message.includes('HTTPS')
        ? e.message : 'Contraseña incorrecta.';
      btn.disabled = false; btn.textContent = 'Entrar';
      inp.value = ''; inp.focus();
    }
  }

  form.addEventListener('submit', e => { e.preventDefault(); entrar(inp.value, rec.checked); });

  let guardada = null;
  try { guardada = localStorage.getItem(CLAVE); } catch(e){}
  if (guardada){ rec.checked = true; entrar(guardada, true); } else { inp.focus(); }
})();
</script>

<body>
<div class="app">
  <aside id="side"></aside>
  <main>
    <div class="topbar" id="topbar"></div>
    <div id="view"></div>
  </main>
</div>

<script>
let D = null;

/* ══════════════════════════════════════════════ FORMATO (es-ES) */
/* useGrouping:'always' para que 2500 salga como «2.500 €» y no «2500 €» */
const nf  = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',
              minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:'always'});
const nf0 = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',
              maximumFractionDigits:0, useGrouping:'always'});
const RAYA = '—';
const ok = v => typeof v === 'number' && isFinite(v);
const eur  = v => ok(v) ? nf.format(v) : RAYA;
const eur0 = v => ok(v) ? nf0.format(v) : RAYA;
const eurS = v => ok(v) ? (v > 0 ? '+' : '') + nf0.format(v) : RAYA;
const pct  = v => ok(v) ? new Intl.NumberFormat('es-ES',{minimumFractionDigits:1,
               maximumFractionDigits:1}).format(v) + ' %' : RAYA;
const ent  = v => ok(v) ? new Intl.NumberFormat('es-ES').format(v) : RAYA;
const fch  = s => { if(!s) return RAYA; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; };
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const vacio = (t) => `<div class="empty"><span class="big">${esc(t||'Sin datos todavía')}</span>
  Aparecerá aquí en cuanto se registre en el Excel.</div>`;

/* ══════════════════════════════════════════════ OBJETIVOS
   Meter de una sola tinta (rampa dorada) sobre pista del mismo tono.
   Reglas: la barra nunca es negativa ni pasa del 100 %, y lo que falta
   nunca supera al objetivo aunque haya perdidas. */
const OBJ_GLOBAL = 1000000;
const OBJ_ESTRUCTURA = 50000;

const pctMeta = v => v <= 0 ? '0 %'
  : v < 0.1 ? '< 0,1 %'
  : new Intl.NumberFormat('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1})
      .format(v) + ' %';

function metaHTML(titulo, facturacion, objetivo, etiqueta){
  /* La barra se alimenta EXCLUSIVAMENTE de facturación neta registrada.
     Ni profit, ni ROI, ni gastos, ni saldo entran aquí. */
  const p       = ok(facturacion) ? facturacion : 0;
  const logrado = Math.max(0, p);                    // nunca cuenta en negativo
  const pv      = objetivo > 0 ? logrado / objetivo * 100 : 0;
  const ancho   = Math.min(100, pv);                 // tope visual en 100 %
  const falta   = Math.max(0, objetivo - logrado);   // nunca mas que el objetivo
  const completo = p >= objetivo;                    // barra al 100 %
  const excede   = p >  objetivo;                    // solo entonces: EXCEDENTE

  const msg = p < 0
      ? 'Facturación neta negativa: hay más devoluciones y contracargos que ventas.'
    : p === 0
      ? 'Todavía sin facturación registrada.'
    : excede
      ? `Objetivo superado en ${eur0(p - objetivo)}.`
    : completo
      ? '¡Objetivo alcanzado!'
      : `Queda el ${pctMeta(100 - pv)} del camino.`;

  return `
  <section class="goal anim">
    <div class="goal-head">
      <div class="goal-title"><span class="dia"></span><h2>${esc(titulo)}</h2></div>
      <span class="goal-target">Objetivo · ${nf0.format(objetivo)}</span>
    </div>
    <div class="goal-figs">
      <div><span class="lbl eyebrow">${esc(etiqueta)}</span>
        <div class="f num ${p<0?'neg':'rev'}">${eur0(p)}</div></div>
      <div><span class="lbl eyebrow">Conseguido</span>
        <div class="f gold">${esc(pctMeta(pv))}</div></div>
      <div><span class="lbl eyebrow">${excede?'Excedente':'Falta para el objetivo'}</span>
        <div class="f">${excede?eur0(p-objetivo):eur0(falta)}</div></div>
    </div>
    <div class="goal-track">
      <span class="goal-fill" style="width:${ancho.toFixed(4)}%"></span></div>
    <div class="goal-foot">
      <span class="mono">0 €</span>
      <span class="msg">${esc(msg)}</span>
      <span class="mono">${nf0.format(objetivo)}</span>
    </div>
  </section>`;
}

/* ══════════════════════════════════════════════ DESGLOSE DE LA INVERSIÓN
   Una fila por partida real. Los generales imputados salen con su propio
   nombre y etiqueta: asi la suma cuadra SIEMPRE con el total invertido. */
function colorPartida(x){
  if (x.tipo === 'residual') return 'var(--loss)';
  if (x.tipo === 'general')  return 'var(--rev)';
  return x.nombre === 'Publicidad' ? 'var(--spend-t)' : 'var(--spend)';
}
function desgloseHTML(items, total, nota){
  if (!items.length) return `<div class="panelbig">${vacio('Todavía no hay gastos')}</div>`;
  const max = Math.max(...items.map(i => Math.abs(i.importe)), 1);
  const suma = items.reduce((a,b) => a + b.importe, 0);
  const cuadra = Math.abs(suma - total) < 0.005;
  const filas = items.map(x => `
    <div class="brk-row">
      <div class="brk-name"><span class="t" title="${esc(x.nombre)}">${esc(x.nombre)}</span>${
        x.tipo === 'general'  ? '<span class="tag gen">general</span>' :
        x.tipo === 'residual' ? '<span class="tag res">sin clasificar</span>' : ''}</div>
      <span class="brk-track"><span class="brk-fill" style="width:${
        (Math.max(0,x.importe)/max*100).toFixed(2)}%;background:${colorPartida(x)}"></span></span>
      <div class="brk-amt">${eur(x.importe)}</div>
      <div class="brk-pct">${pct(x.pct)}</div>
    </div>`).join('');
  return `
  <div class="panelbig">
    ${nota ? `<p class="cap">${nota}</p>` : ''}
    <div class="brk">${filas}</div>
    <div class="brk-total">
      <div class="k">Total invertido</div>
      <div class="v num">${eur(total)}</div>
      <div class="q">${cuadra ? '✓ el desglose cuadra'
        : `⚠ diferencia de ${eur(suma - total)}`}</div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════ ORIGEN DEL DINERO */
function origenHTML(o, total){
  const tiles = [
    {l:'Cuenta común', v:o.pagadoComun, c:'var(--k)',
     s:'Dinero del negocio. <b>No es adelanto</b> de nadie.'},
    {l:'M', v:o.adelantoM, c:'var(--m)',
     s:'Puesto por M de su bolsillo: <b>adelanto personal</b>.'},
    {l:'C', v:o.adelantoC, c:'var(--c)',
     s:'Puesto por C de su bolsillo: <b>adelanto personal</b>.'},
  ];
  if (Math.abs(o.pagadoOtros || 0) >= 0.01)
    tiles.push({l:'Sin pagador', v:o.pagadoOtros, c:'var(--loss)',
                s:'Movimientos sin «Pagado por» en el Excel.'});
  const max = Math.max(...tiles.map(t => Math.abs(t.v)), 1);
  const suma = tiles.reduce((a,b) => a + b.v, 0);
  const cuadra = Math.abs(suma - total) < 0.005;
  const adel = (o.adelantoM || 0) + (o.adelantoC || 0);

  return `
  <div class="panelbig">
    <div class="orig">${tiles.map(t => `
      <div class="orig-tile">
        <span class="lbl eyebrow">${esc(t.l)}</span>
        <div class="f num ${t.v?'':'z'}" style="${t.v?`color:${t.c}`:''}">${eur(t.v)}</div>
        <div class="orig-bar"><span style="width:${
          (Math.max(0,t.v)/max*100).toFixed(2)}%;background:${t.c}"></span></div>
        <div class="orig-share">${total?pct(t.v/total*100):RAYA} de la inversión</div>
        <div class="orig-sub">${t.s}</div>
      </div>`).join('')}</div>
    <div class="recon">
      <div><span class="lbl eyebrow">Adelanto personal M</span><b style="color:${
        o.adelantoM?'var(--m)':'var(--ink-3)'}">${eur(o.adelantoM)}</b></div>
      <div><span class="lbl eyebrow">Adelanto personal C</span><b style="color:${
        o.adelantoC?'var(--c)':'var(--ink-3)'}">${eur(o.adelantoC)}</b></div>
      <div><span class="lbl eyebrow">Adelantos en total</span><b style="color:${
        adel?'var(--ink)':'var(--ink-3)'}">${eur(adel)}</b></div>
      <div class="${cuadra?'ok':'warn'}"><span class="lbl eyebrow">Suma de los orígenes</span>
        <b>${eur(suma)} ${cuadra?'✓':'⚠'}</b></div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════ PEDIDOS Y SUSCRIPCIONES
   Cada pedido genera UNA sola suscripcion, 30 dias EXACTOS despues de la
   compra. No hay segundo ciclo. Aqui solo se pinta: las fechas las calcula
   extract.py desde las cohortes, nunca se escribe una fila futura en el Excel.
   Los numeros son PREVISTOS: no confirman ningun cobro de Stripe. */
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIASEM = ['dom','lun','mar','mié','jue','vie','sáb'];
const dOf = s => new Date(s + 'T00:00:00');
const fchCorta = s => { const [y,m,d] = s.split('-'); return `${d} ${MESES[+m - 1]}`; };
const diaSemana = s => DIASEM[dOf(s).getDay()];
const sumaDias = (s, n) => new Date(dOf(s).getTime() + n * 864e5).toISOString().slice(0,10);
const distancia = (a, b) => Math.round((dOf(b) - dOf(a)) / 864e5);
const plural = (n, s, p) => `${ent(n)} ${n === 1 ? s : p}`;

/* escala del eje Y: siempre tramos "redondos" (2, 5, 10, 20, 50...) y un
   techo ajustado al maximo real, para que las barras no salgan diminutas */
function escalaY(max){
  if (!(max > 0)) return {techo:4, pasos:[0,1,2,3,4]};
  const bruto = max / 4;
  const exp = Math.pow(10, Math.floor(Math.log10(bruto)));
  const paso = [1,2,2.5,5,10].map(m => m * exp).find(v => v >= bruto) || 10 * exp;
  const techo = Math.ceil(max / paso) * paso;
  const pasos = [];
  for (let v = 0; v <= techo + 1e-9; v += paso) pasos.push(v);
  return {techo, pasos};
}

let renovAmpliado = false;      /* «ver más» del listado de renovaciones */
const VENTANA_LISTA = 60;       /* días que se muestran de entrada */

function graficaPedidos(p){
  if (!p.serie.length) return vacio('Todavía no hay pedidos');
  const n = p.serie.length;
  const {techo, pasos} = escalaY(p.maxDia);
  const lineas = pasos.map(v => `
    <div class="lc-line ${v === 0 ? 'base' : ''}" style="bottom:${
      (v / techo * 100).toFixed(3)}%"><b>${ent(v)}</b></div>`).join('');

  /* coordenadas en un lienzo 0-100 que luego se estira al ancho real */
  const px = i => n === 1 ? 50 : i / (n - 1) * 100;
  const py = v => 100 - (techo ? v / techo * 100 : 0);
  const pts = p.serie.map((x, i) => `${px(i).toFixed(3)},${py(x.pedidos).toFixed(3)}`);
  const linea = n === 1 ? '' : `<polyline points="${pts.join(' ')}" fill="none"
      stroke="var(--alt-t)" stroke-width="2.4" vector-effect="non-scaling-stroke"
      stroke-linejoin="round" stroke-linecap="round"/>`;
  const area = n === 1 ? '' : `<polygon fill="url(#lcGrad)"
      points="${px(0).toFixed(3)},100 ${pts.join(' ')} ${px(n-1).toFixed(3)},100"/>`;

  const puntos = p.serie.map((x, i) => {
    const alto = 100 - py(x.pedidos);        /* % del punto, medido desde abajo */
    /* el globo va justo encima del punto; si el punto está muy arriba, debajo */
    const sitio = alto > 72
      ? `top:calc(${(100 - alto).toFixed(2)}% + 22px)`
      : `bottom:calc(${alto.toFixed(2)}% + 22px)`;
    return `
    <div class="lc-hit ${i === 0 ? 'xi' : ''} ${i === n - 1 ? 'xf' : ''}"
         style="left:${px(i).toFixed(3)}%;width:${(n === 1 ? 100 : 100 / (n - 1)).toFixed(3)}%">
      <div class="lc-tip" style="${sitio}">
        <span class="d">${diaSemana(x.fecha)} · ${fch(x.fecha)}</span>
        <span class="v ${x.pedidos ? '' : 'z'}">${plural(x.pedidos,'pedido','pedidos')}</span></div>
      <span class="lc-dot" style="bottom:${alto.toFixed(3)}%;
        animation-delay:${Math.min(i * 22, 420)}ms"></span>
    </div>`;
  }).join('');

  /* se emiten todas; ajustarEtiquetas() esconde las que no quepan, ya medido */
  const etiquetas = p.serie.map((x, i) =>
    `<span class="${i === 0 ? 'xi' : ''} ${i === n - 1 ? 'xf' : ''}"
       style="left:${px(i).toFixed(3)}%">${esc(fchCorta(x.fecha))}</span>`).join('');

  return `<div class="lcwrap"><div class="lc">
    <div class="lc-plot">
      ${lineas}
      <div class="lc-area ${n > 45 ? 'denso' : ''}">
        <svg class="lc-svg" viewBox="0 0 100 100" preserveAspectRatio="none"
             aria-hidden="true">
          <defs><linearGradient id="lcGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8B6BE8" stop-opacity=".17"/>
            <stop offset="100%" stop-color="#8B6BE8" stop-opacity="0"/>
          </linearGradient></defs>
          ${area}${linea}
        </svg>
        ${puntos}
      </div>
    </div>
    <div class="lc-x">${etiquetas}</div>
  </div></div>`;
}

/* Cuántas fechas caben en el eje X solo se sabe cuando está pintado: se mide
   el ancho real y el de la etiqueta más larga, y se ocultan las sobrantes.
   Los PUNTOS de la serie no se tocan nunca: solo desaparecen etiquetas. */
function ajustarEtiquetas(){
  document.querySelectorAll('.lc-x').forEach(eje => {
    const et = [...eje.children];
    const n = et.length;
    if (!n) return;
    et.forEach(e => e.classList.remove('off'));
    const ancho = eje.clientWidth || 300;
    const pide = Math.max(...et.map(e => e.offsetWidth)) + 16;   // + aire
    const caben = Math.max(2, Math.floor(ancho / pide));
    const cada = Math.max(1, Math.ceil(n / caben));
    et.forEach((e, i) => {
      const visible = i % cada === 0 ||
        (i === n - 1 && (n - 1) % cada > cada * .6);
      if (!visible) e.classList.add('off');
    });

    /* Segunda pasada, ya con las medidas en pantalla: la primera etiqueta va
       pegada a la izquierda y la última a la derecha, así que pueden rozar con
       su vecina aunque el reparto fuese correcto. Se quita la que sobre. */
    const visibles = () => et.filter(e => !e.classList.contains('off'));
    let quedan = visibles(), i = 1;
    while (i < quedan.length){
      const a = quedan[i - 1].getBoundingClientRect();
      const b = quedan[i].getBoundingClientRect();
      if (b.left < a.right + 7){
        /* si el que choca es el último, interesa más la fecha final: se
           sacrifica el anterior */
        (i === quedan.length - 1 ? quedan[i - 1] : quedan[i]).classList.add('off');
        quedan = visibles();
        i = Math.max(1, i - 1);
      } else i++;
    }
  });
}

function renovacionesHTML(p, hoy){
  if (!p.renovaciones.length)
    return `<div class="panelbig">${vacio('No hay renovaciones previstas todavía')}</div>`;

  const limite = sumaDias(hoy, VENTANA_LISTA);
  const dentro = p.renovaciones.filter(r => r.fecha <= limite);
  const base = dentro.length ? dentro : p.renovaciones.slice(0, 12);
  const lista = renovAmpliado ? p.renovaciones : base;
  const resto = p.renovaciones.length - lista.length;
  const max = Math.max(...lista.map(r => r.suscripciones), 1);
  const lim30 = sumaDias(hoy, 30);

  const filas = lista.map(r => {
    const d = distancia(hoy, r.fecha);
    return `
    <div class="rn-row ${r.fecha <= lim30 ? 'pronto' : ''}">
      <div class="rn-f"><b>${fch(r.fecha)}</b>
        <span>${diaSemana(r.fecha)} · ${d === 0 ? 'hoy'
          : d === 1 ? 'mañana' : `dentro de ${plural(d,'día','días')}`}</span></div>
      <span class="rn-t"><span style="width:${
        (r.suscripciones / max * 100).toFixed(2)}%"></span></span>
      <div class="rn-n">${ent(r.suscripciones)}</div>
    </div>`;
  }).join('');

  return `
  <div class="panelbig">
    <div class="rn-head">
      <span class="eyebrow">Fecha prevista</span>
      <span class="eyebrow">Peso de la cohorte</span>
      <span class="eyebrow">Suscripciones</span>
    </div>
    <div class="rn">${filas}</div>
    <div class="rn-total">
      <div class="k">Próximos 30 días</div>
      <div class="q">Suma de todas las renovaciones previstas entre hoy y el
        ${fch(lim30)}.</div>
      <div class="v">${ent(p.renov30)}</div>
    </div>
    ${resto > 0 ? `<button class="linkbtn rn-more" data-act="renov-mas">
       Ver las ${ent(resto)} fechas siguientes →</button>` : ''}
    ${renovAmpliado && resto === 0 && p.renovaciones.length > base.length
       ? `<button class="linkbtn rn-more" data-act="renov-menos">Ver menos</button>` : ''}
    <p class="rn-foot">Son suscripciones <b>previstas</b>: cada pedido genera
      <b>una sola</b>, exactamente 30 días después de la compra. Ahí termina su ciclo.
      No confirman ningún cobro.</p>
  </div>`;
}

        <div><span class="lbl eyebrow">Fact. neta</span><div class="v num" style="color:var(--rev-t)">${eur0(e.facturacionNeta)}</div></div>
        <div><span class="lbl eyebrow">Profit neto</span><div class="v num" style="color:${neg?'var(--loss-t)':'var(--prof-t)'}">${eurS(e.beneficioNeto)}</div></div>
        <div><span class="lbl eyebrow">Margen</span><div class="v num">${pct(e.margen)}</div></div>
        <div><span class="lbl eyebrow">ROI</span><div class="v num" style="color:${neg?'var(--loss-t)':'var(--prof-t)'}">${pct(e.roi)}</div></div>
      </div>
      <div class="grid" style="grid-template-columns:repeat(3,1fr)">
        <div><span class="lbl eyebrow">Publicidad</span><div class="v num">${eur0(e.publicidad)}</div></div>
        <div><span class="lbl eyebrow">Otros gastos</span><div class="v num">${eur0(e.otrosGastos)}</div></div>
        <div><span class="lbl eyebrow">Generales del periodo</span><div class="v num">${eur0(e.gastosGeneralesAsignados)}</div></div>
      </div>
      <div class="cta"><button class="linkbtn" data-go="${esc(e.id)}">Ver la estructura completa →</button></div>
    </div>
  </section>`;
}

/* ══════════════════════════════════════════════ PÁGINA DE ESTRUCTURA */
/* Misma plantilla para 001, 002, 003... nada esta escrito a medida. */
function paginaEst(id){
  const e = D.estructuras.find(x => x.id === id);
  if (!e) return `<div class="pagehead"><h1>No encontrada</h1></div>`;

  /* cabecera comun + las dos pestanas + el contenido de la activa */
  return `
  <div class="pagehead anim">
    <h1>${esc(e.id)} <span class="pill ${e.estado.toLowerCase()}">${esc(e.estado)}</span></h1>
    <div class="sub">Inicio ${fch(e.inicio)} · Fin ${e.fin?fch(e.fin):RAYA} ·
      ${ent(e.dias)} día(s) · ${ent(e.nMovimientos)} gasto(s) ·
      ${ent(e.nIngresos)} registro(s) de facturación</div>
  </div>

  <div class="subtabs anim">
    <button class="subtab fin ${pestana==='finanzas'?'on':''}" data-tab="finanzas">
      <span class="dot"></span><span class="lg">Resumen financiero</span><span class="sm">Resumen</span></button>
    <button class="subtab ped ${pestana==='pedidos'?'on':''}" data-tab="pedidos">
      <span class="dot"></span><span class="lg">Pedidos y suscripciones</span><span class="sm">Pedidos</span>${
        e.pedidos.total ? `<span class="n">${ent(e.pedidos.total)}</span>` : ''}</button>
  </div>

  ${pestana === 'pedidos' ? tabPedidos(e, D.hoy) : tabFinanzas(e)}`;
}

/* ---------------------------------------------- pestaña: resumen financiero
   Exactamente lo que habia antes del modulo de pedidos. Sin tocar. */
function tabFinanzas(e){
  const neg = e.beneficioNeto < 0;
  return `
  ${metaHTML('Camino a 50.000 € de facturación', e.facturacionNeta, OBJ_ESTRUCTURA,
             'Facturación de la estructura')}

  <div class="kpis hero anim">
    <div class="card kpi big ${neg?'neg':''}"><span class="trendbar ${neg?'neg':'pos'}"></span>
      <span class="lbl eyebrow">Profit neto</span>
      <span class="v num ${neg?'neg':'pos'}">${eurS(e.beneficioNeto)}</span>
      <span class="foot">Beneficio directo ${eurS(e.beneficioDirecto)} (sin gastos generales)</span></div>
    <div class="card kpi"><span class="trendbar rev"></span>
      <span class="lbl eyebrow">Facturación neta</span>
      <span class="v num rev">${eur0(e.facturacionNeta)}</span>
      <span class="foot">Bruta ${eur0(e.facturacionBruta)}</span></div>
    <div class="card kpi"><span class="trendbar spend"></span>
      <span class="lbl eyebrow">Total invertido</span>
      <span class="v num spend">${eur0(e.costeTotal)}</span>
      <span class="foot">${eur0(e.gastosDirectos)} directos · ${eur0(e.gastosGeneralesAsignados)} generales</span></div>
    <div class="card kpi"><span class="trendbar ${neg?'neg':'pos'}"></span>
      <span class="lbl eyebrow">ROI</span>
      <span class="v num ${neg?'neg':'pos'}">${pct(e.roi)}</span>
      <span class="foot">Margen ${pct(e.margen)}</span></div>
  </div>

  <section class="anim">
    <div class="sechead"><h2>Desglose de la inversión</h2>
      <span class="note">${e.publicidad>0 && e.costeTotal>0
        ? `Publicidad: ${pct(e.publicidad/e.costeTotal*100)} del total invertido`
        : 'Dónde ha ido cada euro'}</span></div>
    ${desgloseHTML(e.desglose, e.costeTotal,
      'Gastos directos de la estructura más los gastos generales imputados a su período. '
      + 'La suma cuadra exactamente con el total invertido de arriba.')}
  </section>

  <section class="anim">
    <div class="sechead"><h2>Origen del dinero</h2>
      <span class="note">Quién puso cada euro</span></div>
    ${origenHTML(e, e.costeTotal)}
  </section>`;
}

/* ══════════════════════════════════════════════ ROUTER
   El hash lleva la estructura y, opcionalmente, la pestaña:
     #001-Estructura-MC            -> resumen financiero
     #001-Estructura-MC/pedidos    -> pedidos y suscripciones
   Asi el enlace se puede compartir y sobrevive a una recarga. */
let actual = 'overview';
let pestana = 'finanzas';

function hashActual(){
  return actual === 'overview' ? ''
    : encodeURIComponent(actual) + (pestana === 'pedidos' ? '/pedidos' : '');
}
function leerHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return {id:'overview', tab:'finanzas'};
  const i = h.lastIndexOf('/');
  const tab = i > 0 && h.slice(i + 1) === 'pedidos' ? 'pedidos' : 'finanzas';
  return {id: i > 0 && tab === 'pedidos' ? h.slice(0, i) : h, tab};
}
function pintar(mantener){
  const y = window.scrollY;
  document.getElementById('side').innerHTML = navHTML(actual);
  document.getElementById('topbar').innerHTML = topHTML(actual);
  document.getElementById('view').innerHTML =
    actual === 'overview' ? overview() : paginaEst(actual);
  ajustarEtiquetas();
  scrollTo({top: mantener ? y : 0, behavior:'instant'});
}
document.addEventListener('click', ev => {
  const a = ev.target.closest('[data-act]');
  if (a){
    if (a.dataset.act === 'renov-mas')  renovAmpliado = true;
    if (a.dataset.act === 'renov-menos') renovAmpliado = false;
    pintar(true);
    return;
  }
  const t = ev.target.closest('[data-tab]');
  if (t){
    if (t.dataset.tab === pestana) return;
    pestana = t.dataset.tab;
    renovAmpliado = false;
    location.hash = hashActual();
    pintar();
    return;
  }
  const b = ev.target.closest('[data-go]');
  if (!b) return;
  /* al cambiar de estructura se vuelve siempre al resumen financiero:
     asi el comportamiento es el mismo pase lo que pase */
  actual = b.dataset.go;
  pestana = 'finanzas';
  renovAmpliado = false;
  location.hash = hashActual();
  pintar();
});
let temporizadorAncho = null, anchoPrevio = window.innerWidth;
addEventListener('resize', () => {
  if (window.innerWidth === anchoPrevio) return;   // el teclado móvil no cuenta
  anchoPrevio = window.innerWidth;
  clearTimeout(temporizadorAncho);
  temporizadorAncho = setTimeout(() => pintar(true), 160);
});
addEventListener('hashchange', () => {
  const {id, tab} = leerHash();
  if (id !== actual || tab !== pestana){
    actual = id; pestana = tab; renovAmpliado = false; pintar();
  }
});
function arrancar(datos){
  D = datos;
  const {id, tab} = leerHash();
  if (id !== 'overview' && D.estructuras.some(e => e.id === id)){
    actual = id; pestana = tab;
  }
  pintar();
}

</script>
