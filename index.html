<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0808">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<title>M&amp;C Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">

<style>
/* ═══════════════════════════════════════════════════ TOKENS
   Negro cálido, luz coral medida y colores con significado:
   verde/rojo = resultado · dorado = objetivos · morado = pedidos. */
:root{
  --bg:#070505; --frame:#0D0A0A; --rail:#0B0808;
  --card:#141010; --card-2:#1A1514; --sunk:rgba(0,0,0,.24);
  --line:rgba(255,236,228,.075); --line-2:rgba(255,236,228,.12); --line-3:rgba(255,236,228,.2);
  --ink:#F6F1EE; --ink-2:#ACA29E; --ink-3:#766C68; --ink-4:#4F4643;
  --ink-inv:#120D0C;

  --coral:#EF5B43; --coral-t:#FF9477; --coral-a:rgba(239,91,67,.14);
  --prof:#2DB27D; --prof-t:#5FD7A1; --prof-a:rgba(45,178,125,.12);
  --loss:#E2475B; --loss-t:#FF6F80; --loss-a:rgba(226,71,91,.12);
  --gold-d:#9E7424; --gold:#D6A33C; --gold-t:#F0C76B; --gold-track:rgba(214,163,60,.1);
  --alt:#9373F0; --alt-t:#B8A2FB; --alt-d:#5E42C0; --alt-a:rgba(147,115,240,.14);
  --k:#FF8566; --m:#7EA7F0; --c:#4CC3B1;
  --bar-dir:linear-gradient(90deg,#9E2F1F,#EF5B43);
  --bar-pub:linear-gradient(90deg,#B4651E,#F2A052);
  --bar-gen:linear-gradient(90deg,#5A4E4A,#A89A94);
  --bar-res:linear-gradient(90deg,#7C1F2C,#E2475B);
  /* nombres heredados que aún usa la lógica de la plantilla */
  --panel:var(--card); --panel-2:var(--card-2); --rev-t:var(--ink); --spend-t:var(--ink);

  --r-frame:28px; --r-xl:22px; --r-lg:18px; --r-md:14px; --r-sm:10px;
  --gap:18px;
  --hl:inset 0 1px 0 rgba(255,240,235,.05);
  --sh:0 30px 60px -36px rgba(0,0,0,.9);
  --t:.16s cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  margin:0;color:var(--ink);min-height:100vh;
  background:
    radial-gradient(1100px 700px at 108% -12%,rgba(239,91,67,.30),rgba(190,50,34,.10) 42%,transparent 70%),
    radial-gradient(900px 620px at -14% 118%,rgba(239,91,67,.20),transparent 64%),
    var(--bg);
  background-attachment:fixed;
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.025em;line-height:1.1}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid rgba(255,148,119,.6);outline-offset:3px;border-radius:12px}
.num,.mono{font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}

/* ═══════════════════════════════════════════════════ APP SHELL
   Marco de aplicación: raíl de iconos + columna con barra superior y lienzo. */
.app{
  display:grid;grid-template-columns:92px minmax(0,1fr);
  max-width:1560px;margin:20px auto;min-height:calc(100vh - 40px);
  border:1px solid var(--line-2);border-radius:var(--r-frame);
  background:linear-gradient(180deg,rgba(255,240,235,.025),transparent 240px),rgba(13,10,10,.86);
  box-shadow:inset 0 1px 0 rgba(255,240,235,.06),0 50px 120px -40px rgba(0,0,0,.9);
}
aside#side{
  position:sticky;top:20px;height:calc(100vh - 42px);align-self:start;
  display:flex;flex-direction:column;align-items:center;padding:22px 0 20px;
  border-right:1px solid var(--line);border-radius:var(--r-frame) 0 0 var(--r-frame);
  background:linear-gradient(180deg,rgba(255,240,235,.02),transparent);
  overflow-x:hidden;overflow-y:auto;scrollbar-width:none;
}
aside#side::-webkit-scrollbar{display:none}
/* marca: corona ECOMKings en el raíl, dentro de la misma caja de 46 px del icono anterior,
   alineada con el logo de la barra superior */
.rail-mark{height:46px;display:grid;place-items:center}
.crown{display:block;height:auto;filter:drop-shadow(0 6px 14px rgba(239,91,67,.3))}
.rail-mark .crown{width:52px;position:relative;top:-5px}
.rail-nav{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:36px;width:100%}
.rail-item{display:flex;flex-direction:column;align-items:center;gap:6px;width:80px;padding:6px 2px;
  color:var(--ink-3);border-radius:16px;transition:color var(--t)}
.rail-ic,.rail-badge{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;position:relative;
  transition:background var(--t),color var(--t),box-shadow var(--t),border-color var(--t)}
.rail-ic{border:1px solid transparent}
.rail-ic svg{width:21px;height:21px}
.rail-badge{border-radius:16px;border:1px solid var(--line-2);background:var(--card-2);
  font-size:13.5px;font-weight:700;letter-spacing:-.02em;color:var(--ink-2)}
.rail-badge .dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;
  border:2.5px solid var(--frame);background:var(--ink-3)}
.rail-badge .dot.act{background:var(--prof)}
.rail-badge .dot.pau{background:var(--gold)}
.rail-cap{font-size:10.5px;font-weight:500;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-item:hover{color:var(--ink)}
.rail-item:hover .rail-ic{background:rgba(255,240,235,.06)}
.rail-item:hover .rail-badge{border-color:var(--line-3)}
.rail-item.on{color:var(--ink)}
.rail-item.on .rail-ic,.rail-item.on .rail-badge{background:var(--ink);color:var(--ink-inv);border-color:var(--ink);
  box-shadow:0 0 0 5px rgba(255,240,235,.06),0 10px 26px -8px rgba(255,240,235,.35)}
.rail-sep{width:56px;margin:14px 0 6px;padding-top:14px;border-top:1px solid var(--line);text-align:center}
.rail-sep span{font-size:8px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4)}
.rail-empty{font-size:10px;color:var(--ink-3);text-align:center;padding:0 8px}
.rail-foot{margin-top:auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--ink-3)}
.rail-foot svg{width:18px;height:18px}

main{min-width:0;display:flex;flex-direction:column}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
  min-height:80px;padding:14px 36px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:10px;min-width:0}
.crumb-brand{display:flex;align-items:center}
/* logo ECOMKings intacto sobre placa clara: su «ECOM» azul marino necesita fondo claro para leerse */
.logo{display:block;width:auto;box-sizing:content-box;background:#F6F1EE;box-shadow:0 10px 24px -14px rgba(0,0,0,.9)}
.crumb-brand .logo{height:40px;padding:5px 13px;border-radius:12px}
.crumb-sep{display:grid;color:var(--ink-4)}
.crumb-sep svg{width:15px;height:15px}
.crumb{font-size:13.5px;color:var(--ink-3);white-space:nowrap}
.crumb.on{color:var(--ink);font-weight:500;padding:7px 14px;border-radius:999px;
  background:rgba(255,240,235,.05);border:1px solid var(--line)}
.bar-status{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:9px;padding:9px 15px;border-radius:999px;
  background:rgba(255,240,235,.035);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.chip svg{width:15px;height:15px;color:var(--ink-3)}
#view{padding:34px 36px 60px}
.topbar{display:none}

/* ═══════════════════════════════════════════════════ CABECERA DE PÁGINA */
.pagehead{margin-bottom:26px}
.pagehead .over{display:block;font-size:15px;color:var(--ink-2);margin-bottom:8px}
.pagehead h1{font-size:46px;letter-spacing:-.04em;display:flex;align-items:center;gap:14px;flex-wrap:wrap}

/* ═══════════════════════════════════════════════════ PÍLDORAS Y BOTONES */
.pill{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;line-height:1;white-space:nowrap;
  padding:6px 10px 6px 9px;border-radius:999px;border:1px solid;vertical-align:middle}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
.pill.activa{color:var(--prof-t);border-color:rgba(45,178,125,.34);background:rgba(45,178,125,.1)}
.pill.activa::before{box-shadow:0 0 8px currentColor}
.pill.cerrada{color:var(--ink-2);border-color:var(--line-2);background:rgba(255,240,235,.04)}
.pill.pausada{color:var(--gold-t);border-color:rgba(214,163,60,.34);background:rgba(214,163,60,.09)}
.linkbtn{display:inline-flex;align-items:center;gap:9px;padding:10px 18px;border-radius:999px;
  font-size:13px;font-weight:600;color:var(--ink-inv);background:var(--ink);
  box-shadow:0 10px 24px -12px rgba(255,240,235,.45);transition:transform var(--t),box-shadow var(--t),background var(--t)}
.linkbtn svg{width:15px;height:15px;transition:transform var(--t)}
.linkbtn:hover{background:#FFFFFF;box-shadow:0 14px 30px -12px rgba(255,240,235,.6)}
.linkbtn:hover svg{transform:translateX(3px)}
.tag{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;line-height:1;
  padding:4px 7px;border-radius:6px;flex:0 0 auto;color:var(--ink-3);border:1px solid var(--line-2)}
.tag.gen{color:#D9CCC6;border-color:var(--line-3);background:rgba(255,240,235,.05)}
.tag.res{color:var(--loss-t);border-color:rgba(226,71,91,.38);background:var(--loss-a)}

.alert{padding:13px 16px;border-radius:var(--r-md);font-size:13px;margin-bottom:12px;border:1px solid}
.alert.info{background:rgba(255,240,235,.03);border-color:var(--line-2);color:var(--ink-2)}
.alert.error{background:var(--loss-a);border-color:rgba(226,71,91,.35);color:#FFC2C9}
.empty{padding:44px 22px;text-align:center;color:var(--ink-3);font-size:13.5px}
.empty .big{display:block;font-size:15px;color:var(--ink-2);margin-bottom:6px;font-weight:500}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim{animation:rise .38s cubic-bezier(.22,1,.36,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═══════════════════════════════════════════════════ PANEL (superficie base) */
.panel,.kpi,.goal,.flow{
  position:relative;border:1px solid var(--line);border-radius:var(--r-xl);
  background:linear-gradient(180deg,rgba(255,240,235,.03),rgba(255,240,235,0) 120px),var(--card);
  box-shadow:var(--hl),var(--sh);
}
.panel{display:flex;flex-direction:column;min-width:0}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px 16px;
  padding:22px 26px 6px;flex-wrap:wrap}
.ph-t h2{font-size:17px;font-weight:600;letter-spacing:-.02em}
.ph-t .note{display:block;margin-top:4px;font-size:12.5px;color:var(--ink-3)}
.panel-cap{padding:14px 26px 22px;font-size:12px;color:var(--ink-3);line-height:1.55;margin-top:auto}
.panel-cap b{color:var(--ink-2);font-weight:600}

/* ═══════════════════════════════════════════════════ KPI
   icono en círculo arriba · etiqueta + cifra ancladas abajo */
.kpis{display:grid;gap:var(--gap)}
.kpis-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis-2x2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;justify-content:space-between;min-height:204px;padding:22px 24px 22px;
  overflow:hidden;transition:border-color var(--t),transform var(--t)}
.kpi:hover{border-color:var(--line-2)}
.kpi-ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  color:var(--ink-2);border:1px solid var(--line-2);
  background:radial-gradient(100% 100% at 30% 20%,rgba(255,240,235,.08),rgba(255,240,235,.01))}
.kpi-ico svg{width:20px;height:20px}
.kpi-body{display:flex;flex-direction:column;margin-top:26px;min-width:0}
.kpi-lbl{font-size:14.5px;font-weight:500;color:var(--ink-2)}
.kpi-v{margin-top:6px;font-size:38px;font-weight:600;letter-spacing:-.04em;line-height:1.05;white-space:nowrap}
.kpi-v.pos{color:var(--prof-t)} .kpi-v.neg{color:var(--loss-t)}
.kpi-v.alt{color:var(--alt-t)} .kpi-v.z{color:var(--ink-4)}
.kpi-foot{margin-top:10px;font-size:12.5px;color:var(--ink-3);line-height:1.45}
.kpi-foot b{color:var(--ink-2);font-weight:600}

/* KPI protagonista: la luz coral nace en la esquina superior derecha y la
   cifra queda sobre la zona oscura, legible con su color de resultado */
.kpi.principal{border-color:rgba(255,150,120,.22);
  background:
    radial-gradient(95% 120% at 100% 0%,#F0583F 0%,rgba(205,58,38,.78) 26%,rgba(120,28,18,.34) 52%,transparent 74%),
    linear-gradient(160deg,#1E1513,#120D0D 60%)}
.kpi.principal::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(60% 40% at 100% 0%,rgba(255,200,170,.22),transparent 70%)}
.kpi.principal .kpi-ico{color:#FFF4EF;border-color:rgba(255,220,200,.32);background:rgba(255,240,235,.14)}
.kpi.principal .kpi-lbl{color:#F3DCD5}
.kpi.principal .kpi-foot{color:#C2A9A2}
.kpi.principal .kpi-v.neg{color:#FF8C98;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.kpi.principal .kpi-v.pos{color:#7DF0BA;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.kpi.morado{border-color:rgba(184,162,251,.18);
  background:radial-gradient(90% 120% at 100% 0%,rgba(147,115,240,.34),rgba(94,66,192,.1) 40%,transparent 70%),var(--card)}
.kpi.morado .kpi-ico{color:#EFE9FF;border-color:rgba(184,162,251,.34);background:var(--alt-a)}

/* versión compacta: icono a la izquierda, sin altura mínima */
.compacto .kpi{min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 16px;
  align-items:start;padding:20px 22px}
.compacto .kpi-ico{width:42px;height:42px}
.compacto .kpi-ico svg{width:18px;height:18px}
.compacto .kpi-body{margin-top:0}
.compacto .kpi-lbl{font-size:13px}
.compacto .kpi-v{font-size:30px}
.compacto .kpi-v.fecha{font-size:26px}

/* ═══════════════════════════════════════════════════ HERO DE OBJETIVO
   horizontal: cifra principal a la izquierda · métricas + barra a la derecha */
.goal{display:grid;grid-template-columns:minmax(260px,.85fr) minmax(0,2fr);margin-bottom:var(--gap);overflow:hidden;
  border-color:rgba(214,163,60,.22);
  background:
    radial-gradient(45% 160% at 0% 0%,rgba(214,163,60,.16),transparent 70%),
    radial-gradient(40% 120% at 100% 100%,rgba(239,91,67,.07),transparent 70%),
    linear-gradient(180deg,#17120E,#100C0B)}
.goal::before{content:"";position:absolute;left:0;right:30%;top:0;height:1px;
  background:linear-gradient(90deg,rgba(240,199,107,.7),transparent)}
.goal-main{padding:26px 30px;border-right:1px solid rgba(214,163,60,.14);display:flex;flex-direction:column}
.goal-title{display:flex;align-items:center;gap:11px}
.goal-title h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gold-t)}
.goal-title .dia{width:9px;height:9px;flex:0 0 9px;transform:rotate(45deg);border-radius:2px;
  background:linear-gradient(140deg,#FFE3A0,var(--gold-d));box-shadow:0 0 0 4px rgba(214,163,60,.12),0 0 14px rgba(240,199,107,.7)}
.goal-lbl{display:block;font-size:12.5px;color:var(--ink-3)}
.goal-main .goal-lbl{margin-top:auto;padding-top:22px}
.goal-big{margin-top:6px;font-size:48px;font-weight:600;letter-spacing:-.045em;line-height:1}
.goal-big.neg{color:var(--loss-t)}
.goal-side{padding:24px 30px;display:flex;flex-direction:column;justify-content:center;gap:16px;min-width:0}
.goal-stats{display:flex;align-items:flex-end;gap:14px 44px;flex-wrap:wrap}
.goal-stat b{display:block;margin-top:4px;font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1.05;white-space:nowrap}
.goal-stat b.gold{color:var(--gold-t);text-shadow:0 0 26px rgba(240,199,107,.25)}
.goal-target{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap;
  border:1px solid rgba(214,163,60,.28);background:rgba(214,163,60,.07);padding:7px 14px;border-radius:999px}
.goal-track{height:12px;border-radius:999px;overflow:hidden;position:relative;
  background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(240,199,107,.12) calc(10% - 1px) 10%),var(--gold-track);
  box-shadow:inset 0 0 0 1px rgba(214,163,60,.14),inset 0 1px 3px rgba(0,0,0,.45)}
.goal-fill{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--gold-d),var(--gold) 60%,#FFE09A);box-shadow:0 0 18px rgba(240,199,107,.55);
  transition:width .7s cubic-bezier(.22,1,.36,1)}
.goal-foot{display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-size:12px;color:var(--ink-3)}
.goal-foot .mono{font-size:11px;color:var(--ink-4)}
.goal-foot .msg{color:var(--ink-2);text-align:center;flex:1}

/* ═══════════════════════════════════════════════════ LISTA DE GASTO (desglose) */
.brk{padding:6px 26px 10px}
.brk-row{padding:13px 0}
.brk-row + .brk-row{border-top:1px solid var(--line)}
.brk-line{display:flex;align-items:center;justify-content:space-between;gap:14px;min-width:0}
.brk-line + .brk-line{margin-top:9px}
.brk-name{display:flex;align-items:center;gap:9px;min-width:0;font-size:14.5px;font-weight:500}
.brk-name .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brk-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.brk-amt{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brk-track{flex:1;height:6px;border-radius:999px;background:rgba(255,240,235,.055);overflow:hidden}
.brk-fill{display:block;height:100%;border-radius:999px;min-width:4px;transition:width .55s cubic-bezier(.22,1,.36,1),filter var(--t)}
.brk-row:hover .brk-fill{filter:brightness(1.2)}
.brk-pct{width:54px;text-align:right;font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.brk-total{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin:4px 16px 0;padding:16px 14px;border-radius:var(--r-md);
  background:linear-gradient(90deg,rgba(239,91,67,.1),rgba(239,91,67,.02) 60%),var(--sunk);border:1px solid var(--line)}
.brk-tot{display:flex;align-items:baseline;gap:14px}
.brk-tot .k{font-size:12.5px;color:var(--ink-2)}
.brk-tot .v{font-size:24px;font-weight:600;letter-spacing:-.03em}
.brk-total .q{font-size:11.5px;color:var(--prof-t);white-space:nowrap;padding:5px 10px;border-radius:999px;
  border:1px solid rgba(45,178,125,.3);background:var(--prof-a)}
.brk-total .q.warn{color:var(--loss-t);border-color:rgba(226,71,91,.35);background:var(--loss-a)}

/* ═══════════════════════════════════════════════════ ORIGEN DEL DINERO */
.orig{padding:4px 26px 8px}
.orig-row{display:flex;gap:14px;padding:15px 0}
.orig-row + .orig-row{border-top:1px solid var(--line)}
.orig-av{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:grid;place-items:center;
  font-size:15px;font-weight:700;color:var(--c);
  background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 34%,transparent)}
.orig-av svg{width:19px;height:19px}
.orig-row.vacio .orig-av{opacity:.5}
.orig-body{flex:1;min-width:0}
.orig-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.orig-lbl{font-size:14.5px;font-weight:600}
.orig-f{font-size:21px;font-weight:600;letter-spacing:-.03em;white-space:nowrap}
.orig-f.z{color:var(--ink-4)}
.orig-bar{height:6px;border-radius:999px;background:rgba(255,240,235,.055);overflow:hidden;margin:9px 0 8px}
.orig-bar span{display:block;height:100%;border-radius:999px;transition:width .55s cubic-bezier(.22,1,.36,1)}
.orig-sub{font-size:12px;color:var(--ink-3);line-height:1.4}
.orig-sub b{color:var(--ink-2);font-weight:600}
.orig-share{font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.recon{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:6px 16px 18px}
.recon > div{padding:13px 14px;border-radius:var(--r-md);background:var(--sunk);border:1px solid var(--line);min-width:0}
.recon .lbl{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:5px}
.recon b{font-size:16px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.recon .ok b{color:var(--prof-t)} .recon .warn b{color:var(--loss-t)}

/* ═══════════════════════════════════════════════════ TABLA (estilo historial) */
.tabla-panel{margin-top:var(--gap)}
.solo-ancho{padding:8px 12px 12px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
thead th{font-size:12.5px;font-weight:500;color:var(--ink-3);text-align:left;white-space:nowrap;
  padding:12px 14px;border-bottom:1px solid var(--line)}
th.n,td.n{text-align:right}
tbody td{height:66px;padding:0 14px;border-bottom:1px solid var(--line);white-space:nowrap;transition:background var(--t)}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:rgba(255,240,235,.035)}
tbody tr:hover td:first-child{border-radius:14px 0 0 14px}
tbody tr:hover td:last-child{border-radius:0 14px 14px 0}
td.pos{color:var(--prof-t);font-weight:600} td.neg{color:var(--loss-t);font-weight:600}
.t-id{display:flex;align-items:center;gap:12px}
.t-id b{font-weight:600;letter-spacing:-.01em}
.t-badge{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:0 0 36px;
  color:var(--coral-t);background:var(--coral-a);border:1px solid rgba(255,148,119,.22)}
.t-badge svg{width:17px;height:17px}
.t-go{width:44px;color:var(--ink-4)}
.t-go svg{width:17px;height:17px;display:block;margin-left:auto;transition:transform var(--t),color var(--t)}
tbody tr:hover .t-go svg{color:var(--coral-t);transform:translateX(3px)}

.solo-estrecho{display:none}
.estlist{gap:12px;padding:10px 16px 16px}
.estcard{display:block;width:100%;text-align:left;border-radius:var(--r-lg);border:1px solid var(--line);
  background:var(--card-2);overflow:hidden;transition:border-color var(--t)}
.estcard:hover,.estcard:active{border-color:var(--line-3)}
.estcard-top{display:flex;align-items:center;gap:10px;padding:14px 14px 0}
.estcard-top b{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.estcard-hero{padding:16px 14px 12px}
.estcard-hero .lbl{display:block;font-size:12px;color:var(--ink-3)}
.estcard-hero b{display:block;margin-top:2px;font-size:30px;font-weight:600;letter-spacing:-.04em}
.estcard-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 10px 12px}
.estcard-grid > div{padding:10px;border-radius:12px;background:var(--sunk);border:1px solid var(--line);min-width:0}
.estcard-grid .lbl{display:block;font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.estcard-grid b{display:block;margin-top:3px;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--prof-t)} .neg{color:var(--loss-t)}
.estcard-pie{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
  border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
.estcard-pie .abrir{display:inline-flex;align-items:center;gap:6px;color:var(--coral-t);font-weight:600}
.estcard-pie svg{width:14px;height:14px}

/* ═══════════════════════════════════════════════════ OVERVIEW · grids */
.kpis-4 + .grid-ov{margin-top:var(--gap)}
.grid-ov{display:grid;grid-template-columns:minmax(0,1.72fr) minmax(0,1fr);gap:var(--gap);align-items:stretch}
.ov-gasto{display:flex}
.ov-gasto > .panel{flex:1}
/* gasto del overview: una línea por partida (nombre · % · importe) con la barra debajo */
.ov-gasto .brk-row{display:grid;grid-template-columns:minmax(0,1fr) 50px auto;gap:0 14px;align-items:center;padding:8px 0}
.ov-gasto .brk-line{display:contents}
.ov-gasto .brk-name{grid-column:1;grid-row:1}
.ov-gasto .brk-pct{grid-column:2;grid-row:1;width:auto}
.ov-gasto .brk-amt{grid-column:3;grid-row:1;text-align:right}
.ov-gasto .brk-track{grid-column:1/-1;grid-row:2;height:4px;margin-top:8px}
.spot{display:flex;flex-direction:column}
.spot-parts{margin-top:auto}
.spot-grid{margin-bottom:14px}
.spot-grid .m{padding:20px}
.spot-grid .m b{font-size:30px;margin-top:10px}
.spot-parts .m{padding:18px}

/* estructura actual · panel de proyecto */
.spot .panel-head{padding-bottom:0}
.spot-id{display:flex;align-items:center;gap:16px;padding:18px 26px 20px}
.spot-badge,.est-badge{display:grid;place-items:center;flex:0 0 auto;color:#FFF4EF;
  background:radial-gradient(120% 120% at 100% 0%,#F0583F 0%,#A42C1B 55%,#3A120C 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 14px 30px -14px rgba(239,91,67,.8)}
.spot-badge{width:54px;height:54px;border-radius:17px}
.spot-badge svg{width:24px;height:24px}
.spot-name{min-width:0}
.spot-name h3{font-size:24px;letter-spacing:-.03em;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:10px}
.meta span{font-size:12.5px;color:var(--ink-3);white-space:nowrap;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,240,235,.025)}
.meta b{color:var(--ink);font-weight:600}
.spot-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:0 26px}
.spot .m{padding:16px 18px;border-radius:var(--r-md);background:rgba(255,240,235,.03);border:1px solid var(--line);min-width:0}
.spot .m .lbl{display:block;font-size:12.5px;color:var(--ink-3)}
.spot .m b{display:block;margin-top:6px;font-size:26px;font-weight:600;letter-spacing:-.035em;white-space:nowrap}
.spot-parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:12px 26px 26px;
  border-radius:var(--r-md);background:var(--sunk);border:1px solid var(--line)}
.spot-parts .m{background:none;border:0;border-radius:0;padding:14px 18px}
.spot-parts .m + .m{box-shadow:inset 1px 0 0 var(--line)}
.spot-parts .m b{font-size:18px;color:var(--ink-2)}

/* ═══════════════════════════════════════════ ESTRUCTURA · cabecera de proyecto */
.esthead{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px 28px;
  padding-bottom:24px;margin-bottom:26px;border-bottom:1px solid var(--line)}
.esthead-id{display:flex;align-items:center;gap:18px;min-width:0}
.est-badge{width:66px;height:66px;border-radius:21px}
.est-badge svg{width:30px;height:30px}
.esthead .over{display:block;font-size:14px;color:var(--ink-2);margin-bottom:6px}
.esthead h1{font-size:40px;letter-spacing:-.04em;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.esthead-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.esthead-meta span{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);white-space:nowrap;
  padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,240,235,.025)}
.esthead-meta svg{width:15px;height:15px}
.esthead-meta b{color:var(--ink);font-weight:600}

/* pestañas: cápsula con opción activa en blanco, como un control nativo */
.subtabs{display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(255,240,235,.04);
  border:1px solid var(--line-2);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.subtab{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 19px;border-radius:999px;
  font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap;
  transition:background var(--t),color var(--t),box-shadow var(--t)}
.subtab svg{width:17px;height:17px;flex:0 0 17px}
.subtab:hover{color:var(--ink);background:rgba(255,240,235,.05)}
.subtab.on{background:var(--ink);color:var(--ink-inv);box-shadow:0 10px 26px -12px rgba(255,240,235,.5)}
.subtab .sm{display:none}
.subtab .n{font-size:11px;font-weight:700;line-height:1;padding:4px 7px;border-radius:999px;
  color:var(--alt-t);background:var(--alt-a)}
.subtab.on .n{color:#FFFFFF;background:var(--alt-d)}

/* ═══════════════════════════════════════════ RESUMEN · objetivo 5/12 + KPIs 7/12 */
.grid-fin{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--gap);align-items:stretch}
.grid-fin .goal{grid-template-columns:1fr;margin-bottom:0}
.grid-fin .goal-main{border-right:0;border-bottom:1px solid rgba(214,163,60,.14)}
.grid-fin .goal-side{justify-content:flex-end}
.grid-fin .kpi{min-height:0}
.grid-fin .goal-big{font-size:58px}
.grid-6040{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--gap);margin-top:var(--gap);align-items:stretch}
.grid-6040 > section{display:flex;min-width:0}
.grid-6040 > section > .panel{flex:1}
/* con más ancho, cada partida en una sola línea: nombre · importe | barra · % */
.grid-6040 .brk-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:center}
.grid-6040 .brk-line + .brk-line{margin-top:0}

/* ═══════════════════════════════════════════ PEDIDOS · analítica */
.kpis-stack{grid-template-columns:minmax(0,1fr);grid-auto-rows:1fr}
.kpis-stack .kpi{align-content:center}
.rn-ancho{display:flex;margin-top:var(--gap)}
.rn-ancho > .panel{flex:1}
.rn-ancho .rn{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--filas),auto);
  grid-template-columns:repeat(2,minmax(0,1fr));column-gap:56px}
.rn-ancho .rn-head{display:none}
.rn-ancho .rn-row{grid-template-columns:minmax(150px,.8fr) minmax(0,1.6fr) 44px;gap:0 22px;padding:13px 0;
  border-bottom:1px solid var(--line)}
.rn-ancho .rn-row + .rn-row{border-top:0}
.rn-ancho .rn-t{grid-column:2;grid-row:1;margin-top:0;height:6px}
.rn-ancho .rn-n{grid-column:3;grid-row:1;text-align:right}
.rn-ancho .rn-total{margin:14px 16px 0}
.grid-an{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:var(--gap);align-items:stretch}
.rn-col{display:flex;min-width:0}
.rn-col > .panel{flex:1}
.leyenda{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);
  padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,240,235,.03)}
.leyenda i{width:14px;height:3px;border-radius:3px;background:var(--alt-t);box-shadow:0 0 8px rgba(184,162,251,.8)}
.chart-panel .lcwrap{flex:1;display:flex;padding:18px 26px 6px}
.lc{flex:1;display:flex;flex-direction:column;padding-left:54px;position:relative}
.lc-plot{position:relative;flex:1;min-height:380px}
.lc-line{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,236,228,.06);pointer-events:none}
.lc-line.base{border-top:1px solid var(--line-2)}
.lc-line b{position:absolute;right:calc(100% + 12px);top:-8px;font-weight:500;font-size:11.5px;color:var(--ink-4)}
.lc-area{position:absolute;left:13px;right:13px;top:0;bottom:0}
.lc-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;
  filter:drop-shadow(0 0 12px rgba(147,115,240,.4));animation:trazo .5s cubic-bezier(.22,1,.36,1) both}
@keyframes trazo{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.lc-hit{position:absolute;top:0;bottom:0;transform:translateX(-50%)}
.lc-hit::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;opacity:0;
  background:repeating-linear-gradient(180deg,rgba(255,236,228,.45) 0 4px,transparent 4px 8px);transition:opacity var(--t)}
.lc-hit:hover::before{opacity:1}
.lc-dot{position:absolute;left:50%;width:9px;height:9px;border-radius:50%;transform:translate(-50%,50%);
  background:var(--card);border:2px solid var(--alt-t);pointer-events:none;animation:aparecer .45s ease-out both;
  transition:width .13s,height .13s,background .13s,box-shadow .13s,border-color .13s}
.lc-hit:hover .lc-dot{width:14px;height:14px;background:#FFF;border-color:#FFF;
  box-shadow:0 0 0 6px rgba(147,115,240,.28),0 0 24px 5px rgba(184,162,251,.85)}
.lc-area.denso .lc-dot{width:6px;height:6px}
.lc-tip{position:absolute;left:50%;transform:translateX(-50%);z-index:5;display:none;pointer-events:none;white-space:nowrap;
  background:linear-gradient(180deg,rgba(255,240,235,.06),rgba(255,240,235,0)),#181312;
  border:1px solid var(--line-2);border-radius:14px;padding:11px 15px 12px;
  box-shadow:inset 0 1px 0 rgba(255,240,235,.07),0 22px 48px -14px rgba(0,0,0,.95)}
.lc-hit:hover .lc-tip{display:block;animation:aparecer .14s ease-out both}
.lc-hit.xi .lc-tip{left:0;transform:none}
.lc-hit.xf .lc-tip{left:auto;right:0;transform:none}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
.lc-tip .d{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:7px}
.lc-tip .v{display:block;font-size:18px;font-weight:600;letter-spacing:-.02em;padding-left:10px;border-left:2px solid var(--alt-t);line-height:1.15}
.lc-tip .v.z{color:var(--ink-2);border-left-color:var(--ink-4)}
.lc-tip .s{display:block;margin-top:5px;padding-left:12px;font-size:11.5px;color:var(--ink-3)}
.lc-x{position:relative;height:22px;margin:12px 13px 0}
.lc-x span{position:absolute;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;color:var(--ink-4)}
.lc-x span.off{display:none}
.lc-x span.xi{transform:none}
.lc-x span.xf{transform:translateX(-100%)}

/* renovaciones · columna estrecha */
.rn-head{display:flex;justify-content:space-between;padding:12px 26px 8px;font-size:12px;color:var(--ink-4)}
.rn-head .rn-peso{display:none}
.rn{padding:0 26px}
.rn-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;align-items:center;padding:11px 0}
.rn-row + .rn-row{border-top:1px solid var(--line)}
.rn-f b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.rn-f span{display:block;margin-top:1px;font-size:12px;color:var(--ink-3)}
.rn-row.pronto .rn-f span{color:var(--alt-t)}
.rn-n{font-size:19px;font-weight:600;color:var(--alt-t)}
.rn-t{grid-column:1/-1;height:5px;margin-top:9px;border-radius:999px;background:rgba(255,240,235,.055);overflow:hidden}
.rn-t span{display:block;height:100%;border-radius:999px;min-width:4px;background:linear-gradient(90deg,var(--alt-d),var(--alt-t));
  transition:width .55s cubic-bezier(.22,1,.36,1)}
.rn-total{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;margin:8px 16px 0;
  padding:15px 14px;border-radius:var(--r-md);border:1px solid var(--line);
  background:linear-gradient(90deg,rgba(147,115,240,.14),rgba(147,115,240,.03) 70%),var(--sunk)}
.rn-total .k{font-size:12.5px;font-weight:600;color:var(--ink)}
.rn-total .v{font-size:26px;font-weight:600;color:var(--alt-t);letter-spacing:-.03em;grid-row:1/3;grid-column:2}
.rn-total .q{font-size:11.5px;color:var(--ink-3);grid-column:1}
.rn-more{margin:12px 16px 0;justify-content:center;background:rgba(255,240,235,.05);color:var(--ink);
  border:1px solid var(--line-2);box-shadow:none}
.rn-more:hover{background:rgba(255,240,235,.09)}

/* ═══════════════════════════════════════════ PUBLICIDAD · hero de flujo */
.pubbar{display:flex;align-items:center;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;
  margin-bottom:var(--gap);padding:12px 18px;border-radius:var(--r-lg);border:1px solid var(--line);background:rgba(255,240,235,.025)}
.pubbar .est{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.pubbar .est b{color:var(--ink);font-weight:600}
.pill.pub-curso{color:var(--coral-t);border-color:rgba(239,91,67,.36);background:var(--coral-a)}
.pill.pub-curso::before{animation:latido 1.8s ease-in-out infinite;box-shadow:0 0 8px currentColor}
@keyframes latido{0%,100%{opacity:1}50%{opacity:.3}}
.pill.pub-cerrada{color:var(--ink);border-color:var(--line-3);background:rgba(255,240,235,.06)}
.pill.pub-cerrada::before{display:none}
.grid-pub{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:var(--gap);align-items:stretch}
.flow{display:flex;flex-direction:column;overflow:hidden;border-color:rgba(255,150,120,.2);
  background:
    radial-gradient(70% 110% at 100% 100%,rgba(239,91,67,.55),rgba(170,44,28,.22) 42%,transparent 72%),
    radial-gradient(40% 60% at 0% 0%,rgba(255,240,235,.05),transparent 70%),
    linear-gradient(160deg,#1A1312,#110C0C)}
.flow-steps{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;
  gap:10px;padding:20px 26px 18px;flex:1}
.rf-paso{display:flex;flex-direction:column;min-width:0;padding:20px;border-radius:var(--r-lg);
  background:rgba(8,6,6,.42);border:1px solid rgba(255,240,235,.08)}
.rf-ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);
  border:1px solid var(--line-2);background:rgba(255,240,235,.05)}
.rf-ico svg{width:19px;height:19px}
.rf-paso .lbl{margin-top:auto;padding-top:26px;font-size:14px;font-weight:500;color:var(--ink-2)}
.rf-paso .f{margin-top:4px;font-size:clamp(30px,2.6vw,42px);font-weight:600;letter-spacing:-.04em;line-height:1.05;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-paso .f.z{color:var(--ink-4)}
.rf-paso .f.pos{color:var(--prof-t)} .rf-paso .f.neg{color:var(--loss-t)}
.rf-paso .cap{margin-top:6px;font-size:12px;color:var(--ink-3)}
.rf-paso.roas{background:rgba(255,240,235,.07);border-color:rgba(255,190,170,.26)}
.rf-paso.roas .rf-ico{color:#FFF4EF;border-color:rgba(255,220,200,.35);background:rgba(239,91,67,.3)}
.rf-flecha{display:grid;place-items:center;color:var(--coral-t)}
.rf-flecha svg{width:38px;height:38px;padding:10px;border-radius:50%;border:1px solid rgba(255,148,119,.3);
  background:rgba(20,14,13,.9);box-shadow:0 0 22px -6px rgba(239,91,67,.8)}
.rf-pie{margin:0 26px 22px;padding:12px 16px;border-radius:var(--r-md);background:rgba(0,0,0,.3);
  border:1px solid rgba(255,240,235,.07);font-size:13px;color:var(--ink-2)}
.rf-pie b{color:var(--prof-t)}
.detalle .panel-head{padding-bottom:10px}
.det-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 26px;border-top:1px solid var(--line)}
.det-ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);
  border:1px solid var(--line-2);background:rgba(255,240,235,.04)}
.det-ico svg{width:18px;height:18px}
.det-lbl{display:block;font-size:14px;font-weight:600}
.det-foot{display:block;margin-top:2px;font-size:12px;color:var(--ink-3)}
.det-foot b{color:var(--ink-2)}
.det-v{font-size:22px;font-weight:600;letter-spacing:-.03em;white-space:nowrap}
.det-v.z{color:var(--ink-4)} .det-v.pos{color:var(--prof-t)} .det-v.neg{color:var(--loss-t)}
.grid-pub + .kpis-3{margin-top:var(--gap)}
.aclara{margin-top:16px;font-size:12.5px;color:var(--ink-3);line-height:1.55;max-width:96ch}
.aclara b{color:var(--ink-2);font-weight:600}

/* ═══════════════════════════════════════════════════ RESPONSIVE */
@media (max-width:1380px){
  .subtab .lg{display:none}
  .subtab .sm{display:inline}
}
@media (max-width:1320px){
  .app{margin:14px;min-height:calc(100vh - 28px)}
  aside#side{top:14px;height:calc(100vh - 30px)}
  #view{padding:30px 30px 56px}
  .appbar{padding:14px 30px}
  .pagehead h1{font-size:40px}
  .kpi{min-height:188px;padding:20px}
  .kpi-v{font-size:32px}
  .goal-big{font-size:42px}
  .goal-stat b{font-size:25px}
  .spot .m b{font-size:22px}
  .spot-grid .m b{font-size:24px}
  .goal-title h2{letter-spacing:.09em}
  .compacto .kpi{padding:18px;gap:0 12px}
  .compacto .kpi-v{font-size:26px}
  .compacto .kpi-v.fecha{font-size:22px}
  .rf-paso{padding:16px}
  .rf-paso .f{font-size:clamp(26px,2.4vw,34px)}
}
/* por debajo de ~1100 px los grids asimétricos pasan a una columna */
@media (max-width:1100px){
  .grid-ov,.grid-fin,.grid-6040,.grid-an,.grid-pub{grid-template-columns:minmax(0,1fr)}
  .grid-fin .goal{grid-template-columns:minmax(240px,.85fr) minmax(0,2fr)}
  .grid-fin .goal-main{border-bottom:0;border-right:1px solid rgba(214,163,60,.14)}
  .grid-6040 .brk-row{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
  .kpis-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis-stack{grid-auto-rows:auto}
  .grid-an .kpis-stack{order:-1}
  .rn-ancho .rn{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:minmax(0,1fr)}
  .esthead{grid-template-columns:minmax(0,1fr)}
  .subtabs{justify-self:start}
  .chart-panel .lc-plot{min-height:300px}
  .bar-status .chip:first-child span{display:none}
}
@media (max-width:1000px){
  .app{grid-template-columns:80px minmax(0,1fr)}
  .rail-item{width:70px}
  .rail-cap{max-width:70px}
  .solo-ancho{display:none}
  .estlist.solo-estrecho{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .goal,.grid-fin .goal{grid-template-columns:minmax(0,1fr)}
  .goal-main,.grid-fin .goal-main{border-right:0;border-bottom:1px solid rgba(214,163,60,.14)}
  .goal-main .goal-lbl{padding-top:16px}
  .rf-paso .f{font-size:clamp(24px,3.4vw,32px)}
  .flow-steps{padding:16px 18px;gap:6px}
  .crumb-brand{display:none}
  .crumbs > .crumb-sep:first-of-type{display:none}
}
@media (max-width:900px){
  #view{padding:26px 22px 48px}
  .appbar{padding:12px 22px;min-height:66px}
  .pagehead h1{font-size:34px}
  .esthead h1{font-size:32px}
  .est-badge{width:56px;height:56px;border-radius:18px}
  .spot-grid{gap:10px}
  .spot .m{padding:14px}
}


/* ═══════════════════════════════════════════════════ MÓVIL (≤760 px)
   Composición propia de app financiera: marrón cálido, luz cobre, tarjetas
   táctiles y listas en baldosas. TODO vive dentro de este media query:
   tablet y escritorio no leen ninguna de estas reglas. */
@media (max-width:760px){
  :root{
    --gap:12px;
    --m-bg:#0D0907; --m-card:#1D1512; --m-card-2:#261C18;
    --m-line:rgba(255,214,190,.075); --m-line-2:rgba(255,214,190,.13);
    --m-cobre:linear-gradient(135deg,#F28C4E 0%,#D0602F 48%,#8E3818 100%);
    --m-r:20px; --m-r-sm:14px;
    --card:var(--m-card); --card-2:var(--m-card-2); --line:var(--m-line); --line-2:var(--m-line-2);
  }
  html{background:var(--m-bg)}
  body{font-size:14px;background-attachment:scroll;
    background:
      radial-gradient(130% 55% at 88% -6%,rgba(214,112,56,.36),transparent 62%),
      linear-gradient(180deg,#2A1B14 0,#160F0C 360px,var(--m-bg) 820px)}
  .app{display:block;margin:0;min-height:0;border:0;border-radius:0;background:none;box-shadow:none}
  aside#side,.appbar{display:none}
  #view{padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
  section{margin:0}

  /* ── barra superior: marca y estado en una línea, navegación en cápsulas ── */
  .topbar{display:block;position:sticky;top:0;z-index:40;
    padding:calc(8px + env(safe-area-inset-top)) 16px 10px;
    background:rgba(26,17,13,.84);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,214,190,.06)}
  .topbar .row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
  .topbar .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .topbar .crown{width:40px}
  .topbar .logo{height:30px;padding:4px 10px;border-radius:10px}
  .top-ro{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
  .top-ro svg{width:14px;height:14px}
  .tabs{display:flex;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;
    font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;
    background:rgba(255,236,226,.055);border:1px solid var(--m-line);
    transition:background .18s,color .18s,border-color .18s,transform .18s}
  .tab svg{width:16px;height:16px}
  .tab .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
  .tab .dot.act{background:var(--prof);box-shadow:0 0 8px rgba(45,178,125,.9)}
  .tab .dot.pau{background:var(--gold)}
  .tab.on{background:#F6EEE9;color:#1A120E;border-color:#F6EEE9}
  .tab:active{transform:scale(.97)}

  /* ── cabecera de página ── */
  .pagehead{margin-bottom:16px}
  .pagehead .over{font-size:12.5px;color:var(--ink-3);margin-bottom:6px;line-height:1.4}
  .pagehead h1{font-size:26px;letter-spacing:-.03em}

  /* ── superficies ── */
  .panel,.kpi,.goal,.flow{border-radius:var(--m-r);box-shadow:none;border-color:var(--m-line)}
  .panel,.kpi{background:var(--m-card)}
  .panel-head{padding:16px 16px 6px}
  .ph-t h2{font-size:17px}
  .ph-t .note{font-size:12px;margin-top:2px}
  .panel-cap{padding:10px 16px 16px;font-size:11.5px}
  /* secciones que son listas: sin caja, título sobre el fondo y filas en baldosas */
  .brk-panel,.rn-panel,.orig-panel,.tabla-panel{background:none;border:0;box-shadow:none}
  .brk-panel .panel-head,.rn-panel .panel-head,.orig-panel .panel-head,.tabla-panel .panel-head{padding:0 2px 10px}
  .brk-panel .panel-cap,.rn-panel .panel-cap{padding:10px 2px 0}

  /* ── objetivo: tarjeta hero financiera ── */
  .goal,.grid-fin .goal{display:grid;grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:"titulo objetivo" "lbl lbl" "big big" "barra barra" "conseguido falta" "msg msg";
    align-items:center;gap:0 12px;padding:18px 18px 16px;margin-bottom:12px;overflow:hidden;
    border-color:rgba(226,170,90,.2);
    background:radial-gradient(95% 80% at 100% 0%,rgba(226,160,70,.26),transparent 62%),linear-gradient(160deg,#2A1E14,#18110D)}
  .goal-main,.goal-side,.goal-stats,.grid-fin .goal-main{display:contents}
  .goal-title{grid-area:titulo;min-width:0}
  .goal-title h2{font-size:11px;letter-spacing:.09em}
  .goal-target{grid-area:objetivo;justify-self:end;margin:0;font-size:11px;padding:5px 10px}
  .goal-main .goal-lbl{grid-area:lbl;margin:0;padding-top:16px;font-size:12.5px}
  .goal-big,.grid-fin .goal-big{grid-area:big;margin-top:2px;font-size:clamp(30px,10vw,38px)}
  .goal-track{grid-area:barra;height:8px;margin-top:16px}
  .goal-stat{display:flex;flex-direction:column-reverse;margin-top:12px}
  .goal-stat:first-child{grid-area:conseguido}
  .goal-stat:nth-child(2){grid-area:falta;align-items:flex-end;text-align:right}
  .goal-stat .goal-lbl{font-size:11.5px}
  .goal-stat b{margin:0 0 1px;font-size:18px}
  .goal-foot{grid-area:msg;margin-top:12px;padding-top:12px;border-top:1px solid rgba(226,170,90,.12);justify-content:flex-start}
  .goal-foot .mono{display:none}
  .goal-foot .msg{text-align:left;font-size:12px}

  /* ── KPIs 2×2 de alturas iguales; profit con luz cobre ── */
  .kpis{gap:10px}
  .kpis-4:not(.kpis-stack),.kpis-2x2{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr}
  .kpi{min-height:136px;padding:14px 14px 15px;justify-content:space-between}
  .kpi-ico{width:32px;height:32px;border-color:var(--m-line-2);background:rgba(255,236,226,.05)}
  .kpi-ico svg{width:15px;height:15px}
  .kpi-body{margin-top:14px}
  .kpi-lbl{font-size:12.5px}
  .kpi-v{margin-top:4px;font-size:clamp(20px,6.2vw,26px);letter-spacing:-.035em}
  .kpi-foot{margin-top:6px;font-size:11px;line-height:1.35}
  .kpi.principal{border-color:rgba(255,160,110,.26);
    background:radial-gradient(125% 95% at 100% 0%,#E97A3E 0%,rgba(196,84,40,.74) 32%,rgba(90,34,16,.36) 60%,transparent 82%),
      linear-gradient(160deg,#2B1A13,#170F0C)}
  .kpi.principal::after{content:none}
  .kpi.principal .kpi-ico{background:rgba(255,240,235,.16);border-color:rgba(255,220,200,.3)}

  .grid-ov{gap:20px}
  .kpis-4 + .grid-ov{margin-top:20px}
  .tabla-panel{margin-top:20px}

  /* ── estructura actual: tarjeta de cuenta ── */
  .spot{display:flex;flex-direction:column;padding:16px;
    background:radial-gradient(110% 70% at 100% 0%,rgba(214,112,56,.22),transparent 60%),var(--m-card)}
  .spot .panel-head{display:contents}
  .spot .ph-t h2{font-size:12.5px;font-weight:500;color:var(--ink-3);letter-spacing:0}
  .spot .linkbtn,.spot .panel-head .linkbtn{display:flex;order:9;width:100%;height:46px;margin-top:14px;justify-content:center;font-size:14px}
  .spot-id{padding:10px 0 14px;gap:12px;align-items:center;border-bottom:1px solid var(--m-line)}
  .spot-badge{width:42px;height:42px;border-radius:13px}
  .spot-badge svg{width:19px;height:19px}
  .spot-name h3{font-size:19px;gap:8px}
  .meta{gap:2px 0;margin-top:6px}
  .meta span{padding:0;border:0;background:none;font-size:11.5px;border-radius:0}
  .meta span + span::before{content:"·";margin:0 6px;color:var(--ink-4)}
  .meta b{color:var(--ink-2)}
  .spot-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;padding:14px 0 0;margin:0}
  .spot-grid .m,.spot .m{padding:0;border:0;border-radius:0;background:none}
  .spot .m .lbl{font-size:11px}
  .spot-grid .m b,.spot .m b{margin-top:3px;font-size:17px;letter-spacing:-.02em}
  .spot-parts{grid-template-columns:repeat(3,minmax(0,1fr));margin:14px 0 0;padding:12px;
    border-radius:var(--m-r-sm);background:rgba(0,0,0,.24);border:1px solid var(--m-line)}
  .spot-parts .m,.spot-parts .m + .m{display:block;padding:0;box-shadow:none;border-top:0}
  .spot-parts .m + .m{padding-left:10px;border-left:1px solid var(--m-line)}
  .spot-parts .m b{font-size:14px;color:var(--ink)}

  /* ── todas las estructuras: tarjeta clicable por estructura ── */
  .estlist.solo-estrecho{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:0}
  .estcard{border-radius:var(--m-r);border:1px solid var(--m-line-2);
    background:radial-gradient(100% 80% at 100% 0%,rgba(214,112,56,.2),transparent 60%),var(--m-card);
    transition:transform .18s,border-color .18s}
  .estcard:active{transform:scale(.985)}
  .estcard-top{flex-wrap:nowrap;padding:14px 14px 0;gap:10px}
  .estcard-top b{font-size:15px;white-space:nowrap}
  .estcard-hero{padding:12px 14px 10px}
  .estcard-hero .lbl{font-size:12px}
  .estcard-hero b{font-size:30px}
  .estcard-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:0 14px;padding:10px 0 12px;border-top:1px solid var(--m-line)}
  .estcard-grid > div,.estcard-grid > div:last-child{grid-column:auto;padding:0;border:0;border-radius:0;background:none}
  .estcard-grid > div + div{padding-left:10px;border-left:1px solid var(--m-line)}
  .estcard-grid .lbl{font-size:10.5px}
  .estcard-grid b{font-size:14px}
  .estcard-pie{min-height:46px;padding:12px 14px}

  /* ── gasto / desglose: filas financieras en baldosas ── */
  .brk{display:grid;gap:6px;padding:0}
  .brk-row,.ov-gasto .brk-row,.grid-6040 .brk-row{display:block;padding:12px 14px;
    border-radius:var(--m-r-sm);background:var(--m-card);border:1px solid var(--m-line)}
  .brk-row + .brk-row{border-top:1px solid var(--m-line)}
  .ov-gasto .brk-line,.grid-6040 .brk-line{display:flex}
  .brk-line + .brk-line,.grid-6040 .brk-line + .brk-line{margin-top:9px}
  .brk-name{font-size:14px}
  .brk-dot{width:9px;height:9px;flex-basis:9px}
  .brk-amt,.ov-gasto .brk-amt{font-size:14.5px}
  .brk-track,.ov-gasto .brk-track{height:4px;margin:0}
  .brk-pct,.ov-gasto .brk-pct{width:46px;font-size:11.5px}
  .brk-total{margin:8px 0 0;padding:14px;gap:8px;border-radius:var(--m-r-sm);border-color:rgba(255,160,110,.18);
    background:linear-gradient(135deg,rgba(214,112,56,.24),rgba(214,112,56,.05)),var(--m-card)}
  .brk-tot{flex-direction:column;align-items:flex-start;gap:0}
  .brk-tot .k{font-size:12px}
  .brk-tot .v{font-size:22px}
}

@media (max-width:760px){
  /* ── cabecera de estructura: nombre + estado, metadatos en una ficha y pestañas ── */
  .esthead{display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:0;margin-bottom:18px;border:0}
  .esthead-id{gap:12px}
  .est-badge{width:44px;height:44px;border-radius:14px}
  .est-badge svg{width:20px;height:20px}
  .esthead .over{font-size:11.5px;margin-bottom:2px;color:var(--ink-3)}
  .esthead h1{font-size:23px;gap:8px;letter-spacing:-.03em}
  .esthead-meta{order:2;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;
    border-radius:var(--m-r-sm);background:var(--m-card);border:1px solid var(--m-line);overflow:hidden}
  .esthead-meta span{display:block;padding:10px 14px;border:0;border-radius:0;background:none;font-size:12px;
    color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .esthead-meta span:nth-child(n+3){border-top:1px solid var(--m-line)}
  .esthead-meta span:nth-child(even){border-left:1px solid var(--m-line)}
  .esthead-meta span:last-child{grid-column:1/-1}
  .esthead-meta svg{display:none}
  .esthead-meta b{color:var(--ink)}

  /* control segmentado: tres opciones iguales, la activa iluminada en cobre */
  .subtabs{order:3;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;
    border-radius:16px;background:var(--m-card);border:1px solid var(--m-line);box-shadow:none}
  .subtab{height:44px;padding:0 6px;border-radius:12px;font-size:13.5px;gap:6px;color:var(--ink-2);
    transition:background .2s,color .2s,box-shadow .2s}
  .subtab svg{width:15px;height:15px;flex-basis:15px}
  .subtab .lg{display:none}
  .subtab .sm{display:inline}
  .subtab.on{background:var(--m-cobre);color:#FFF;box-shadow:0 8px 22px -10px rgba(226,110,50,.9),inset 0 1px 0 rgba(255,255,255,.22)}
  .subtab .n{padding:3px 6px;font-size:10.5px}
  .subtab.on .n{background:rgba(255,255,255,.22);color:#FFF}

  /* ── resumen: objetivo, KPIs, desglose y origen ── */
  .grid-fin{gap:10px}
  .grid-fin .goal{margin-bottom:0}
  .grid-6040{gap:20px;margin-top:20px}
  .grid-6040 > section{display:block}

  /* origen del dinero: la cuenta con dinero es la tarjeta grande; las vacías, dos fichas */
  .orig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0}
  .orig-row,.orig-row + .orig-row{flex-direction:column;gap:10px;padding:14px;border-radius:var(--m-r-sm);
    background:var(--m-card);border:1px solid var(--m-line)}
  .orig-row:not(.vacio){grid-column:1/-1;flex-direction:row;padding:16px;border-color:rgba(255,160,110,.2);
    background:radial-gradient(110% 90% at 100% 0%,rgba(214,112,56,.3),transparent 62%),var(--m-card)}
  .orig-av{width:36px;height:36px;flex-basis:36px;font-size:13px}
  .orig-row.vacio .orig-av{width:30px;height:30px;flex-basis:30px;font-size:12px;opacity:.6}
  .orig-line{gap:8px}
  .orig-row.vacio .orig-line:first-child{flex-direction:column;align-items:flex-start;gap:2px}
  .orig-lbl{font-size:14px}
  .orig-f{font-size:20px}
  .orig-row:not(.vacio) .orig-f{font-size:24px}
  .orig-row.vacio .orig-f{font-size:17px}
  .orig-bar{height:5px;margin:8px 0}
  .orig-line:last-child{flex-direction:column;align-items:flex-start;gap:2px}
  .orig-sub,.orig-share{font-size:11px}
  .recon{grid-template-columns:minmax(0,1fr);gap:0;padding:0;margin-top:8px;overflow:hidden;
    border-radius:var(--m-r-sm);background:var(--m-card);border:1px solid var(--m-line)}
  .recon > div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;
    border:0;border-radius:0;background:none}
  .recon > div + div{border-top:1px solid var(--m-line)}
  .recon .lbl{margin:0;font-size:12px}
  .recon b{font-size:14px}

  /* ── pedidos: cifra principal + métricas secundarias agrupadas, gráfica y lista ── */
  .grid-an{gap:12px}
  .grid-an .kpis-stack{order:-1;grid-template-columns:minmax(0,1fr);grid-auto-rows:auto;gap:0}
  .kpis-3.compacto{grid-template-columns:minmax(0,1fr);gap:0}
  .kpis-stack .kpi,.kpis-3 .kpi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 12px;align-items:center;
    min-height:0;padding:12px 14px;border-radius:0;border-top-width:0;background:var(--m-card)}
  .kpis-stack .kpi-ico,.kpis-3 .kpi-ico{width:34px;height:34px}
  .kpis-stack .kpi-body,.kpis-3 .kpi-body{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:center}
  .kpis-stack .kpi-lbl,.kpis-3 .kpi-lbl{grid-column:1;grid-row:1;font-size:13px;font-weight:600;color:var(--ink)}
  .kpis-stack .kpi-foot,.kpis-3 .kpi-foot{grid-column:1;grid-row:2;margin-top:2px;font-size:11px}
  .kpis-stack .kpi-v,.kpis-3 .kpi-v,.compacto .kpi-v.fecha{grid-column:2;grid-row:1/3;margin:0;font-size:19px}
  .kpis-stack .kpi:nth-child(2),.kpis-3 .kpi:first-child{border-top-width:1px;border-radius:var(--m-r) var(--m-r) 0 0}
  .kpis-stack .kpi:nth-child(n+3),.kpis-3 .kpi + .kpi{box-shadow:inset 0 1px 0 var(--m-line)}
  .kpis-stack .kpi:last-child,.kpis-3 .kpi:last-child{border-radius:0 0 var(--m-r) var(--m-r)}
  /* pedidos totales como «saldo» principal */
  .kpis-stack .kpi:first-child{display:flex;flex-direction:column;align-items:stretch;margin-bottom:10px;padding:18px;
    border-top-width:1px;border-radius:var(--m-r);
    background:radial-gradient(110% 95% at 100% 0%,rgba(147,115,240,.42),rgba(94,66,192,.12) 45%,transparent 70%),var(--m-card)}
  .kpis-stack .kpi:first-child .kpi-body{display:flex;flex-direction:column;align-items:flex-start;margin-top:16px}
  .kpis-stack .kpi:first-child .kpi-lbl{font-size:13px;font-weight:500;color:var(--ink-2)}
  .kpis-stack .kpi:first-child .kpi-v{margin-top:2px;font-size:clamp(34px,11vw,42px)}
  .kpis-stack .kpi:first-child .kpi-foot{margin-top:6px;font-size:11.5px}

  /* gráfica: franjas cobre de fondo, línea clara y tooltip compacto */
  .chart-panel{background:linear-gradient(180deg,rgba(214,112,56,.13),transparent 60%),var(--m-card)}
  .chart-panel .panel-head{padding:16px 16px 0}
  .leyenda{display:none}
  .chart-panel .lcwrap{padding:14px 12px 4px}
  .lc{padding-left:40px}
  .chart-panel .lc-plot{min-height:220px;border-radius:8px;
    background:repeating-linear-gradient(90deg,rgba(214,112,56,.1) 0 3px,transparent 3px 11px)}
  .lc-area{left:8px;right:8px}
  .lc-x{margin:10px 8px 0}
  .lc-line{border-top-color:rgba(255,214,190,.06)}
  .lc-line b{font-size:10px;right:calc(100% + 8px)}
  .lc-x span{font-size:10.5px;color:var(--ink-3)}
  .chart-panel polyline{stroke:#FFB27A}
  .chart-panel stop{stop-color:#E8793C}
  .lc-svg{filter:drop-shadow(0 0 8px rgba(232,121,60,.5))}
  .lc-dot{width:7px;height:7px;border:2px solid #FFB27A}
  .lc-hit:hover .lc-dot{width:12px;height:12px;background:#FFF;border-color:#FFF;
    box-shadow:0 0 0 5px rgba(232,121,60,.3),0 0 18px 4px rgba(255,160,100,.8)}
  .lc-tip{padding:8px 11px;border-radius:12px;background:#241A15}
  .lc-tip .v{font-size:15px;border-left-color:#FFB27A}

  /* renovaciones: movimientos en baldosas */
  .rn-ancho{margin-top:20px;display:block}
  .rn-head{display:none}
  .rn,.rn-ancho .rn{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-flow:row;grid-template-rows:none;gap:5px;padding:0}
  .rn-row,.rn-ancho .rn-row,.rn-ancho .rn-row + .rn-row{grid-template-columns:auto minmax(0,1fr) auto;gap:0 14px;padding:9px 14px;
    border:1px solid var(--m-line);border-radius:var(--m-r-sm);background:var(--m-card)}
  .rn-f b{font-size:14.5px}
  .rn-f span{font-size:11.5px}
  .rn-f{grid-column:1;grid-row:1}
  .rn-n,.rn-ancho .rn-n{grid-column:3;grid-row:1;font-size:19px;min-width:22px;text-align:right}
  .rn-t,.rn-ancho .rn-t{grid-column:2;grid-row:1;height:4px;margin-top:0}
  .rn-total,.rn-ancho .rn-total{margin:8px 0 0;padding:14px;border-radius:var(--m-r-sm);
    background:linear-gradient(135deg,rgba(147,115,240,.26),rgba(147,115,240,.05)),var(--m-card)}
  .rn-total .v{font-size:24px}
  .rn-more{margin:8px 0 0;height:46px}

  /* ── publicidad: estado pendiente compacto; con datos, el flujo es la estrella ── */
  .pubbar{flex-direction:column;align-items:flex-start;gap:8px;padding:12px 14px;margin-bottom:12px;
    border-radius:var(--m-r-sm);background:var(--m-card)}
  .grid-pub{gap:12px}
  .flow{background:radial-gradient(100% 70% at 100% 0%,rgba(226,110,50,.42),transparent 62%),linear-gradient(170deg,#2A1A13,#150E0B)}
  .flow .panel-head{padding:16px 16px 4px}
  .flow-steps{grid-template-columns:minmax(0,1fr);padding:10px 12px 12px;gap:0}
  .rf-paso{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"ico lbl f" "ico cap f";
    gap:0 12px;align-items:center;padding:12px 14px;border-radius:var(--m-r-sm)}
  .rf-ico{grid-area:ico;width:36px;height:36px}
  .rf-paso .lbl{grid-area:lbl;margin:0;padding:0;font-size:13.5px;font-weight:600;color:var(--ink)}
  .rf-paso .cap{grid-area:cap;margin:0;font-size:11.5px}
  .rf-paso .f{grid-area:f;margin:0;font-size:20px}
  .rf-flecha{height:14px;position:relative;z-index:1}
  .rf-flecha svg{transform:rotate(90deg);width:26px;height:26px;padding:6px;margin:-6px 0}
  .rf-pie{margin:0 12px 14px;padding:10px 12px;font-size:12px}
  .flow:not(:has(.f.z)) .rf-paso{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"ico lbl" "f f" "cap cap";padding:16px}
  .flow:not(:has(.f.z)) .rf-paso .f{margin-top:10px;font-size:clamp(28px,9vw,36px)}
  .detalle .panel-head{padding:16px 16px 8px}
  .det-row{padding:12px 16px;gap:12px}
  .det-ico{width:34px;height:34px}
  .det-lbl{font-size:13.5px}
  .det-foot{font-size:11.5px}
  .det-v{font-size:18px}
  .grid-pub + .kpis-3{margin-top:12px}
}

/* ── pantallas muy estrechas (360 px es el peor caso) ── */
@media (max-width:400px){
  .subtab svg{display:none}
  .subtab{font-size:13px;gap:5px}
  .goal-stat b{font-size:17px}
  .kpi-v{font-size:clamp(19px,5.9vw,22px)}
  .spot-grid .m b,.spot .m b{font-size:15.5px}
  .estcard-grid b{font-size:13px}
}

  async function abrir(pass){
    if (!(window.crypto && crypto.subtle))

        ? e.message : 'Contraseña incorrecta.';
      btn.disabled = false; btn.textContent = 'Entrar';
      inp.value = ''; inp.focus();
    }
  }

  form.addEventListener('submit', e => { e.preventDefault(); entrar(inp.value, rec.checked); });

  let guardada = null;
  try { guardada = localStorage.getItem(CLAVE); } catch(e){}
  if (guardada){ rec.checked = true; entrar(guardada, true); } else { inp.focus(); }
})();
</script>

<body>
<div class="app">
  <aside id="side"></aside>
  <main>

<script>
let D = null;

/* ══════════════════════════════════════════════ FORMATO (es-ES) */
/* useGrouping:'always' para que 2500 salga como «2.500 €» y no «2500 €» */
const nf  = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',
              minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:'always'});
const nf0 = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',
              maximumFractionDigits:0, useGrouping:'always'});
const RAYA = '—';
const ok = v => typeof v === 'number' && isFinite(v);
const eur  = v => ok(v) ? nf.format(v) : RAYA;
const eur0 = v => ok(v) ? nf0.format(v) : RAYA;
const eurS = v => ok(v) ? (v > 0 ? '+' : '') + nf0.format(v) : RAYA;
const pct  = v => ok(v) ? new Intl.NumberFormat('es-ES',{minimumFractionDigits:1,
               maximumFractionDigits:1}).format(v) + ' %' : RAYA;
const ent  = v => ok(v) ? new Intl.NumberFormat('es-ES').format(v) : RAYA;
const fch  = s => { if(!s) return RAYA; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; };
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const vacio = (t) => `<div class="empty"><span class="big">${esc(t||'Sin datos todavía')}</span>
  Aparecerá aquí en cuanto se registre en el Excel.</div>`;

/* ══════════════════════════════════════════════ COMPONENTES DE PRESENTACIÓN
   Solo pintan. Todos los cálculos siguen siendo los de siempre. */
const svgI = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICO = {

  cal:    svgI('<rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>'),

/* tarjeta KPI: icono arriba, cifra anclada abajo (misma gramática en todas las páginas) */
function kpiCard({cls = '', ico, lbl, v, vcls = '', foot = ''}){

    <div class="kpi ${cls}">

      </div>

}

/* cabecera de panel: título dentro de la tarjeta, nota a la derecha */
const panelHead = (titulo, nota, accion = '') => `
    <div class="panel-head">
      <div class="ph-t"><h2>${esc(titulo)}</h2>${nota ? `<span class="note">${nota}</span>` : ''}</div>

/* ══════════════════════════════════════════════ OBJETIVOS
   Meter de una sola tinta (rampa dorada) sobre pista del mismo tono.
   Reglas: la barra nunca es negativa ni pasa del 100 %, y lo que falta
   nunca supera al objetivo aunque haya perdidas. */
const OBJ_GLOBAL = 1000000;
const OBJ_ESTRUCTURA = 50000;

const pctMeta = v => v <= 0 ? '0 %'
  : v < 0.1 ? '< 0,1 %'
  : new Intl.NumberFormat('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1})
      .format(v) + ' %';

function metaHTML(titulo, facturacion, objetivo, etiqueta){
  /* La barra se alimenta EXCLUSIVAMENTE de facturación neta registrada.
     Ni profit, ni ROI, ni gastos, ni saldo entran aquí. */
  const p       = ok(facturacion) ? facturacion : 0;
  const logrado = Math.max(0, p);                    // nunca cuenta en negativo
  const pv      = objetivo > 0 ? logrado / objetivo * 100 : 0;
  const ancho   = Math.min(100, pv);                 // tope visual en 100 %
  const falta   = Math.max(0, objetivo - logrado);   // nunca mas que el objetivo
  const completo = p >= objetivo;                    // barra al 100 %
  const excede   = p >  objetivo;                    // solo entonces: EXCEDENTE

  const msg = p < 0
      ? 'Facturación neta negativa: hay más devoluciones y contracargos que ventas.'
    : p === 0
      ? 'Todavía sin facturación registrada.'
    : excede
      ? `Objetivo superado en ${eur0(p - objetivo)}.`
    : completo
      ? '¡Objetivo alcanzado!'
      : `Queda el ${pctMeta(100 - pv)} del camino.`;

  return `
  <section class="goal anim">
    <div class="goal-main">
      <div class="goal-title"><span class="dia"></span><h2>${esc(titulo)}</h2></div>
      <span class="goal-lbl">${esc(etiqueta)}</span>
      <div class="goal-big num ${p<0?'neg':''}">${eur0(p)}</div>
    </div>
    <div class="goal-side">
      <div class="goal-stats">
        <div class="goal-stat"><span class="goal-lbl">Conseguido</span>
          <b class="gold num">${esc(pctMeta(pv))}</b></div>
        <div class="goal-stat"><span class="goal-lbl">${excede?'Excedente':'Falta para el objetivo'}</span>
          <b class="num">${excede?eur0(p-objetivo):eur0(falta)}</b></div>
        <span class="goal-target">Objetivo · ${nf0.format(objetivo)}</span>
      </div>
      <div class="goal-track">
        <span class="goal-fill" style="width:${ancho.toFixed(4)}%"></span></div>
      <div class="goal-foot">
        <span class="mono">0 €</span>
        <span class="msg">${esc(msg)}</span>
        <span class="mono">${nf0.format(objetivo)}</span>
      </div>
    </div>
  </section>`;
}

/* ══════════════════════════════════════════════ DESGLOSE DE LA INVERSIÓN
   Una fila por partida real. Los generales imputados salen con su propio
   nombre y etiqueta: asi la suma cuadra SIEMPRE con el total invertido. */
function colorPartida(x){
  if (x.tipo === 'residual') return 'var(--bar-res)';
  if (x.tipo === 'general')  return 'var(--bar-gen)';
  return x.nombre === 'Publicidad' ? 'var(--bar-pub)' : 'var(--bar-dir)';
}
function desgloseHTML(items, total, nota, cabecera = ''){
  if (!items.length) return `<div class="panel">${cabecera}${vacio('Todavía no hay gastos')}</div>`;
  const max = Math.max(...items.map(i => Math.abs(i.importe)), 1);
  const suma = items.reduce((a,b) => a + b.importe, 0);
  const cuadra = Math.abs(suma - total) < 0.005;
  const filas = items.map(x => `
    <div class="brk-row">
      <div class="brk-line">
        <span class="brk-name"><i class="brk-dot" style="background:${colorPartida(x)}"></i><span class="t" title="${esc(x.nombre)}">${esc(x.nombre)}</span>${
          x.tipo === 'general'  ? '<span class="tag gen">general</span>' :
          x.tipo === 'residual' ? '<span class="tag res">sin clasificar</span>' : ''}</span>
        <span class="brk-amt num">${eur(x.importe)}</span>
      </div>
      <div class="brk-line">
        <span class="brk-track"><span class="brk-fill" style="width:${
          (Math.max(0,x.importe)/max*100).toFixed(2)}%;background:${colorPartida(x)}"></span></span>
        <span class="brk-pct num">${pct(x.pct)}</span>
      </div>
    </div>`).join('');
  return `
  <div class="panel brk-panel">
    ${cabecera}
    <div class="brk">${filas}</div>
    <div class="brk-total">
      <div class="brk-tot"><span class="k">Total invertido</span><span class="v num">${eur(total)}</span></div>
      <span class="q ${cuadra ? '' : 'warn'}">${cuadra ? '✓ el desglose cuadra'
        : `⚠ diferencia de ${eur(suma - total)}`}</span>
    </div>
    ${nota ? `<p class="panel-cap">${nota}</p>` : ''}
  </div>`;
}

/* ══════════════════════════════════════════════ ORIGEN DEL DINERO */
function origenHTML(o, total, cabecera = ''){

        <div class="orig-body">

            <span class="orig-lbl">${esc(t.l)}</span>
            <span class="orig-f num ${t.v?'':'z'}" style="${t.v?`color:${t.c}`:''}">${eur(t.v)}</span>
          </div>
          <div class="orig-bar"><span style="width:${
            (Math.max(0,t.v)/max*100).toFixed(2)}%;background:${t.c}"></span></div>
          <div class="orig-line">
            <span class="orig-sub">${t.s}</span>
            <span class="orig-share num">${total?pct(t.v/total*100):RAYA} de la inversión</span>
          </div>
        </div>
      </div>`).join('')}</div>
    <div class="recon">
      <div><span class="lbl">Adelanto personal M</span><b class="num" style="color:${
        o.adelantoM?'var(--m)':'var(--ink-3)'}">${eur(o.adelantoM)}</b></div>
      <div><span class="lbl">Adelanto personal C</span><b class="num" style="color:${
        o.adelantoC?'var(--c)':'var(--ink-3)'}">${eur(o.adelantoC)}</b></div>
      <div><span class="lbl">Adelantos en total</span><b class="num" style="color:${
        adel?'var(--ink)':'var(--ink-3)'}">${eur(adel)}</b></div>
      <div class="${cuadra?'ok':'warn'}"><span class="lbl">Suma de los orígenes</span>
