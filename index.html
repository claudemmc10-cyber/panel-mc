<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0808">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<title>M&amp;C Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">

<style>
/* ═══════════════════════════════════════════════════ TOKENS
   Un único sistema visual: negro cálido, luz coral muy medida y colores
   funcionales (verde/rojo = resultado, dorado = objetivos, morado = pedidos). */
:root{
  /* superficies · de más hundida a más elevada */
  --bg:#0A0808;  --side:#0E0B0B; --sunk:#0C0A0A;
  --card:#131010; --card-2:#191413; --hover:#1E1817;
  /* bordes ultrafinos */
  --line:rgba(255,236,228,.07); --line-2:rgba(255,236,228,.11); --line-3:rgba(255,236,228,.19);
  /* texto */
  --ink:#F6F1EE; --ink-2:#ACA29E; --ink-3:#766C68; --ink-4:#4F4643;

  /* acento de marca */
  --coral:#EF5B43; --coral-d:#8C2517; --coral-t:#FF9477;
  --coral-a:rgba(239,91,67,.14);
  /* funcionales */
  --prof:#2DB27D; --prof-t:#5FD7A1; --prof-a:rgba(45,178,125,.12);
  --loss:#E2475B; --loss-t:#FF6F80; --loss-a:rgba(226,71,91,.12);
  --gold-d:#9E7424; --gold:#D6A33C; --gold-t:#F0C76B;
  --gold-track:rgba(214,163,60,.09);
  --alt:#9373F0; --alt-t:#B8A2FB; --alt-d:#5E42C0; --alt-a:rgba(147,115,240,.13);
  /* identidades del reparto */
  --k:#FF8566; --m:#7EA7F0; --c:#4CC3B1;
  /* series del desglose */
  --bar-dir:linear-gradient(90deg,#9E2F1F,#EF5B43);
  --bar-pub:linear-gradient(90deg,#B4651E,#F2A052);
  --bar-gen:linear-gradient(90deg,#5A4E4A,#A89A94);
  --bar-res:linear-gradient(90deg,#7C1F2C,#E2475B);
  /* compatibilidad con los nombres que usa la plantilla */
  --rev-t:var(--ink); --spend-t:var(--ink); --rev:#A89A94; --spend:var(--coral);
  --panel:var(--card); --panel-2:var(--card-2);

  /* radios */
  --r-xl:18px; --r-lg:16px; --r-md:12px; --r-sm:9px; --r-xs:6px;
  /* espaciado */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px;
  /* profundidad */
  --sh:0 24px 48px -28px rgba(0,0,0,.75);
  --hl:inset 0 1px 0 rgba(255,240,235,.045);
  --t:.16s cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  margin:0; color:var(--ink); min-height:100vh;
  background:
    radial-gradient(1000px 600px at 104% -10%, rgba(239,91,67,.17), rgba(239,91,67,.05) 45%, transparent 68%),
    radial-gradient(760px 520px at -12% 112%, rgba(239,91,67,.11), transparent 62%),
    var(--bg);
  background-attachment:fixed;
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.022em;line-height:1.12}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid rgba(255,148,119,.55);outline-offset:2px;border-radius:var(--r-sm)}
.mono,.num{font-variant-numeric:tabular-nums}
.num{letter-spacing:-.03em}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);line-height:1.35}

/* superficie base reutilizable: card con luz superior y borde de 1 px */
.card,.panelbig,.tablewrap,.spot,.estcard,.roasflow{
  background:linear-gradient(180deg,rgba(255,240,235,.028),rgba(255,240,235,0) 38%),var(--card);
  border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--hl),var(--sh);
}

/* ═══════════════════════════════════════════════════ SHELL */
.app{display:flex;min-height:100vh}
aside{
  width:236px;flex:0 0 236px;margin:14px 0 14px 14px;
  height:calc(100vh - 28px);position:sticky;top:14px;overflow-y:auto;
  display:flex;flex-direction:column;padding:20px 12px 16px;
  background:linear-gradient(180deg,rgba(255,240,235,.03),transparent 30%),var(--side);
  border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--hl);
  scrollbar-width:none;
}
aside::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 22px}
.brand .mark{
  width:38px;height:38px;border-radius:11px;flex:0 0 38px;display:grid;place-items:center;
  background:radial-gradient(120% 120% at 100% 100%,#F26A4F 0%,#B8321F 45%,#3A120C 100%);
  color:#FFF4EF;font-weight:700;font-size:12.5px;letter-spacing:-.03em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 0 0 1px rgba(255,140,110,.18),0 10px 24px -10px rgba(239,91,67,.7);
}
.brand b{font-size:15px;font-weight:600;display:block;letter-spacing:-.02em;line-height:1.2}
.brand b i{font-style:normal;color:var(--coral-t)}
.brand span{font-size:11.5px;color:var(--ink-3);display:block;margin-top:2px}
.navgroup{margin-bottom:18px}
.navgroup > .eyebrow{padding:0 10px 8px;color:var(--ink-4)}
.navlink{
  position:relative;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);
  color:var(--ink-2);font-size:13.5px;font-weight:500;width:100%;text-align:left;
  transition:background var(--t),color var(--t),box-shadow var(--t);
}
.navlink svg{width:17px;height:17px;flex:0 0 17px;opacity:.75;transition:opacity var(--t)}
.navlink:hover{background:rgba(255,240,235,.04);color:var(--ink)}
.navlink:hover svg{opacity:1}
.navlink.on{color:var(--ink);
  background:linear-gradient(90deg,rgba(239,91,67,.13),rgba(239,91,67,.02) 70%),var(--card-2);
  box-shadow:inset 0 0 0 1px var(--line-2),var(--hl)}
.navlink.on svg{opacity:1;color:var(--coral-t)}
.navlink.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;
  border-radius:0 3px 3px 0;background:var(--coral);box-shadow:0 0 12px rgba(239,91,67,.8)}
.navlink .lbl-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navlink .dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px;background:var(--ink-4)}
.navlink .dot.act{background:var(--prof);box-shadow:0 0 0 3px rgba(45,178,125,.16)}
.navlink .dot.cer{background:var(--ink-3)}
.navlink .dot.pau{background:var(--gold)}
.sidefoot{margin-top:auto;padding:14px 10px 2px;border-top:1px solid var(--line);
  font-size:11px;color:var(--ink-3);line-height:1.65}
.sidefoot .mono{color:var(--ink-4)}

main{flex:1;min-width:0;padding:30px 40px 90px;max-width:1340px}
.topbar{display:none}

/* ═══════════════════════════════════════════════════ CABECERAS */
.pagehead{margin-bottom:var(--s6)}
.pagehead .over{display:block;margin-bottom:10px}
.pagehead h1{font-size:36px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;letter-spacing:-.03em}
.pagehead .sub{color:var(--ink-3);font-size:13.5px;margin-top:8px}
.pagehead .metas{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pagehead .metas span{display:inline-flex;align-items:baseline;gap:6px;padding:5px 11px;
  border-radius:999px;border:1px solid var(--line);background:rgba(255,240,235,.025);
  font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.pagehead .metas b{color:var(--ink);font-weight:600}

/* ═══════════════════════════════════════════════════ PÍLDORAS */
.pill{
  display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;line-height:1;white-space:nowrap;
  padding:6px 10px 6px 9px;border-radius:999px;border:1px solid;vertical-align:middle;
}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
.pill.activa{color:var(--prof-t);border-color:rgba(45,178,125,.32);background:rgba(45,178,125,.08)}
.pill.activa::before{box-shadow:0 0 8px currentColor}
.pill.cerrada{color:var(--ink-2);border-color:var(--line-2);background:rgba(255,240,235,.03)}
.pill.pausada{color:var(--gold-t);border-color:rgba(214,163,60,.32);background:rgba(214,163,60,.08)}

/* ═══════════════════════════════════════════════════ BOTONES */
.linkbtn{font-size:13px;font-weight:500;color:var(--ink);display:inline-flex;
  align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,240,235,.05),rgba(255,240,235,.015)),var(--card-2);
  border:1px solid var(--line-2);box-shadow:var(--hl);
  transition:border-color var(--t),background var(--t),box-shadow var(--t),color var(--t)}
.linkbtn:hover{border-color:rgba(255,148,119,.4);
  box-shadow:var(--hl),0 0 0 3px rgba(239,91,67,.08),0 8px 22px -12px rgba(239,91,67,.6)}

/* ═══════════════════════════════════════════════════ KPI */
.kpis{display:grid;gap:14px;margin-bottom:14px}
.kpis.hero{grid-template-columns:1.32fr 1fr 1fr 1fr}
.kpis.four{grid-template-columns:repeat(4,1fr)}
.card{position:relative;overflow:hidden;padding:20px 22px;
  transition:border-color var(--t),transform var(--t),box-shadow var(--t)}
.card:hover{border-color:var(--line-2)}
.kpi{display:flex;flex-direction:column}
.kpi .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  margin-bottom:20px;color:var(--ink-2);border:1px solid var(--line-2);
  background:radial-gradient(100% 100% at 30% 20%,rgba(255,240,235,.07),rgba(255,240,235,.01));
  box-shadow:var(--hl)}
.kpi .ico svg{width:17px;height:17px}
.kpi .lbl{display:block;margin-bottom:10px}
.kpi .v{display:block;font-size:34px;font-weight:600;letter-spacing:-.035em;line-height:1.05;
  white-space:nowrap}
.kpi .foot{display:block;margin-top:10px;font-size:12.5px;color:var(--ink-3);line-height:1.45}
.kpi .foot b{color:var(--ink-2);font-weight:600}
/* KPI prioritario: luz coral entrando por la esquina superior derecha */
.kpi.big{border-color:rgba(255,148,119,.16);
  background:
    radial-gradient(130% 120% at 106% -8%,rgba(239,91,67,.46),rgba(214,64,44,.16) 36%,transparent 66%),
    radial-gradient(55% 45% at 100% 0%,rgba(255,176,146,.16),transparent 70%),
    linear-gradient(180deg,rgba(255,240,235,.03),transparent 40%),var(--card)}
.kpi.big::after{content:"";position:absolute;right:-1px;top:-1px;width:55%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,160,130,.6))}
.kpi.big .ico{color:var(--coral-t);border-color:rgba(255,148,119,.3);
  background:radial-gradient(100% 100% at 30% 20%,rgba(239,91,67,.28),rgba(239,91,67,.06))}
.kpi.big .v{font-size:clamp(36px,3.4vw,48px)}
.v.pos{color:var(--prof-t)} .v.neg{color:var(--loss-t)}
.v.rev,.v.spend{color:var(--ink)}

/* ═══════════════════════════════════════════════════ SECCIONES */
section{margin-top:40px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;
  margin-bottom:14px;flex-wrap:wrap}
.sechead h2{font-size:18px;letter-spacing:-.02em}
.sechead .note{font-size:12.5px;color:var(--ink-3)}

/* ═══════════════════════════════════════════════════ OBJETIVO · hero dorado */
.goal{
  margin-top:0;margin-bottom:34px;border-radius:var(--r-xl);position:relative;overflow:hidden;
  border:1px solid rgba(214,163,60,.2);padding:26px 30px 24px;
  background:
    radial-gradient(55% 150% at 100% 0%,rgba(214,163,60,.17),transparent 62%),
    radial-gradient(35% 90% at 0% 100%,rgba(239,91,67,.06),transparent 70%),
    linear-gradient(180deg,#17120E,#100D0C);
  box-shadow:inset 0 1px 0 rgba(255,220,150,.07),0 30px 60px -34px rgba(214,163,60,.28),var(--sh);
}
.goal::before{content:"";position:absolute;left:8%;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(240,199,107,.65) 70%,rgba(240,199,107,.2))}
.goal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;margin-bottom:22px}
.goal-head h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  color:var(--gold-t)}
.goal-title{display:flex;align-items:center;gap:12px;min-width:0}
.goal-title .dia{width:9px;height:9px;flex:0 0 9px;transform:rotate(45deg);border-radius:2px;
  background:linear-gradient(140deg,#FFE3A0,var(--gold-d));
  box-shadow:0 0 0 4px rgba(214,163,60,.12),0 0 14px rgba(240,199,107,.7)}
.goal-target{font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap;
  border:1px solid rgba(214,163,60,.26);background:rgba(214,163,60,.06);
  padding:6px 13px;border-radius:999px}
.goal-figs{display:grid;grid-template-columns:repeat(3,auto);gap:14px 64px;
  justify-content:start;margin-bottom:22px}
.goal-figs > div{display:flex;flex-direction:column;justify-content:flex-end}
.goal-figs .lbl{display:block;margin-bottom:8px}
.goal-figs .f{font-size:36px;font-weight:600;letter-spacing:-.04em;line-height:1.02;white-space:nowrap}
.goal-figs .f.gold{color:var(--gold-t);text-shadow:0 0 28px rgba(240,199,107,.25)}
.goal-figs .f.rev{color:var(--ink)} .goal-figs .f.neg{color:var(--loss-t)}
.goal-track{height:10px;border-radius:999px;overflow:hidden;position:relative;
  background:
    repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),rgba(240,199,107,.14) calc(25% - 1px) 25%),
    var(--gold-track);
  box-shadow:inset 0 0 0 1px rgba(214,163,60,.14),inset 0 1px 2px rgba(0,0,0,.4)}
.goal-fill{display:block;height:100%;border-radius:999px;position:relative;overflow:hidden;
  background:linear-gradient(90deg,var(--gold-d),var(--gold) 60%,#FFE09A);
  box-shadow:0 0 18px rgba(240,199,107,.55);
  transition:width .7s cubic-bezier(.22,1,.36,1)}
.goal-foot{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  margin-top:12px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.goal-foot .mono{font-size:11px;color:var(--ink-4)}
.goal-foot .msg{color:var(--ink-2);text-align:center;flex:1 1 auto}

/* ═══════════════════════════════════════════ ESTRUCTURA ACTUAL · resumen ejecutivo */
.spot{overflow:hidden;transition:border-color var(--t)}
.spot:hover{border-color:var(--line-2)}
.spot .top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;
  padding:20px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap;
  background:radial-gradient(60% 160% at 0% 0%,rgba(255,240,235,.035),transparent 70%)}
.spot .top h3{font-size:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;letter-spacing:-.025em}
.spot .meta{display:flex;gap:8px;flex-wrap:wrap}
.spot .meta span{font-size:12.5px;color:var(--ink-3);white-space:nowrap;padding:4px 11px;
  border-radius:999px;border:1px solid var(--line);background:rgba(255,240,235,.02)}
.spot .meta b{color:var(--ink);font-weight:600}
.spot .grid{display:grid;grid-template-columns:repeat(6,1fr)}
.spot .grid.tres{grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);
  background:rgba(0,0,0,.16)}
.spot .grid > div{padding:20px 24px;min-width:0}
.spot .grid > div + div{box-shadow:inset 1px 0 0 var(--line)}
.spot .grid .lbl{display:block;margin-bottom:9px}
.spot .grid .v{font-size:23px;font-weight:600;letter-spacing:-.03em;white-space:nowrap}
.spot .grid.tres > div{padding:16px 24px}
.spot .grid.tres .v{font-size:18px;color:var(--ink-2)}
.spot .cta{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;
  background:rgba(0,0,0,.16)}

/* ═══════════════════════════════════════════════════ TABLA */
.tablewrap{overflow:hidden}
.scroller{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:660px}
thead th{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);text-align:left;padding:16px 22px 14px;border-bottom:1px solid var(--line);
  white-space:nowrap}
th.n,td.n{text-align:right}
tbody td{padding:17px 22px;border-bottom:1px solid var(--line);white-space:nowrap;
  transition:background var(--t)}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:rgba(255,240,235,.03)}
tbody tr:hover td:first-child{box-shadow:inset 2px 0 0 var(--coral)}
td.name{font-weight:600;letter-spacing:-.01em}
.empty{padding:44px 22px;text-align:center;color:var(--ink-3);font-size:13.5px}
.empty .big{display:block;font-size:15px;color:var(--ink-2);margin-bottom:6px;font-weight:500}

/* ═══════════════════════════════ TODAS LAS ESTRUCTURAS · versión estrecha
   La tabla no cabe en un móvil y no queremos barras horizontales: se pinta
   una tarjeta por estructura y el CSS decide cuál de las dos se ve. */
.solo-estrecho{display:none}
.estlist{gap:12px}
.estcard{display:block;width:100%;text-align:left;overflow:hidden;
  transition:border-color var(--t),background var(--t)}
.estcard:hover,.estcard:active{border-color:var(--line-2)}
.estcard-top{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:15px 16px;border-bottom:1px solid var(--line)}
.estcard-top b{font-size:15px;font-weight:600;letter-spacing:-.015em;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.estcard-grid{display:grid;grid-template-columns:1fr 1fr}
.estcard-grid > div{padding:14px 16px;min-width:0}
.estcard-grid > div:nth-child(even){box-shadow:inset 1px 0 0 var(--line)}
.estcard-grid > div:nth-child(n+3){border-top:1px solid var(--line)}
.estcard-grid .eyebrow{display:block;margin-bottom:6px}
.estcard-grid b{font-size:17px;font-weight:600;letter-spacing:-.025em;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.estcard-grid b.pos{color:var(--prof-t)} .estcard-grid b.neg{color:var(--loss-t)}
.estcard-grid b.rev,.estcard-grid b.spend{color:var(--ink)}
.estcard-pie{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 16px;background:rgba(0,0,0,.18);border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink-3)}
.estcard-pie span:last-child{color:var(--coral-t);font-weight:500}

/* ═══════════════════════════════════════════════════ AVISOS */
.alert{display:flex;gap:12px;padding:13px 16px;border-radius:var(--r-md);font-size:13px;
  margin-bottom:12px;border:1px solid}
.alert.info{background:rgba(255,240,235,.03);border-color:var(--line-2);color:var(--ink-2)}
.alert.error{background:var(--loss-a);border-color:rgba(226,71,91,.35);color:#FFC2C9}

/* ═══════════════════════════════════════════════════ ANIMACIÓN */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim{animation:rise .38s cubic-bezier(.22,1,.36,1) both}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ═══════════════════════════════════════════════════ BLOQUE ANCHO */
.panelbig{overflow:hidden}
.panelbig .cap{font-size:13px;color:var(--ink-3);padding:22px 28px 0;max-width:80ch;line-height:1.55}

/* desglose de la inversión */
.brk{padding:10px 28px 6px}
.brk-row{display:grid;grid-template-columns:minmax(160px,1.1fr) 3fr minmax(110px,auto) minmax(64px,auto);
  gap:24px;align-items:center;padding:16px 0}
.brk-row + .brk-row{border-top:1px solid var(--line)}
.brk-name{font-size:14.5px;font-weight:500;color:var(--ink);display:flex;align-items:center;
  gap:9px;min-width:0}
.brk-name span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;line-height:1;
  padding:4px 7px;border-radius:var(--r-xs);flex:0 0 auto;
  color:var(--ink-3);border:1px solid var(--line-2);background:rgba(255,240,235,.03)}
.tag.gen{color:#D9CCC6;border-color:var(--line-3);background:rgba(255,240,235,.05)}
.tag.res{color:var(--loss-t);border-color:rgba(226,71,91,.38);background:var(--loss-a)}
.brk-track{height:8px;border-radius:999px;background:rgba(255,240,235,.05);overflow:hidden}
.brk-fill{display:block;height:100%;border-radius:999px;min-width:4px;
  transition:width .55s cubic-bezier(.22,1,.36,1),filter var(--t)}
.brk-row:hover .brk-fill{filter:brightness(1.18)}
.brk-amt{font-size:15px;font-weight:600;text-align:right;white-space:nowrap;letter-spacing:-.01em}
.brk-pct{font-size:13px;color:var(--ink-3);text-align:right;white-space:nowrap}
.brk-total{display:grid;
  grid-template-columns:minmax(160px,1.1fr) 3fr minmax(110px,auto) minmax(64px,auto);
  gap:24px;align-items:center;padding:20px 28px;border-top:1px solid var(--line-2);
  background:linear-gradient(90deg,rgba(239,91,67,.07),transparent 55%),rgba(0,0,0,.2)}
.brk-total .k{font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2)}
.brk-total .v{grid-column:3;font-size:22px;font-weight:600;text-align:right;color:var(--ink);
  white-space:nowrap;letter-spacing:-.03em}
.brk-total .q{grid-column:4;justify-self:end;font-size:11.5px;color:var(--prof-t);white-space:nowrap;
  padding:4px 9px;border-radius:999px;border:1px solid rgba(45,178,125,.28);background:var(--prof-a)}

/* origen del dinero */
.orig{display:grid;grid-template-columns:repeat(3,1fr)}
.orig-tile{padding:26px 28px 26px;min-width:0}
.orig-tile + .orig-tile{box-shadow:inset 1px 0 0 var(--line)}
.orig-tile .lbl{display:block;margin-bottom:10px}
.orig-tile .f{font-size:32px;font-weight:600;letter-spacing:-.035em;line-height:1.05;
  margin-bottom:16px;white-space:nowrap}
.orig-tile .f.z{color:var(--ink-4)}
.orig-bar{height:6px;border-radius:999px;background:rgba(255,240,235,.05);overflow:hidden}
.orig-bar span{display:block;height:100%;border-radius:999px;
  transition:width .55s cubic-bezier(.22,1,.36,1)}
.orig-share{margin-top:14px;font-size:13px;font-weight:600;color:var(--ink-2)}
.orig-sub{margin-top:4px;font-size:12.5px;color:var(--ink-3);line-height:1.45}
.orig-sub b{color:var(--ink-2);font-weight:600}
.recon{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);
  background:rgba(0,0,0,.2)}
.recon > div{padding:17px 28px;min-width:0}
.recon > div + div{box-shadow:inset 1px 0 0 var(--line)}
.recon .lbl{display:block;margin-bottom:7px}
.recon b{font-size:16px;font-weight:600;letter-spacing:-.02em}
.recon .ok b{color:var(--prof-t)}
.recon .warn b{color:var(--loss-t)}

/* ═══════════════════════════════════════════ PESTAÑAS · control segmentado */
.subtabs{display:flex;gap:4px;margin:0 0 30px;padding:4px;border-radius:14px;
  background:rgba(0,0,0,.34);border:1px solid var(--line);width:fit-content;max-width:100%;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.45),var(--hl)}
.subtab{flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;padding:9px 17px;
  border-radius:10px;font-size:13.5px;font-weight:500;color:var(--ink-3);white-space:nowrap;
  transition:color var(--t),background var(--t),box-shadow var(--t)}
.subtab:hover{color:var(--ink-2);background:rgba(255,240,235,.03)}
.subtab.on{color:var(--ink);
  background:linear-gradient(180deg,rgba(255,240,235,.075),rgba(255,240,235,.02)),var(--card-2);
  box-shadow:inset 0 0 0 1px var(--line-2),inset 0 1px 0 rgba(255,240,235,.08),0 8px 20px -12px rgba(0,0,0,.95)}
.subtab .dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px;background:var(--ink-4);
  transition:background var(--t),box-shadow var(--t)}
.subtab.fin.on .dot{background:var(--gold-t);box-shadow:0 0 0 3px rgba(214,163,60,.16),0 0 10px rgba(240,199,107,.7)}
.subtab.ped.on .dot{background:var(--alt-t);box-shadow:0 0 0 3px rgba(147,115,240,.2),0 0 10px rgba(184,162,251,.7)}
.subtab.pub.on .dot{background:var(--coral-t);box-shadow:0 0 0 3px rgba(239,91,67,.18),0 0 10px rgba(255,148,119,.7)}
.subtab .n{font-size:10.5px;font-weight:600;line-height:1;padding:3px 7px;border-radius:999px;
  color:var(--ink-3);border:1px solid var(--line-2)}
.subtab.on .n{color:var(--alt-t);border-color:rgba(184,162,251,.32);background:var(--alt-a)}
.subtab .sm{display:none}

/* ═══════════════════════════════════════════ PEDIDOS Y SUSCRIPCIONES
   Morado = suscripciones: identidad secundaria de este módulo. */
.kpis.tres{grid-template-columns:repeat(3,1fr)}
.kpis.cuatro{grid-template-columns:repeat(4,1fr)}
.kpis.cuatro .ico{color:var(--alt-t)}
.aclara{margin-top:14px;font-size:12.5px;color:var(--ink-3);line-height:1.55;max-width:92ch}
.aclara b{color:var(--ink-2);font-weight:600}
.v.alt{color:var(--alt-t)}
.kpi.altbg{border-color:rgba(184,162,251,.14);background:
  radial-gradient(120% 110% at 104% -6%,rgba(147,115,240,.28),rgba(147,115,240,.07) 36%,transparent 62%),
  linear-gradient(180deg,rgba(255,240,235,.03),transparent 40%),var(--card)}
.kpi.altbg .ico{border-color:rgba(184,162,251,.3);
  background:radial-gradient(100% 100% at 30% 20%,rgba(147,115,240,.3),rgba(147,115,240,.06))}
.kpi.grande .v{font-size:clamp(34px,3.2vw,44px)}
.kpi.grande .v.fecha{font-size:clamp(26px,2.4vw,34px)}

/* ---- gráfica de facturación por día · línea con puntos
   El SVG se estira con preserveAspectRatio="none" (coordenadas en %), asi que
   es responsive sin medir nada en JS; vector-effect mantiene el grosor real
   del trazo pese al estirado. Los puntos son HTML colocados en porcentajes. */
.lcwrap{padding:28px 28px 20px;
  background:radial-gradient(60% 70% at 85% 0%,rgba(147,115,240,.07),transparent 70%)}
.lc{padding-left:56px;position:relative}
.lc-plot{position:relative;height:320px}
.lc-line{position:absolute;left:0;right:0;height:0;border-top:1px solid rgba(255,236,228,.05);
  pointer-events:none}
.lc-line.base{border-top-color:var(--line-2)}
.lc-line b{position:absolute;right:calc(100% + 12px);top:-8px;font-weight:500;
  font-size:11px;color:var(--ink-4)}
.lc-area{position:absolute;left:13px;right:13px;top:0;bottom:0}
.lc-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;
  filter:drop-shadow(0 0 10px rgba(147,115,240,.35));
  animation:trazo .5s cubic-bezier(.22,1,.36,1) both}
@keyframes trazo{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.lc-hit{position:absolute;top:0;bottom:0;transform:translateX(-50%)}
.lc-hit::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;opacity:0;
  background:repeating-linear-gradient(180deg,rgba(255,236,228,.4) 0 4px,transparent 4px 8px);
  transition:opacity var(--t)}
.lc-hit:hover::before{opacity:1}
.lc-dot{position:absolute;left:50%;width:9px;height:9px;border-radius:50%;
  transform:translate(-50%,50%);background:var(--card);border:2px solid var(--alt-t);
  pointer-events:none;animation:aparecer .45s ease-out both;
  transition:width .13s,height .13s,background .13s,box-shadow .13s,border-color .13s}
.lc-hit:hover .lc-dot{width:13px;height:13px;background:#FFFFFF;border-color:#FFFFFF;
  box-shadow:0 0 0 5px rgba(147,115,240,.28),0 0 22px 4px rgba(184,162,251,.85)}
.lc-area.denso .lc-dot{width:6px;height:6px;border-width:2px}
.lc-area.denso .lc-hit:hover .lc-dot{width:12px;height:12px}
.lc-tip{position:absolute;left:50%;transform:translateX(-50%);z-index:5;
  background:linear-gradient(180deg,rgba(255,240,235,.05),rgba(255,240,235,0)),#171211;
  border:1px solid var(--line-2);border-radius:12px;padding:10px 14px 11px;
  box-shadow:inset 0 1px 0 rgba(255,240,235,.06),0 20px 44px -14px rgba(0,0,0,.95);
  white-space:nowrap;display:none;pointer-events:none}
.lc-hit:hover .lc-tip{display:block;animation:aparecer .14s ease-out both}
.lc-hit.xi .lc-tip{left:0;transform:none}
.lc-hit.xf .lc-tip{left:auto;right:0;transform:none}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
.lc-tip .d{display:block;font-size:11px;color:var(--ink-3);margin-bottom:6px}
.lc-tip .v{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em;color:var(--ink);
  padding-left:9px;border-left:2px solid var(--alt-t);line-height:1.2}
.lc-tip .v.z{color:var(--ink-2);border-left-color:var(--ink-4)}
.lc-tip .s{display:block;margin-top:5px;padding-left:11px;font-size:11.5px;color:var(--ink-3)}
.lc-x{position:relative;height:22px;margin:12px 13px 0}
.lc-x span{position:absolute;transform:translateX(-50%);white-space:nowrap;
  font-size:11px;color:var(--ink-4)}
.lc-x span.off{display:none}
.lc-x span.xi{transform:none}
.lc-x span.xf{transform:translateX(-100%)}

/* ---- próximas renovaciones · lista financiera */
.rn-head{display:grid;grid-template-columns:minmax(170px,auto) 1fr minmax(110px,auto);
  gap:28px;padding:16px 28px 14px;border-bottom:1px solid var(--line)}
.rn-head .eyebrow{color:var(--ink-4)}
.rn-head span:last-child{text-align:right}
.rn{padding:2px 28px}
.rn-row{display:grid;grid-template-columns:minmax(170px,auto) 1fr minmax(110px,auto);
  gap:28px;align-items:center;padding:15px 0}
.rn-row + .rn-row{border-top:1px solid var(--line)}
.rn-f b{display:block;font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.rn-f span{display:block;margin-top:3px;font-size:12px;color:var(--ink-3)}
.rn-row.pronto .rn-f span{color:var(--alt-t)}
.rn-t{height:8px;border-radius:999px;background:rgba(255,240,235,.05);overflow:hidden}
.rn-t span{display:block;height:100%;border-radius:999px;min-width:4px;
  background:linear-gradient(90deg,var(--alt-d),var(--alt-t));
  transition:width .55s cubic-bezier(.22,1,.36,1),filter var(--t)}
.rn-row:hover .rn-t span{filter:brightness(1.2)}
.rn-n{text-align:right;font-size:20px;font-weight:600;color:var(--alt-t);white-space:nowrap}
.rn-total{display:grid;grid-template-columns:minmax(170px,auto) 1fr minmax(110px,auto);
  gap:28px;align-items:center;padding:20px 28px;border-top:1px solid var(--line-2);
  background:linear-gradient(90deg,rgba(147,115,240,.08),transparent 55%),rgba(0,0,0,.2)}
.rn-total .k{font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2)}
.rn-total .v{grid-column:3;text-align:right;font-size:24px;font-weight:600;color:var(--alt-t);letter-spacing:-.03em}
.rn-total .q{grid-column:2;font-size:12px;color:var(--ink-3)}
.rn-more{margin:16px 28px 0;width:calc(100% - 56px);justify-content:center}
.rn-foot{padding:16px 28px 20px;font-size:12px;color:var(--ink-3);line-height:1.55}
.rn-foot b{color:var(--ink-2);font-weight:600}

/* ═══════════════════════════════════════════ PUBLICIDAD / ROAS */
.pubhead{display:flex;align-items:center;justify-content:space-between;gap:10px 18px;
  flex-wrap:wrap;margin-bottom:16px}
.pubhead .est{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.pubhead .est b{color:var(--ink);font-weight:600}
.pill.pub-curso{color:var(--coral-t);border-color:rgba(239,91,67,.34);background:var(--coral-a)}
.pill.pub-curso::before{animation:latido 1.8s ease-in-out infinite;box-shadow:0 0 8px currentColor}
@keyframes latido{0%,100%{opacity:1}50%{opacity:.3}}
.pill.pub-cerrada{color:var(--ink);border-color:var(--line-3);background:rgba(255,240,235,.05)}
.pill.pub-cerrada::before{display:none}
.kpis.pub{grid-template-columns:repeat(3,1fr)}
.kpis.pub .v.z{color:var(--ink-4)}
.kpis.pub .kpi.menor .v{font-size:26px}
.kpis.pub .kpi.menor .ico{margin-bottom:16px}
.kpi.roasbg.pos{border-color:rgba(95,215,161,.16);background:radial-gradient(120% 110% at 104% -6%,rgba(45,178,125,.26),transparent 60%),var(--card)}
.kpi.roasbg.neg{border-color:rgba(255,111,128,.16);background:radial-gradient(120% 110% at 104% -6%,rgba(226,71,91,.24),transparent 60%),var(--card)}
.roasflow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);
  overflow:hidden;position:relative;
  background:
    radial-gradient(45% 130% at 100% 0%,rgba(239,91,67,.16),transparent 62%),
    linear-gradient(180deg,rgba(255,240,235,.03),transparent 40%),var(--card)}
.rf-paso{padding:30px 28px 26px;min-width:0}
.rf-paso .lbl{display:block;margin-bottom:12px}
.rf-paso .f{font-size:clamp(30px,3.1vw,44px);font-weight:600;letter-spacing:-.04em;
  line-height:1.02;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-paso .cap{margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.rf-paso.inv .f,.rf-paso.fac .f{color:var(--ink)}
.rf-paso .f.pos{color:var(--prof-t)} .rf-paso .f.neg{color:var(--loss-t)}
.rf-paso .f.z,.rf-paso.inv .f.z,.rf-paso.fac .f.z{color:var(--ink-4)}
.rf-paso.roas.pos{background:radial-gradient(130% 150% at 100% 0%,rgba(45,178,125,.14),transparent 62%)}
.rf-paso.roas.neg{background:radial-gradient(130% 150% at 100% 0%,rgba(226,71,91,.14),transparent 62%)}
.rf-flecha{display:grid;place-items:center;padding:0 4px;color:var(--coral-t)}
.rf-flecha svg{width:40px;height:40px;padding:10px;border-radius:50%;
  border:1px solid rgba(255,148,119,.24);background:var(--card-2);
  box-shadow:0 0 0 6px rgba(239,91,67,.04),0 0 24px -6px rgba(239,91,67,.6)}
.rf-pie{grid-column:1/-1;margin:0;padding:15px 28px;border-top:1px solid var(--line);
  background:rgba(0,0,0,.2);font-size:13px;color:var(--ink-2);text-align:center}
.rf-pie b{color:var(--prof-t);font-weight:600}

/* ═══════════════════════════════════════════════════ RESPONSIVE */
@media (max-width:1180px){
  .kpis.hero{grid-template-columns:1fr 1fr}
  .spot .grid:not(.tres){grid-template-columns:repeat(3,1fr)}
  .spot .grid:not(.tres) > div:nth-child(3n+1){box-shadow:none}
  .spot .grid:not(.tres) > div:nth-child(n+4){border-top:1px solid var(--line)}
  .rf-paso .f{font-size:clamp(26px,2.5vw,32px)}
  .kpis.pub .kpi.grande .v{font-size:clamp(26px,2.6vw,32px)}
}
/* la tabla necesita ~660 px libres; con la barra lateral eso son ~1000 px de
   ventana. Por debajo se pasa a tarjetas: nunca una barra horizontal. */
@media (max-width:1000px){
  .solo-ancho{display:none}
  .estlist.solo-estrecho{display:grid}
  .kpis.pub{grid-template-columns:1fr 1fr}
  .kpis.pub .kpi.grande .v{font-size:clamp(24px,3.2vw,32px)}
  .kpis.pub .kpi.menor .v{font-size:clamp(19px,2.6vw,24px)}
  /* el flujo pasa a vertical y la flecha apunta hacia abajo */
  .roasflow{grid-template-columns:minmax(0,1fr);background:
    radial-gradient(90% 38% at 100% 100%,rgba(239,91,67,.15),transparent 70%),
    linear-gradient(180deg,rgba(255,240,235,.03),transparent 40%),var(--card)}
  .rf-flecha{padding:0;height:22px;position:relative;z-index:1}
  .rf-flecha svg{transform:rotate(90deg);width:36px;height:36px;padding:9px}
  .rf-paso .f{font-size:clamp(28px,3.6vw,34px)}
  .rf-pie{text-align:left}
}
/* con la barra lateral visible, por debajo de ~960 px los rótulos largos
   no caben: rótulos cortos y pestañas a partes iguales */
@media (max-width:960px){
  .subtabs{width:100%}
  .subtab{flex:1 1 0;justify-content:center;padding:9px 10px;gap:8px}
  .subtab .lg{display:none}
  .subtab .sm{display:inline}
}
@media (max-width:900px){
  main{padding:26px 24px 80px}
  .goal-figs{gap:14px 34px}
  .goal-figs .f{font-size:28px}
  .orig{grid-template-columns:1fr}
  .orig-tile + .orig-tile{box-shadow:none;border-top:1px solid var(--line)}
  .recon{grid-template-columns:1fr 1fr}
  .recon > div:nth-child(odd){box-shadow:none}
  .recon > div:nth-child(n+3){border-top:1px solid var(--line)}
  .kpis.tres{grid-template-columns:1fr 1fr}
  .kpis.tres > :last-child{grid-column:1/-1}
  .kpis.cuatro{grid-template-columns:1fr 1fr}
  .lcwrap{padding:22px 22px 16px}
  .lc-plot{height:290px}
  .rn,.rn-total,.rn-foot,.rn-head{padding-left:22px;padding-right:22px}
  .rn-more{margin-left:22px;margin-right:22px;width:calc(100% - 44px)}
}
@media (max-width:760px){
  aside{display:none}
  .app{display:block}
  main{padding:0 16px 80px;max-width:none}
  body{background-attachment:scroll}

  /* cabecera móvil compacta */
  .topbar{
    display:block;position:sticky;top:0;z-index:40;
    background:linear-gradient(180deg,rgba(14,11,11,.94),rgba(10,8,8,.86));
    -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
    border-bottom:1px solid var(--line);margin:0 -16px 20px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 0;
  }
  .topbar .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .topbar .brand{padding:0 0 10px;gap:10px}
  .topbar .brand .mark{width:32px;height:32px;flex-basis:32px;border-radius:9px;font-size:11px}
  .topbar .brand b{font-size:14.5px}
  .topbar .brand span{font-size:11px;margin-top:0}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:500;
    color:var(--ink-2);border:1px solid var(--line);background:rgba(255,240,235,.03);
    white-space:nowrap;transition:background var(--t),color var(--t),border-color var(--t)}
  .tab.on{color:var(--ink);border-color:rgba(255,148,119,.34);
    background:linear-gradient(180deg,rgba(239,91,67,.18),rgba(239,91,67,.06));
    box-shadow:0 0 16px -6px rgba(239,91,67,.6)}

  .pagehead{margin-bottom:18px}
  .pagehead .over{margin-bottom:8px}
  .pagehead h1{font-size:24px;gap:10px}
  .pagehead .metas{gap:6px;margin-top:12px}
  .pagehead .metas span{font-size:11.5px;padding:4px 9px}
  section{margin-top:32px}
  .sechead{margin-bottom:12px}
  .sechead h2{font-size:17px}

  /* cuadrícula 2x2 exacta: ninguna tarjeta suelta ocupando media fila */
  .kpis{gap:10px;margin-bottom:10px}
  .kpis.hero,.kpis.four{grid-template-columns:1fr 1fr}
  .card{padding:14px 14px 15px;border-radius:var(--r-md)}
  .kpi .ico{width:30px;height:30px;margin-bottom:12px}
  .kpi .ico svg{width:14px;height:14px}
  .kpi .lbl{margin-bottom:7px;font-size:9.5px;letter-spacing:.11em}
  .kpi .v,.kpi.big .v{font-size:clamp(18px,5.6vw,24px)}
  .kpi .foot{font-size:11.5px;margin-top:7px;line-height:1.4}

  .spot,.panelbig,.tablewrap,.roasflow{border-radius:var(--r-md)}
  .spot .top{padding:16px}
  .spot .top h3{font-size:17px}
  .spot .meta{gap:6px}
  .spot .meta span{font-size:11.5px;padding:3px 9px}
  .spot .grid:not(.tres){grid-template-columns:1fr 1fr}
  .spot .grid:not(.tres) > div:nth-child(n){box-shadow:none;border-top:0}
  .spot .grid:not(.tres) > div:nth-child(even){box-shadow:inset 1px 0 0 var(--line)}
  .spot .grid:not(.tres) > div:nth-child(n+3){border-top:1px solid var(--line)}
  .spot .grid.tres{grid-template-columns:1fr 1fr}
  .spot .grid.tres > :last-child{grid-column:1/-1;box-shadow:none;border-top:1px solid var(--line)}
  .spot .grid > div,.spot .grid.tres > div{padding:14px 16px}
  .spot .grid .v{font-size:18px}
  .spot .grid.tres .v{font-size:16px}
  .spot .cta{padding:12px 16px}
  .spot .cta .linkbtn{width:100%;justify-content:center}

  /* objetivo: cifra principal arriba, las otras dos debajo */
  .goal{padding:20px 18px 18px;margin-bottom:24px;border-radius:var(--r-lg)}
  .goal-head{margin-bottom:16px;gap:10px}
  .goal-head h2{font-size:11px;letter-spacing:.12em}
  .goal-target{font-size:11px;padding:5px 11px}
  .goal-figs{grid-template-columns:1fr 1fr;gap:14px 18px;margin-bottom:16px}
  .goal-figs > div:first-child{grid-column:1/-1}
  .goal-figs .f{font-size:24px}
  .goal-figs > div:first-child .f{font-size:34px}
  .goal-track{height:8px}
  .goal-foot{font-size:11.5px;justify-content:flex-start}
  .goal-foot .mono{display:none}
  .goal-foot .msg{text-align:left}

  /* desglose: nombre arriba, barra y cifras debajo */
  .brk{padding:6px 16px 4px}
  .brk-row{grid-template-columns:1fr auto;gap:10px 12px;padding:14px 0}
  .brk-name{grid-column:1;grid-row:1;font-size:13.5px}
  .brk-pct{grid-column:2;grid-row:1;font-size:12px}
  .brk-track{grid-column:1;grid-row:2;height:6px}
  .brk-amt{grid-column:2;grid-row:2;font-size:14px}
  .brk-total{grid-template-columns:1fr auto;gap:8px 12px;padding:15px 16px}
  .brk-total .k{grid-column:1;grid-row:1}
  .brk-total .v{grid-column:2;grid-row:1;font-size:18px}
  .brk-total .q{grid-column:1/-1;grid-row:2;justify-self:start}

  .orig-tile{padding:18px 16px 19px}
  .orig-tile .f{font-size:28px;margin-bottom:13px}
  .recon > div{padding:13px 16px}
  .panelbig .cap{padding:16px 16px 0;font-size:12.5px}

  .subtabs{width:100%;margin-bottom:22px}
  .subtab{flex:1 1 0;justify-content:center;padding:9px 8px;font-size:13px;gap:8px}
  .subtab .lg{display:none}
  .subtab .sm{display:inline}

  /* pedidos: 2x2, gráfica a ancho completo y sin scroll de página */
  .kpis.tres,.kpis.cuatro{grid-template-columns:1fr 1fr}
  .kpi.grande .v{font-size:clamp(20px,6vw,26px)}
  .kpi.grande .v.fecha{font-size:clamp(16px,4.7vw,20px)}
  .lcwrap{padding:18px 12px 12px}
  .lc{padding-left:46px}
  .lc-plot{height:236px}
  .lc-area{left:11px;right:11px}
  .lc-x{margin-left:11px;margin-right:11px}
  .lc-line b{font-size:10px;right:calc(100% + 9px)}
  .lc-x span{font-size:10px}
  .lc-dot{width:8px;height:8px}
  .rn-head{grid-template-columns:1fr auto;gap:14px;padding:13px 16px 12px}
  .rn-head span:nth-child(2){display:none}
  .rn{padding:0 16px}
  .rn-row{grid-template-columns:1fr auto;gap:9px 14px;padding:14px 0}
  .rn-f{grid-column:1;grid-row:1}
  .rn-n{grid-column:2;grid-row:1;font-size:18px}
  .rn-t{grid-column:1/-1;grid-row:2;height:6px}
  .rn-total{grid-template-columns:1fr auto;gap:5px 14px;padding:15px 16px}
  .rn-total .k{grid-column:1;grid-row:1}
  .rn-total .v{grid-column:2;grid-row:1;font-size:20px}
  .rn-total .q{grid-column:1/-1;grid-row:2}
  .rn-more{margin:14px 16px 0;width:calc(100% - 32px)}
  .rn-foot{padding:14px 16px 16px}

  /* publicidad: 2 + 2 + 2, ninguna tarjeta suelta */
  .kpis.pub .kpi.grande .v{font-size:clamp(19px,6vw,26px)}
  .kpis.pub .kpi.menor .v{font-size:clamp(17px,5.4vw,22px)}
  .kpis.pub .kpi.menor .ico{margin-bottom:12px}
  .pubhead{margin-bottom:14px}
  .rf-paso{padding:18px 16px 16px}
  .rf-paso .f{font-size:clamp(26px,8vw,32px)}
  .rf-pie{padding:13px 16px}
}
@media (max-width:440px){
  .subtab{padding:9px 4px;gap:6px;font-size:12.5px}
  .subtab .n{padding:2px 5px;font-size:10px}
}
@media (max-width:400px){
  .subtab .dot{display:none}
  .kpis{gap:8px}
  .card{padding:13px 12px 14px}
  .kpi .ico{width:28px;height:28px;margin-bottom:10px}
  .goal-figs > div:first-child .f{font-size:30px}
  .estcard-grid > div{padding:12px 13px}
  .estcard-top,.estcard-pie{padding-left:13px;padding-right:13px}
}

  const CLAVE = 'mc-dash-pass';

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function abrir(pass){
    if (!(window.crypto && crypto.subtle))
      throw new Error('Este navegador no permite descifrar aquí (hace falta HTTPS).');
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
                                             'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(PAQ.salt), iterations:PAQ.iter, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const claro = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAQ.iv)}, k, b64(PAQ.ct));
    return JSON.parse(new TextDecoder().decode(claro));
  }

      try { localStorage.removeItem(CLAVE); } catch(_){}
      err.textContent = e.message && e.message.includes('HTTPS')
        ? e.message : 'Contraseña incorrecta.';
      btn.disabled = false; btn.textContent = 'Entrar';
      inp.value = ''; inp.focus();
    }
  }

  form.addEventListener('submit', e => { e.preventDefault(); entrar(inp.value, rec.checked); });

  let guardada = null;
  try { guardada = localStorage.getItem(CLAVE); } catch(e){}
  if (guardada){ rec.checked = true; entrar(guardada, true); } else { inp.focus(); }
})();
</script>

<body>
<div class="app">
  <aside id="side"></aside>
  <main>

</div>

<script>
let D = null;

/* ══════════════════════════════════════════════ FORMATO (es-ES) */
/* useGrouping:'always' para que 2500 salga como «2.500 €» y no «2500 €» */
const nf  = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',
              minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:'always'});
const nf0 = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',
              maximumFractionDigits:0, useGrouping:'always'});
const RAYA = '—';
const ok = v => typeof v === 'number' && isFinite(v);
const eur  = v => ok(v) ? nf.format(v) : RAYA;
const eur0 = v => ok(v) ? nf0.format(v) : RAYA;
const eurS = v => ok(v) ? (v > 0 ? '+' : '') + nf0.format(v) : RAYA;
const pct  = v => ok(v) ? new Intl.NumberFormat('es-ES',{minimumFractionDigits:1,
               maximumFractionDigits:1}).format(v) + ' %' : RAYA;
const ent  = v => ok(v) ? new Intl.NumberFormat('es-ES').format(v) : RAYA;
const fch  = s => { if(!s) return RAYA; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; };
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));


/* ══════════════════════════════════════════════ ICONOS (solo decoración) */
const svgI = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICO = {
  home:   svgI('<path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/>'),
  layers: svgI('<path d="m12 4 8 4.5-8 4.5-8-4.5z"/><path d="m4 13 8 4.5 8-4.5"/>'),
  profit: svgI('<path d="m4 16 5.5-5.5 4 4L20 8"/><path d="M15 8h5v5"/>'),
  rev:    svgI('<rect x="3.5" y="6" width="17" height="12.5" rx="2.5"/><path d="M3.5 10h17M7.5 14.5h3"/>'),
  inv:    svgI('<ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7"/><path d="M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/>'),
  roi:    svgI('<path d="M18 6 6 18"/><circle cx="7.5" cy="7.5" r="2.2"/><circle cx="16.5" cy="16.5" r="2.2"/>'),
  bag:    svgI('<path d="M5.5 8h13l-1 12h-11z"/><path d="M9 8a3 3 0 0 1 6 0"/>'),
  repeat: svgI('<path d="m17 3 3 3-3 3"/><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H20"/><path d="m7 21-3-3 3-3"/><path d="M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H4"/>'),
  cal:    svgI('<rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>'),
  mega:   svgI('<path d="M4 10.5v3a1 1 0 0 0 1 1h2.5L13 18V6L7.5 9.5H5a1 1 0 0 0-1 1z"/><path d="M16.5 9a4 4 0 0 1 0 6"/>'),
  target: svgI('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".8"/>'),
  coin:   svgI('<circle cx="12" cy="12" r="8"/><path d="M14.5 9.2a3.2 3.2 0 1 0 0 5.6M8 11h5M8 13h5"/>'),
  ticket: svgI('<path d="M4 7.5h16v3a2 2 0 0 0 0 3v3H4v-3a2 2 0 0 0 0-3z"/><path d="M14 8v8" stroke-dasharray="1.5 2"/>'),
};

const vacio = (t) => `<div class="empty"><span class="big">${esc(t||'Sin datos todavía')}</span>
  Aparecerá aquí en cuanto se registre en el Excel.</div>`;

/* ══════════════════════════════════════════════ OBJETIVOS
   Meter de una sola tinta (rampa dorada) sobre pista del mismo tono.
   Reglas: la barra nunca es negativa ni pasa del 100 %, y lo que falta
   nunca supera al objetivo aunque haya perdidas. */
const OBJ_GLOBAL = 1000000;
const OBJ_ESTRUCTURA = 50000;

const pctMeta = v => v <= 0 ? '0 %'
  : v < 0.1 ? '< 0,1 %'
  : new Intl.NumberFormat('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1})
      .format(v) + ' %';

function metaHTML(titulo, facturacion, objetivo, etiqueta){
  /* La barra se alimenta EXCLUSIVAMENTE de facturación neta registrada.
     Ni profit, ni ROI, ni gastos, ni saldo entran aquí. */
  const p       = ok(facturacion) ? facturacion : 0;
  const logrado = Math.max(0, p);                    // nunca cuenta en negativo
  const pv      = objetivo > 0 ? logrado / objetivo * 100 : 0;
  const ancho   = Math.min(100, pv);                 // tope visual en 100 %
  const falta   = Math.max(0, objetivo - logrado);   // nunca mas que el objetivo
  const completo = p >= objetivo;                    // barra al 100 %
  const excede   = p >  objetivo;                    // solo entonces: EXCEDENTE

  const msg = p < 0
      ? 'Facturación neta negativa: hay más devoluciones y contracargos que ventas.'
    : p === 0
      ? 'Todavía sin facturación registrada.'
    : excede
      ? `Objetivo superado en ${eur0(p - objetivo)}.`
    : completo
      ? '¡Objetivo alcanzado!'
      : `Queda el ${pctMeta(100 - pv)} del camino.`;

  return `
  <section class="goal anim">
    <div class="goal-head">
      <div class="goal-title"><span class="dia"></span><h2>${esc(titulo)}</h2></div>
      <span class="goal-target">Objetivo · ${nf0.format(objetivo)}</span>
    </div>
    <div class="goal-figs">
      <div><span class="lbl eyebrow">${esc(etiqueta)}</span>
        <div class="f num ${p<0?'neg':'rev'}">${eur0(p)}</div></div>
      <div><span class="lbl eyebrow">Conseguido</span>
        <div class="f gold">${esc(pctMeta(pv))}</div></div>
      <div><span class="lbl eyebrow">${excede?'Excedente':'Falta para el objetivo'}</span>
        <div class="f">${excede?eur0(p-objetivo):eur0(falta)}</div></div>
    </div>
    <div class="goal-track">
      <span class="goal-fill" style="width:${ancho.toFixed(4)}%"></span></div>
    <div class="goal-foot">
      <span class="mono">0 €</span>
      <span class="msg">${esc(msg)}</span>
      <span class="mono">${nf0.format(objetivo)}</span>
    </div>
  </section>`;
}

/* ══════════════════════════════════════════════ DESGLOSE DE LA INVERSIÓN
   Una fila por partida real. Los generales imputados salen con su propio
   nombre y etiqueta: asi la suma cuadra SIEMPRE con el total invertido. */
function colorPartida(x){
  if (x.tipo === 'residual') return 'var(--bar-res)';
  if (x.tipo === 'general')  return 'var(--bar-gen)';
  return x.nombre === 'Publicidad' ? 'var(--bar-pub)' : 'var(--bar-dir)';
}
function desgloseHTML(items, total, nota){
  if (!items.length) return `<div class="panelbig">${vacio('Todavía no hay gastos')}</div>`;
  const max = Math.max(...items.map(i => Math.abs(i.importe)), 1);
  const suma = items.reduce((a,b) => a + b.importe, 0);
  const cuadra = Math.abs(suma - total) < 0.005;
  const filas = items.map(x => `
    <div class="brk-row">
      <div class="brk-name"><span class="t" title="${esc(x.nombre)}">${esc(x.nombre)}</span>${
        x.tipo === 'general'  ? '<span class="tag gen">general</span>' :
        x.tipo === 'residual' ? '<span class="tag res">sin clasificar</span>' : ''}</div>
      <span class="brk-track"><span class="brk-fill" style="width:${
        (Math.max(0,x.importe)/max*100).toFixed(2)}%;background:${colorPartida(x)}"></span></span>
      <div class="brk-amt">${eur(x.importe)}</div>
      <div class="brk-pct">${pct(x.pct)}</div>
    </div>`).join('');
  return `
  <div class="panelbig">
    ${nota ? `<p class="cap">${nota}</p>` : ''}
    <div class="brk">${filas}</div>
    <div class="brk-total">
      <div class="k">Total invertido</div>
      <div class="v num">${eur(total)}</div>
      <div class="q">${cuadra ? '✓ el desglose cuadra'
        : `⚠ diferencia de ${eur(suma - total)}`}</div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════ ORIGEN DEL DINERO */
function origenHTML(o, total){

        <div class="orig-bar"><span style="width:${
          (Math.max(0,t.v)/max*100).toFixed(2)}%;background:${t.c}"></span></div>
        <div class="orig-share">${total?pct(t.v/total*100):RAYA} de la inversión</div>
        <div class="orig-sub">${t.s}</div>
      </div>`).join('')}</div>
    <div class="recon">
      <div><span class="lbl eyebrow">Adelanto personal M</span><b style="color:${
        o.adelantoM?'var(--m)':'var(--ink-3)'}">${eur(o.adelantoM)}</b></div>
      <div><span class="lbl eyebrow">Adelanto personal C</span><b style="color:${
        o.adelantoC?'var(--c)':'var(--ink-3)'}">${eur(o.adelantoC)}</b></div>
      <div><span class="lbl eyebrow">Adelantos en total</span><b style="color:${
        adel?'var(--ink)':'var(--ink-3)'}">${eur(adel)}</b></div>
      <div class="${cuadra?'ok':'warn'}"><span class="lbl eyebrow">Suma de los orígenes</span>
        <b>${eur(suma)} ${cuadra?'✓':'⚠'}</b></div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════ PEDIDOS Y SUSCRIPCIONES
   Cada pedido genera UNA sola suscripcion, 30 dias EXACTOS despues de la
   compra. No hay segundo ciclo. Aqui solo se pinta: las fechas las calcula
   extract.py desde las cohortes, nunca se escribe una fila futura en el Excel.
   Los numeros son PREVISTOS: no confirman ningun cobro de Stripe. */
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIASEM = ['dom','lun','mar','mié','jue','vie','sáb'];
const dOf = s => new Date(s + 'T00:00:00');
const fchCorta = s => { const [y,m,d] = s.split('-'); return `${d} ${MESES[+m - 1]}`; };
const diaSemana = s => DIASEM[dOf(s).getDay()];
const sumaDias = (s, n) => new Date(dOf(s).getTime() + n * 864e5).toISOString().slice(0,10);
const distancia = (a, b) => Math.round((dOf(b) - dOf(a)) / 864e5);
const plural = (n, s, p) => `${ent(n)} ${n === 1 ? s : p}`;

/* escala del eje Y: siempre tramos "redondos" (2, 5, 10, 20, 50...) y un
   techo ajustado al maximo real, para que las barras no salgan diminutas */
function escalaY(max){
  if (!(max > 0)) return {techo:4, pasos:[0,1,2,3,4]};
  const bruto = max / 4;
  const exp = Math.pow(10, Math.floor(Math.log10(bruto)));
  const paso = [1,2,2.5,5,10].map(m => m * exp).find(v => v >= bruto) || 10 * exp;
  const techo = Math.ceil(max / paso) * paso;
  const pasos = [];
  for (let v = 0; v <= techo + 1e-9; v += paso) pasos.push(v);
  return {techo, pasos};
}

let renovAmpliado = false;      /* «ver más» del listado de renovaciones */
const VENTANA_LISTA = 60;       /* días que se muestran de entrada */

/* La variable de la gráfica es la FACTURACIÓN DIARIA OPERACIONAL (€), no los
   pedidos. Es la cifra que él va dando día a día; la facturación financiera
   (profit, ROI, objetivos) es otra y vive en INGRESOS ESTRUCTURAS. */
function graficaFacturacion(p){
  if (!p.serie.length) return vacio('Todavía no hay facturación');
  const n = p.serie.length;
  const {techo, pasos} = escalaY(p.maxFact);
  const lineas = pasos.map(v => `
    <div class="lc-line ${v === 0 ? 'base' : ''}" style="bottom:${
      (v / techo * 100).toFixed(3)}%"><b>${v ? eur0(v) : '0'}</b></div>`).join('');

  /* coordenadas en un lienzo 0-100 que luego se estira al ancho real */
  const px = i => n === 1 ? 50 : i / (n - 1) * 100;
  const py = v => 100 - (techo ? v / techo * 100 : 0);
  const pts = p.serie.map((x, i) => `${px(i).toFixed(3)},${py(x.facturacion).toFixed(3)}`);
  const linea = n === 1 ? '' : `<polyline points="${pts.join(' ')}" fill="none"
      stroke="var(--alt-t)" stroke-width="2.2" vector-effect="non-scaling-stroke"
      stroke-linejoin="round" stroke-linecap="round"/>`;
  const area = n === 1 ? '' : `<polygon fill="url(#lcGrad)"
      points="${px(0).toFixed(3)},100 ${pts.join(' ')} ${px(n-1).toFixed(3)},100"/>`;

  const puntos = p.serie.map((x, i) => {
    const alto = 100 - py(x.facturacion);    /* % del punto, medido desde abajo */
    /* el globo va justo encima del punto; si el punto está muy arriba, debajo */
    const sitio = alto > 72
      ? `top:calc(${(100 - alto).toFixed(2)}% + 22px)`
      : `bottom:calc(${alto.toFixed(2)}% + 22px)`;
    return `
    <div class="lc-hit ${i === 0 ? 'xi' : ''} ${i === n - 1 ? 'xf' : ''}"
         style="left:${px(i).toFixed(3)}%;width:${(n === 1 ? 100 : 100 / (n - 1)).toFixed(3)}%">
      <div class="lc-tip" style="${sitio}">
        <span class="d">${diaSemana(x.fecha)} · ${fch(x.fecha)}</span>
        <span class="v ${x.facturacion ? '' : 'z'}">${eur(x.facturacion)}</span>
        <span class="s">${plural(x.pedidos,'pedido','pedidos')}</span></div>
      <span class="lc-dot" style="bottom:${alto.toFixed(3)}%;
        animation-delay:${Math.min(i * 22, 420)}ms"></span>
    </div>`;
  }).join('');

  /* se emiten todas; ajustarEtiquetas() esconde las que no quepan, ya medido */
  const etiquetas = p.serie.map((x, i) =>
    `<span class="${i === 0 ? 'xi' : ''} ${i === n - 1 ? 'xf' : ''}"
       style="left:${px(i).toFixed(3)}%">${esc(fchCorta(x.fecha))}</span>`).join('');

  return `<div class="lcwrap"><div class="lc">
    <div class="lc-plot">
      ${lineas}
      <div class="lc-area ${n > 45 ? 'denso' : ''}">
        <svg class="lc-svg" viewBox="0 0 100 100" preserveAspectRatio="none"
             aria-hidden="true">
          <defs><linearGradient id="lcGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#9373F0" stop-opacity=".34"/>
            <stop offset="55%" stop-color="#9373F0" stop-opacity=".09"/>
            <stop offset="100%" stop-color="#9373F0" stop-opacity="0"/>
          </linearGradient></defs>
          ${area}${linea}
        </svg>
        ${puntos}
      </div>
    </div>
    <div class="lc-x">${etiquetas}</div>
  </div></div>`;
}

/* Cuántas fechas caben en el eje X solo se sabe cuando está pintado: se mide
   el ancho real y el de la etiqueta más larga, y se ocultan las sobrantes.
   Los PUNTOS de la serie no se tocan nunca: solo desaparecen etiquetas. */
function ajustarEtiquetas(){
  document.querySelectorAll('.lc-x').forEach(eje => {
    const et = [...eje.children];
    const n = et.length;
    if (!n) return;
    et.forEach(e => e.classList.remove('off'));
    const ancho = eje.clientWidth || 300;
    const pide = Math.max(...et.map(e => e.offsetWidth)) + 16;   // + aire
    const caben = Math.max(2, Math.floor(ancho / pide));
    const cada = Math.max(1, Math.ceil(n / caben));
    /* siempre se intenta enseñar el primer y el último día: son los extremos
       de la vida de la estructura. Si el último choca, la pasada siguiente
       sacrifica a su vecino, no a él. */
    et.forEach((e, i) => {
      if (!(i % cada === 0 || i === n - 1)) e.classList.add('off');
    });

    /* Segunda pasada, ya con las medidas en pantalla: la primera etiqueta va
       pegada a la izquierda y la última a la derecha, así que pueden rozar con
       su vecina aunque el reparto fuese correcto. Se quita la que sobre. */
    const visibles = () => et.filter(e => !e.classList.contains('off'));
    let quedan = visibles(), i = 1;
    while (i < quedan.length){
      const a = quedan[i - 1].getBoundingClientRect();
      const b = quedan[i].getBoundingClientRect();
      if (b.left < a.right + 7){
        /* si el que choca es el último, interesa más la fecha final: se
           sacrifica el anterior */
        (i === quedan.length - 1 ? quedan[i - 1] : quedan[i]).classList.add('off');
        quedan = visibles();
        i = Math.max(1, i - 1);
      } else i++;
    }
  });
}

function renovacionesHTML(p, hoy){
  if (!p.renovaciones.length)
    return `<div class="panelbig">${vacio('No hay renovaciones previstas todavía')}</div>`;

  const limite = sumaDias(hoy, VENTANA_LISTA);
  const dentro = p.renovaciones.filter(r => r.fecha <= limite);
  const base = dentro.length ? dentro : p.renovaciones.slice(0, 12);
  const lista = renovAmpliado ? p.renovaciones : base;
  const resto = p.renovaciones.length - lista.length;
  const max = Math.max(...lista.map(r => r.suscripciones), 1);
  const lim30 = sumaDias(hoy, 30);

  const filas = lista.map(r => {
    const d = distancia(hoy, r.fecha);
    return `
    <div class="rn-row ${r.fecha <= lim30 ? 'pronto' : ''}">
      <div class="rn-f"><b>${fch(r.fecha)}</b>
        <span>${diaSemana(r.fecha)} · ${d === 0 ? 'hoy'
          : d === 1 ? 'mañana' : `dentro de ${plural(d,'día','días')}`}</span></div>
      <span class="rn-t"><span style="width:${
        (r.suscripciones / max * 100).toFixed(2)}%"></span></span>
      <div class="rn-n">${ent(r.suscripciones)}</div>
    </div>`;
  }).join('');

  return `
  <div class="panelbig">
    <div class="rn-head">
      <span class="eyebrow">Fecha prevista</span>
      <span class="eyebrow">Peso de la cohorte</span>
      <span class="eyebrow">Suscripciones</span>
    </div>
    <div class="rn">${filas}</div>
    <div class="rn-total">
      <div class="k">Próximos 30 días</div>
      <div class="q">Suma de todas las renovaciones previstas entre hoy y el
        ${fch(lim30)}.</div>
      <div class="v">${ent(p.renov30)}</div>
    </div>
    ${resto > 0 ? `<button class="linkbtn rn-more" data-act="renov-mas">
       Ver las ${ent(resto)} fechas siguientes →</button>` : ''}
    ${renovAmpliado && resto === 0 && p.renovaciones.length > base.length
       ? `<button class="linkbtn rn-more" data-act="renov-menos">Ver menos</button>` : ''}
    <p class="rn-foot">Son suscripciones <b>previstas</b>: cada pedido genera
      <b>una sola</b>, exactamente 30 días después de la compra. Ahí termina su ciclo.
      No confirman ningún cobro.</p>
  </div>`;
}

/* ---------------------------------------------- pestaña: pedidos */
function tabPedidos(e, hoy){
  const p = e.pedidos;
  const prox = p.proxima;
  return `
  <div class="kpis cuatro anim">
    <div class="card kpi grande ${p.total ? 'altbg' : ''}">
      <span class="ico">${ICO.bag}</span><span class="lbl eyebrow">Pedidos totales</span>
      <span class="v num ${p.total ? 'alt' : ''}">${ent(p.total)}</span>
      <span class="foot">${p.total
        ? `En <b>${plural(p.nDias,'día','días')}</b> con pedidos · del
           ${fch(p.primerDia)} al ${fch(p.ultimoDia)}`
        : 'Todavía sin pedidos registrados.'}</span></div>

    <div class="card kpi grande">
      <span class="ico">${ICO.rev}</span><span class="lbl eyebrow">Facturación acumulada</span>
      <span class="v num ${p.facturacionDiaria ? 'alt' : ''}">${eur0(p.facturacionDiaria)}</span>
      <span class="foot">${p.facturacionDiaria

/* ══════════════════════════════════════════════ PUBLICIDAD / ROAS
   Cierre GLOBAL de la publicidad de una estructura. Solo dos cifras de entrada
   (inversión y facturación atribuida); ROAS, coste por pedido y ticket medio
   se derivan. Son cifras de ANÁLISIS: no suman gasto ni ingreso, y el estado
   de la publicidad es independiente del de la estructura. No hay datos
   diarios, así que aquí no hay gráfica temporal. */
const roasF = v => ok(v) ? new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,
                 maximumFractionDigits:2}).format(v) + 'x' : RAYA;
const FLECHA = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>`;

function tabPublicidad(e){
  const a = e.cierrePublicidad;
  const cerrada = a.estado === 'cerrada';
  const tono = !ok(a.roas) ? '' : a.roas >= 1 ? 'pos' : 'neg';
  const z = v => ok(v) ? '' : 'z';
  const exacto = v => ok(v) && Math.round(v) !== v ? ` · ${eur(v)} exactos` : '';
  const pedidos = cerrada ? a.pedidosCierre : a.pedidosActuales;

  return `
  <div class="pubhead anim">
    <div class="est">
      <span class="pill ${cerrada ? 'pub-cerrada' : 'pub-curso'}">${
        cerrada ? '✓ Publicidad cerrada' : 'Publicidad en curso'}</span>
      <span>${cerrada ? `Cerrada el <b>${fch(a.fechaCierre)}</b>` : 'Pendiente de cierre'}</span>
    </div>
    <span class="est">Estado de la estructura
      <span class="pill ${e.estado.toLowerCase()}">${esc(e.estado)}</span></span>
  </div>

  <div class="kpis pub anim">
    <div class="card kpi grande"><span class="ico">${ICO.mega}</span><span class="lbl eyebrow">Inversión publicitaria</span>
      <span class="v num ${cerrada ? 'spend' : 'z'}">${eur0(a.inversion)}</span>
      <span class="foot">${cerrada ? `Total del período publicitario${exacto(a.inversion)}`
        : 'Se introduce al cerrar la publicidad'}</span></div>
    <div class="card kpi grande"><span class="ico">${ICO.rev}</span><span class="lbl eyebrow">Facturación generada</span>
      <span class="v num ${cerrada ? 'rev' : 'z'}">${eur0(a.facturacion)}</span>
      <span class="foot">${cerrada ? `Atribuida a la publicidad${exacto(a.facturacion)}`
        : 'Se introduce al cerrar la publicidad'}</span></div>
    <div class="card kpi grande roasbg ${tono}"><span class="ico">${ICO.target}</span><span class="lbl eyebrow">ROAS total</span>
      <span class="v num ${tono || 'z'}">${roasF(a.roas)}</span>
      <span class="foot">${ok(a.roas) ? `<b>${eur(a.roas)}</b> por cada euro invertido`
        : cerrada ? 'Sin inversión no se puede calcular' : 'Facturación ÷ inversión'}</span></div>
    <div class="card kpi menor"><span class="ico">${ICO.bag}</span><span class="lbl eyebrow">${cerrada ? 'Pedidos al cierre' : 'Pedidos actuales'}</span>
      <span class="v num ${ok(pedidos) && pedidos > 0 ? 'alt' : 'z'}">${ent(pedidos)}</span>
      <span class="foot">${cerrada ? 'Foto guardada al cerrar la publicidad'
        : 'Quedarán fijados al cerrar la publicidad'}</span></div>
    <div class="card kpi menor"><span class="ico">${ICO.coin}</span><span class="lbl eyebrow">Coste por pedido</span>
      <span class="v num ${z(a.costePedido)}">${eur(a.costePedido)}</span>
      <span class="foot">${cerrada && !ok(a.costePedido) ? 'Sin pedidos no se puede calcular'
        : 'Inversión ÷ pedidos'}</span></div>
    <div class="card kpi menor"><span class="ico">${ICO.ticket}</span><span class="lbl eyebrow">Ticket medio</span>
      <span class="v num ${z(a.ticketMedio)}">${eur(a.ticketMedio)}</span>
      <span class="foot">${cerrada && !ok(a.ticketMedio) ? 'Sin pedidos no se puede calcular'
        : 'Facturación ÷ pedidos'}</span></div>
  </div>

  <section class="anim">
    <div class="sechead"><h2>Resultado del período publicitario</h2>
      <span class="note">${cerrada ? `Hasta el ${fch(a.fechaCierre)}`
        : 'De principio a fin de la publicidad'}</span></div>
    <div class="roasflow">
      <div class="rf-paso inv"><span class="lbl eyebrow">Invertido</span>
        <div class="f num ${cerrada ? '' : 'z'}">${eur0(a.inversion)}</div>
        <div class="cap">en publicidad</div></div>
      <div class="rf-flecha">${FLECHA}</div>
      <div class="rf-paso fac"><span class="lbl eyebrow">Generado</span>
        <div class="f num ${cerrada ? '' : 'z'}">${eur0(a.facturacion)}</div>
        <div class="cap">de facturación atribuida</div></div>
      <div class="rf-flecha">${FLECHA}</div>
      <div class="rf-paso roas ${tono}"><span class="lbl eyebrow">ROAS</span>
        <div class="f num ${tono || 'z'}">${roasF(a.roas)}</div>
        <div class="cap">retorno de la inversión publicitaria</div></div>
      <p class="rf-pie">${cerrada
        ? (ok(a.roas) ? `Cada euro invertido en publicidad generó <b>${eur(a.roas)}</b> de facturación.`
                      : 'Sin inversión registrada no se puede calcular el retorno.')
        : 'Los resultados aparecerán cuando se cierre el período publicitario.'}</p>

/* ══════════════════════════════════════════════ ROUTER
   El hash lleva la estructura y, opcionalmente, la pestaña:
     #001-Estructura-MC            -> resumen financiero
     #001-Estructura-MC/pedidos    -> pedidos y suscripciones
   Asi el enlace se puede compartir y sobrevive a una recarga. */
let actual = 'overview';
let pestana = 'finanzas';

const PESTANAS = ['finanzas', 'pedidos', 'publicidad'];
function hashActual(){
  return actual === 'overview' ? ''
    : encodeURIComponent(actual) + (pestana !== 'finanzas' ? '/' + pestana : '');
}
function leerHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return {id:'overview', tab:'finanzas'};
  const i = h.lastIndexOf('/');
  const cola = i > 0 ? h.slice(i + 1) : '';
  const tab = cola !== 'finanzas' && PESTANAS.includes(cola) ? cola : 'finanzas';
  return {id: tab !== 'finanzas' ? h.slice(0, i) : h, tab};
}
function pintar(mantener){
  const y = window.scrollY;
  document.getElementById('side').innerHTML = navHTML(actual);
  document.getElementById('topbar').innerHTML = topHTML(actual);
  document.getElementById('view').innerHTML =
    actual === 'overview' ? overview() : paginaEst(actual);
  ajustarEtiquetas();
  scrollTo({top: mantener ? y : 0, behavior:'instant'});
}
document.addEventListener('click', ev => {
  const a = ev.target.closest('[data-act]');
  if (a){
    if (a.dataset.act === 'renov-mas')  renovAmpliado = true;
    if (a.dataset.act === 'renov-menos') renovAmpliado = false;
    pintar(true);
    return;
  }
  const t = ev.target.closest('[data-tab]');
  if (t){
    if (t.dataset.tab === pestana) return;
    pestana = t.dataset.tab;
    renovAmpliado = false;
    location.hash = hashActual();
    pintar();
    return;
  }
  const b = ev.target.closest('[data-go]');
  if (!b) return;
  /* al cambiar de estructura se vuelve siempre al resumen financiero:
     asi el comportamiento es el mismo pase lo que pase */
  actual = b.dataset.go;
  pestana = 'finanzas';
  renovAmpliado = false;
  location.hash = hashActual();
  pintar();
});
let temporizadorAncho = null, anchoPrevio = window.innerWidth;
addEventListener('resize', () => {
  if (window.innerWidth === anchoPrevio) return;   // el teclado móvil no cuenta
  anchoPrevio = window.innerWidth;
  clearTimeout(temporizadorAncho);
  temporizadorAncho = setTimeout(() => pintar(true), 160);
});
addEventListener('hashchange', () => {
  const {id, tab} = leerHash();
  if (id !== actual || tab !== pestana){
    actual = id; pestana = tab; renovAmpliado = false; pintar();
  }
});
function arrancar(datos){
  D = datos;
  const {id, tab} = leerHash();
  if (id !== 'overview' && D.estructuras.some(e => e.id === id)){
    actual = id; pestana = tab;
  }
  pintar();
}

</script>
